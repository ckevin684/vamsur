// ═══ PLAYER ═══
class Player{
  constructor(cd){
    this.cd=cd;this.x=0;this.y=0;
    this.hp=cd.hp;this.mhp=cd.hp;
    this.spd=cd.spd;this.bspd=cd.spd;
    this.def=cd.def;this.lv=1;this.xp=0;this.xpn=15;
    this.dm=cd.id==='gj'?1.3:1;this.as=1;this.am=1;this.xpm=1;this.metaDmg=1;  // gj 1.4→1.3 (3축 중 2축 압도 완화)
    this.pierce=0;this.regen=BAL.regen.base;this.iframes=1.2;this.knockback=1;  // 기본 체젠 (진통제는 추가분) · 넉백 배율
    this.hitT=0;this.regenT=0;this.regenLockT=0;this.magr=80;
    this.facing={x:1,y:0};
    this.passives={};  // {id: lv}
    this.wpns=[{type:cd.startWpn,t:0,lv:1}];
    this.flashT=0;this.bdm=1;this.crit=cd.id==='co'?BAL.char.co.critBase:0;
    this.itemLog=[];
    this.dashT=0;this.dashCd=0;this.dashCdMax=3;
    this.companions=[];this.magrBoost=0;
    this.bouncingRams=[];  // 준형 영구 RAM (매 발사마다 새로 안 만들고 갯수만 유지)
    // 차지 액스 페이얼 시스템
    this.cbGauge=0;
    this.cbMode='sword';
    this.cbAxeT=0;
    this.cbAxeMax=5;
    // 윤소민 스텔라이브 변신 시스템
    this.streamerForm=null;    // 현재 변신 (null = 평소)
    this.streamerT=30;         // 다음 룰렛까지 시간
    this.rouletteT=0;          // 룰렛 애니메이션 시간 (스핀+감속)
    this.rouletteResult=null;  // 룰렛 결과
    this.awaitingClick=false;  // 룰렛 끝난 후 결과 카드 클릭 대기 (true면 게임 정지)
    this.resultCardT=0;        // (deprecated, 호환용)
    this.lastWasSleep=false;   // 직전 룰렛이 졸음이었나 (2연속 → 야근 컷신 트리거)
    this.workCut=0;            // 야근 전화 컷신 진행 (0=없음, 1=사장 대사, 2=소민 대사)
    // 지워니 — 📈 주식 (처치→현금, 투자창서 4종목 올인 → 차트 변동으로 현금↕ → 랜덤 상점서 스탯 구매)
    this.seedMoney=0;          // 보유 현금
    this.stocks=STOCKS.map(()=>({price:100,hist:[100]}));  // 4종목 가격
    this.invest=null;          // 현재 투자 {idx,amount,buyPrice,lev}
    this.leverageNext=false;   // 다음 투자 레버리지(전설 아이템)
    this.extraSlots=0;         // 아이템 칸 +N (전설 아이템)
    this.dmgTakenMul=1;        // 받는 피해 배율 (분산투자 패시브)
    // 준형전자 — 🔧 AS 보증 (HP 위급 시 자가 수리)
    this.repairCd=0;        // 0 이상: 사용 후 쿨다운 (초)
    this.repairFx=0;        // 발동 시 시각 이펙트 시간
    // 🍳 종원 요리 시스템
    this.pantry={steak:0,lobster:0,truffle:0,veg:0,caviar:0};  // 재료 보유
    this.dishBuff=null;     // 활성 일시버프 {recipe,mul,t,applied:{as,spd,crit}}
    this.caviarBonus=0;     // 영구 데미지 가산 (캐비아 스택, 0.08씩)
    this.fingerCuts=0;      // 손가락 컷 누적 (영구 공속 -2%/회)
    this.dropCdT=0;         // 재료 드랍 쿨다운 타이머
    // 최기종 — 💥 분노/휠체어/신경주사 사이클 (discPain 누적 → 분노 → 휠체어)
    this.discPain=0;          // 0~1, 1 도달 시 분노 진입
    this.discFx=0;            // 분노 진입 시 시각 이펙트 (광역 폭발)
    this.gjPhase='normal';    // 'normal' | 'rage' | 'wheelchair'
    this.gjPhaseT=0;          // 분노 잔여 시간
    this.gjInjectionRef=null; // 현재 화면에 떠 있는 신경주사 (휠체어 모드 시 1개)
  }
  tryDash(){
    if(this.dashCd>0)return;
    this.dashT=0.18;this.dashCd=this.dashCdMax;this.hitT=Math.max(this.hitT,0.28);
    SFX.lvUp();spawnParts(this.x,this.y,this.cd.color,12);
  }
  update(dt){
    let dx=0,dy=0;
    // e.code만 사용 (Shift/CapsLock 무관 — 소문자 키 끼임 버그 방지)
    if(keys['ArrowLeft']||keys['KeyA'])dx-=1;
    if(keys['ArrowRight']||keys['KeyD'])dx+=1;
    if(keys['ArrowUp']||keys['KeyW'])dy-=1;
    if(keys['ArrowDown']||keys['KeyS'])dy+=1;
    if(dx||dy){const l=Math.hypot(dx,dy);dx/=l;dy/=l;this.facing={x:dx,y:dy}}
    // 대시 처리 + 졸음 시 이동속도 절반 + 휠체어 시 이동속도 +70%
    const sleepNerf=(this.streamerForm&&this.streamerForm.id==='sleep')?0.5:1;
    const wheelSpdBoost=(this.cd.id==='gj'&&this.gjPhase==='wheelchair')?(this.curedGj()?BAL.char.gj.curedWheelSpdMul:BAL.char.gj.wheelSpdMul):1;
    const dashSpd=(this.dashT>0?this.spd*4.5:this.spd)*sleepNerf*wheelSpdBoost;
    const mvX=this.dashT>0?this.facing.x:dx,mvY=this.dashT>0?this.facing.y:dy;
    this.x+=mvX*dashSpd*dt;this.y+=mvY*dashSpd*dt;
    if(this.dashT>0){this.dashT-=dt;if(Math.random()<0.6)spawnParts(this.x,this.y,this.cd.color,1)}
    if(this.dashCd>0)this.dashCd-=dt;
    if(this.magrBoost>0)this.magrBoost-=dt;
    // 차지 액스 도끼 모드 시간 감소
    if(this.cbMode==='axe'){
      this.cbAxeT-=dt;
      this.cbGauge=Math.max(0,this.cbAxeT/this.cbAxeMax);
      if(this.cbAxeT<=0){this.cbMode='sword';this.cbGauge=0}
    }
    // 윤소민 스텔라이브 변신 - 30초마다 룰렛 트리거 (룰렛 진행은 update()에서)
    if(rouletteOn(this)){
      this.streamerT-=dt;
      if(this.streamerT<=0&&this.rouletteT<=0&&!this.awaitingClick){
        this.rouletteT=3.8;  // 더 길게 (감속 위해)
        this.rouletteResult=pickStreamerForm();
        this.streamerT=30;  // 다음 사이클까지 막기
        SFX.lvUp();
      }
    }
    this.x=clamp(this.x,-1800,1800);this.y=clamp(this.y,-1800,1800);
    if(this.hitT>0)this.hitT-=dt;
    if(this.flashT>0)this.flashT-=dt;
    // 최종원 손가락컷 영구 공속 디버프(누적, 상한 0.8) / 기종 분노·휠체어 — BAL 참조
    const jwAs=(this.cd.id==='jw')?(1-Math.min(0.8,this.fingerCuts*BAL.char.jw.failAsDebuff)):1;
    const gjAsMul=(this.cd.id==='gj'&&this.gjPhase==='rage')?BAL.char.gj.rageAsMul:(this.cd.id==='gj'&&this.gjPhase==='wheelchair')?(this.curedGj()?BAL.char.gj.curedWheelAsMul:BAL.char.gj.wheelAsMul):1;
    // 휠체어 중엔 무적+한방 돌진이라 모든 무기 발사 정지 (주운 무기 포함). 타이머는 계속 돌려 종료 후 정상 재개
    const wheelLock=(this.cd.id==='gj'&&this.gjPhase==='wheelchair');
    this.wpns.forEach(w=>{
      w.t-=dt;
      if(w.t<=0){if(!wheelLock)fireWpn(w.type,this,w.lv||1);w.t=(WDEFS[w.type]?.cd||1)*wlvAt(WLV.cdM,w.lv||1)/(this.as*jwAs*gjAsMul)}
    });
    // 💎 비트코인 진화: 일정 주기마다 사방 관통레이저
    if(this.wpns.some(w=>w.type==='bitcoin')){
      if(this.btcLaserT===undefined)this.btcLaserT=BAL.char.zw.btcLaserInterval;
      this.btcLaserT-=dt;
      if(this.btcLaserT<=0){this.btcLaserT=BAL.char.zw.btcLaserInterval;fireBitcoinLaser(this);}
    }
    // HP 회복 — 비전투 시에만 작동 (피격 후 regenLockT 2초간 잠금, 휠체어 시 잠금)
    if(this.regenLockT>0)this.regenLockT-=dt;
    const wheelRegenLock=(this.cd.id==='gj'&&this.gjPhase==='wheelchair');
    if(this.regen>0&&this.regenLockT<=0&&!wheelRegenLock){this.regenT=Math.max(0,this.regenT-dt);if(this.regenT<=0){this.hp=Math.min(this.mhp,this.hp+this.regen*0.2);this.regenT=0.2}}
    if(this.cd.id==='jw'){
      const Jb=BAL.char.jw;
      let d=(1+(gameTime/Jb.lateScaleStart)*Jb.lateScaleRate)*this.metaDmg;  // 시간↑공격↑ 유지
      d*=(1+this.caviarBonus);                                               // 👑 캐비아 영구 스택
      if(this.dishBuff&&this.dishBuff.recipe.kind==='dm')d*=this.dishBuff.mul; // 🥩 스테이크 일시버프 (매프레임 재계산 → 만료 자동복원)
      this.dm=d;
    }
    // 캐릭터별 메카닉 타이머
    if(this.repairCd>0)this.repairCd-=dt;
    if(this.repairFx>0)this.repairFx-=dt;
    if(this.discFx>0)this.discFx-=dt;
    // 최종원 — 요리 타이머 (재료 드랍 쿨다운 + 일시버프 지속)
    if(this.cd.id==='jw'){
      if(this.dropCdT>0)this.dropCdT-=dt;
      if(this.dishBuff){this.dishBuff.t-=dt;if(this.dishBuff.t<=0)this.clearDishBuff();}
    }
    // 최기종 — 이동 기반 게이지 + 분노 타이머 + 휠체어 신경주사 추적
    if(this.cd.id==='gj'){
      // 정상 상태에서 이동 기반 게이지 (움직이면 누적 / 멈추면 천천히 감소)
      if(this.gjPhase==='normal'){
        const gjB=BAL.char.gj;
        const isMoving=!!(dx||dy)||this.dashT>0;
        if(isMoving){
          this.discPain=Math.min(1,this.discPain+gjB.painPerMove*dt);
          if(this.discPain>=gjB.painTrigger){if(this.curedGj())this.enterWheelchair();else this.triggerRage();}  // 완치는 분노 건너뛰고 바로 질주
        }else if(this.discPain>0){
          this.discPain=Math.max(0,this.discPain-gjB.painDecayStill*dt);
        }
      }
      // 분노 카운트다운 → 종료 시 휠체어 진입
      if(this.gjPhase==='rage'){
        this.gjPhaseT-=dt;
        if(this.gjPhaseT<=0)this.enterWheelchair();
      }
      // 완치 질주(awakegj): 무적 난동 — 닿는 적 즉사(보스X), 게이지 닳으며 지속
      if(this.gjPhase==='wheelchair'&&this.curedGj()){
        const gjB2=BAL.char.gj;
        enemies.forEach(e=>{if(!e.dead&&dist(this,e)<e.sz+18)e.hurt(e.hp+9999,false,'wheelchair')});  // 닿는 적 즉사
        this.discPain=Math.max(0,this.discPain-gjB2.curedDrainRate*dt);                  // 게이지 닳음
        const ref=this.gjInjectionRef;                                                   // 질주 중 주사 먹으면 영구성장
        if(ref&&!ref.dead&&dist(this,ref)<gjB2.injPickupR*2){ref.dead=true;this.gjInjectionRef=null;this.gainPermStat()}
        if(this.discPain<=0){
          if(this.gjInjectionRef){this.gjInjectionRef.dead=true;this.gjInjectionRef=null}  // 안 먹은 주사 소멸
          this.exitWheelchair();
        }
      }
      // 기본 휠체어: 신경주사 픽업 → 정상 복귀(회복)
      else if(this.gjPhase==='wheelchair'&&this.gjInjectionRef){
        const ref=this.gjInjectionRef;
        if(ref.dead)spawnNerveInjection(this);
        else if(dist(this,ref)<BAL.char.gj.injPickupR){ref.dead=true;this.exitWheelchair()}
      }
    }
  }
  // (구 주문폭주 제거 — 처치 알림은 호출부 호환 위해 noop 유지. 재료 드랍은 Enemy.die에서 처리)
  notifyKill(){}
  // 🍳 요리 버프 적용 (great=대성공 2적중 → 효과 ×greatMul)
  applyDish(recipe,great){
    this.clearDishBuff();  // 기존 일시버프 원복 (상태형 스탯 중복 방지)
    const J=BAL.char.jw, g=great?J.greatMul:1;
    if(recipe.kind==='heal'){ this.hp=Math.min(this.mhp,this.hp+this.mhp*recipe.mul*g); return; }
    if(recipe.kind==='caviar'){ this.caviarBonus+=J.caviarDmg*g; return; }  // 영구 스택
    const buff={recipe,mul:1,t:J.dishDur,applied:{}};
    if(recipe.kind==='dm'){ buff.mul=1+(recipe.mul-1)*g; }  // dm은 update에서 매프레임 곱 (applied 없음)
    else if(recipe.kind==='as'){ const m=1+(recipe.mul-1)*g; this.as*=m; buff.applied.as=m; }
    else if(recipe.kind==='spdcrit'){ const m=1+(recipe.mul-1)*g, cr=recipe.crit*g; this.spd*=m;this.bspd*=m;this.crit+=cr; buff.applied.spd=m; buff.applied.crit=cr; }
    this.dishBuff=buff;
  }
  clearDishBuff(){
    const b=this.dishBuff; if(!b)return;
    if(b.applied.as){ this.as/=b.applied.as; }
    if(b.applied.spd){ this.spd/=b.applied.spd; this.bspd/=b.applied.spd; }
    if(b.applied.crit){ this.crit-=b.applied.crit; }
    this.dishBuff=null;
  }
  // 지워니 — 처치 시 현금 적립
  addCash(n){ if(this.cd.id==='zw')this.seedMoney+=n; }
  // 종목 가격 랜덤워크 (투자창 열릴 때마다 1스텝)
  stepStocks(){
    if(!this.stocks)this.stocks=STOCKS.map(()=>({price:100,hist:[100]}));
    this.stocks.forEach((s,i)=>{
      const mv=rnd(-STOCKS[i].vol,STOCKS[i].vol)+STOCKS[i].drift;
      s.price=Math.max(8,s.price*(1+mv));
      s.hist.push(s.price); if(s.hist.length>16)s.hist.shift();
    });
  }
  // 보유 투자 정산 → 현금 회수 (수익/손실). 결과 객체 반환(없으면 null)
  resolveInvest(){
    if(!this.invest)return null;
    const idx=this.invest.idx, s=this.stocks[idx];
    let ratio=s.price/this.invest.buyPrice;
    if(this.invest.lev)ratio=Math.max(0,1+(ratio-1)*2);  // 레버리지: 변동폭 2배 (2배 먹고 2배 잃음)
    const ret=Math.max(0,Math.round(this.invest.amount*ratio));
    const profit=ret-this.invest.amount;
    this.seedMoney+=ret;
    const r={idx,name:STOCKS[idx].name,col:STOCKS[idx].col,buyPrice:this.invest.buyPrice,endPrice:s.price,
             amount:this.invest.amount,ret,profit,pct:Math.round((ratio-1)*100),lev:this.invest.lev,hist:s.hist.slice()};
    this.invest=null;
    if(profit>0)SFX.lvUp(); else if(profit<0)SFX.over();
    return r;
  }
  // 전액(올인) 투자
  doInvest(idx){
    if(this.seedMoney<=0)return;
    this.invest={idx,amount:Math.floor(this.seedMoney),buyPrice:this.stocks[idx].price,lev:!!this.leverageNext};
    this.leverageNext=false; this.seedMoney=0; SFX.shoot();
  }
  nearest(){let n=null,md=99999;(boss?[...enemies,boss]:enemies).forEach(e=>{const d=dist(this,e);if(d<md){md=d;n=e}});return n}
  takeDmg(v){
    if(godMode)return;  // 디버그 무적
    if(this.hitT>0)return;
    // 최기종 분노 모드 무적
    if(this.cd.id==='gj'&&(this.gjPhase==='rage'||(this.gjPhase==='wheelchair'&&this.curedGj())))return;  // 분노/완치질주 무적
    const dmg=v*this.def*(this.dmgTakenMul||1);  // 분산투자 패시브: 받는 피해 감소
    this.hp-=dmg;this.hitT=this.iframes;this.flashT=0.25;
    if(dmg>this.mhp*0.18)hitStop=Math.max(hitStop,0.08);  // 큰 피격 시 짧은 정지(oof)
    this.regenLockT=BAL.regen.combatLockDur;  // 전투 중 회복 정지
    SFX.pHit();spawnParts(this.x,this.y,'#ff4444',8);
    showDmg(this.x,this.y-12,dmg,'#ff5566',true);
    shake(0.25,5);spark(this.x,this.y,'#ff6644',6);
    // (피격 기반 누적 제거 — 이동 기반으로 변경됨, player.update에서 처리)
    if(this.hp<=0){
      // 준형전자 — AS 보증: HP 0 이하 도달 시 쿨다운 가능하면 자동 수리 (긴급)
      if(this.cd.id==='jh'&&this.repairCd<=0){
        this.triggerASRepair(true);
        return;
      }
      // 부활 메타: 남은 부활이 있으면 HP 50% 회복 + 주변 적 넉백 정리
      if(runRevives<(META.up.revive||0)){
        runRevives++;
        this.hp=this.mhp*0.5;this.hitT=Math.max(this.hitT,2.8);this.regenLockT=0;
        (boss?[...enemies,boss]:enemies).forEach(e=>{if(dist(e,this)<170){const a=Math.atan2(e.y-this.y,e.x-this.x);e.kvx+=Math.cos(a)*420;e.kvy+=Math.sin(a)*420;}});
        notify('💗 부활!',`HP 50% 회복 (${runRevives}/${META.up.revive})`,'#ff66aa');
        spawnParts(this.x,this.y,'#ff66aa',26);shake(0.45,9);hitStop=Math.max(hitStop,0.12);SFX.lvUp();SFX.phialReady();
        return;
      }
      this.hp=0;SFX.over();state='dead';shake(0.6,12);
      return;
    }
    // 준형전자 — AS 보증: HP 25% 이하 + 쿨다운 끝났을 때 자동 발동
    if(this.cd.id==='jh'&&this.repairCd<=0&&this.hp/this.mhp<0.25){
      this.triggerASRepair(false);
    }
  }
  // 준형전자 자가수리 — BAL.char.jh 참조
  triggerASRepair(emergency){
    const B=BAL.char.jh;
    const healAmt=this.mhp*(emergency?B.healUrgentPct:B.healPct);
    this.hp=Math.min(this.mhp,Math.max(this.hp,0)+healAmt);
    this.hitT=Math.max(this.hitT,B.healInvuln);
    this.repairCd=B.repairCd;
    this.repairFx=1.2;
    SFX.lvUp();SFX.phialReady();
    notify(emergency?'🔧 긴급 부팅!':'🔧 AS 보증 발동',`HP +${Math.round(healAmt)} · ${B.healInvuln}초 무적`,'#44aaff');
    spawnParts(this.x,this.y,'#44aaff',16);
    shake(0.2,4);
    showDmg(this.x,this.y-20,Math.round(healAmt),'#88ddff',true);
  }
  // 최기종 분노 진입 — BAL.char.gj 참조
  triggerRage(){
    const B=BAL.char.gj;
    this.gjPhase='rage';
    this.gjPhaseT=B.rageDur;
    this.discFx=0.8;
    const bdmg=20*this.dm*B.rageBurstDmgMul;
    aoeHit(this.x,this.y,B.rageBurstR,'#ff3366',bdmg,0.5,0,false,'disc_burst',0);
    SFX.bHit();SFX.boss();
    notify('🔥 허리 부러짐 — 분노!',`${B.rageDur}초 광폭 (dmg×${B.rageDmgMul})`,'#ff3366');
    spawnParts(this.x,this.y,'#ff3366',24);
    spawnParts(this.x,this.y,'#ff66aa',16);
    shake(0.5,8);
  }
  // 분노 종료 → 휠체어 진입
  curedGj(){return this.cd.id==='gj'&&this.wpns.some(w=>w.type==='awakegj')}  // 완치(staff 진화) 여부
  enterWheelchair(){
    this.gjPhase='wheelchair';
    if(this.curedGj()){
      // 완치 질주: 게이지(discPain) 유지 → 닳으며 지속. 무적 난동 + 주사 보상(주우면 영구성장).
      notify('🏃 완치 질주!','무적 난동 · 💉 주사=영구 성장','#ffcc44');
      SFX.lvUp();SFX.phialReady();
      spawnNerveInjection(this);
    }else{
      this.discPain=0;
      this.gjPhaseT=0;
      notify('🦽 휠체어 모드','💉 신경주사 찾기 (멀리 스폰)','#88aaff');
      SFX.over();
      spawnNerveInjection(this);
    }
  }
  // 영구 성장 (완치 질주 중 주사 픽업) — 판 내 영구, 랜덤 대폭
  gainPermStat(){
    const opts=[
      ['❤️ 최대HP +20',()=>{this.mhp+=20;this.hp+=20}],
      ['⚔️ 공격력 +5%',()=>{this.dm*=1.05}],
      ['⚡ 공속 +5%',()=>{this.as*=1.05}],
      ['👟 이동속도 +5',()=>{this.spd+=5;this.bspd+=5}],
      ['🎯 크리 +3%',()=>{this.crit+=0.03}],
      ['💥 범위 +5%',()=>{this.am*=1.05}],
    ];
    const o=opts[Math.floor(Math.random()*opts.length)];o[1]();
    notify('💉 영구 성장!',o[0],'#ffcc44');
    spawnParts(this.x,this.y,'#ffcc44',18);SFX.phialReady();
  }
  // 신경주사 픽업 → 정상 복귀
  exitWheelchair(){
    const B=BAL.char.gj;
    this.gjPhase='normal';
    this.discPain=0;
    this.gjInjectionRef=null;
    this.hitT=Math.max(this.hitT,B.injInvuln);
    if(!this.curedGj()){  // 기본 기종만 회복 (완치는 보상이 주사 영구성장이라 회복 없음)
      this.hp=Math.min(this.mhp,this.hp+this.mhp*B.injHealPct);
      notify('💉 신경주사 회복',`HP +${Math.round(B.injHealPct*100)}%`,'#88ff88');
      SFX.lvUp();SFX.phialReady();
    }
    spawnParts(this.x,this.y,'#88ff88',12);
  }
  gainXp(v){
    this.xp+=v*this.xpm;
    while(this.xp>=this.xpn){
      this.xp-=this.xpn;this.lv++;this.xpn=Math.floor(this.xpn*1.18);
      spawnLvUpBurst();
      if(state==='levelup')pendingLvUps++;
      else triggerLvUp();
    }
  }
  hasP(id){return (this.passives[id]||0)>0}
  pLv(id){return this.passives[id]||0}
  pCnt(){return Object.keys(this.passives).length}
  hasW(t){return this.wpns.some(w=>w.type===t)}
  wpnObj(t){return this.wpns.find(w=>w.type===t)}
  draw(){
    const fl=this.flashT>0&&Math.floor(this.hitT*14)%2===0;
    if(this.hitT>0&&Math.floor(this.hitT*14)%2===1)return;
    // 플레이어 발밑 식별 링 — 난전에서 내 위치 항상 보이게 (VS 스타일)
    {
      const rp=0.5+0.5*Math.sin(gameTime*4);
      G.save();
      G.globalAlpha=0.4+rp*0.25;
      G.strokeStyle=this.cd.color;G.lineWidth=2.5;
      G.beginPath();G.ellipse(this.x,this.y+15,17,6.5,0,0,Math.PI*2);G.stroke();
      G.globalAlpha=0.28;
      G.strokeStyle='#ffffff';G.lineWidth=1;
      G.beginPath();G.ellipse(this.x,this.y+15,13,5,0,0,Math.PI*2);G.stroke();
      G.restore();
    }
    // 분노 모드 빨간 오라 (캐릭터 뒤에 그리기)
    if(this.cd.id==='gj'&&this.gjPhase==='rage'){
      const pulse=0.5+0.5*Math.sin(gameTime*12);
      G.save();
      G.globalAlpha=0.5+pulse*0.3;
      G.fillStyle='#ff2244';
      G.beginPath();G.arc(this.x,this.y,22+pulse*4,0,Math.PI*2);G.fill();
      G.globalAlpha=0.3;
      G.fillStyle='#ff6688';
      G.beginPath();G.arc(this.x,this.y,32+pulse*6,0,Math.PI*2);G.fill();
      G.restore();
    }
    // 🐕 황금 뭉치 — 은은한 금빛 오라 (풍선/불꽃 제거, 빛 확 줄임)
    if(this.wpns.some(w=>w.type==='unleash')){
      const pl=0.5+0.5*Math.sin(gameTime*7);
      G.save();
      G.globalAlpha=0.09+pl*0.06;G.fillStyle='#ffcc33';
      G.beginPath();G.arc(this.x,this.y,17+pl*3,0,Math.PI*2);G.fill();
      G.restore();
    }
    G.save();G.translate(this.x,this.y);
    // 기종 분노 시 캐릭터 90도 꺾임 (허리 부러진 느낌)
    if(this.cd.id==='gj'&&this.gjPhase==='rage'){
      G.rotate(Math.PI/2);
    }
    const unleashed=this.wpns.some(w=>w.type==='unleash');
    const sx=this.facing.x<0?-0.72:0.72;
    G.scale(sx,0.72);G.translate(-this.x,-this.y);
    if(unleashed){
      // 진화: 원래 뭉치(흰 포메) 모습 + 초사이언 황금 틴트(가산혼합)
      G.save();G.translate(this.x,this.y);G.scale(1.45,1.45);G.translate(-this.x,-this.y);  // 플레이어 사이즈감
      drawCocker(this.x,this.y,afr,false,false);
      G.globalCompositeOperation='lighter';
      G.globalAlpha=0.1+0.06*Math.sin(gameTime*8);  // 은은하게
      G.fillStyle='#ffcc22';G.beginPath();G.arc(this.x,this.y-1,11,0,Math.PI*2);G.fill();
      G.restore();
    }
    else sChar(this.x,this.y,this.cd,afr,fl);
    // 윤소민 변신 시 외형 액세서리
    if(!fl&&rouletteOn(this)&&this.streamerForm&&this.rouletteT<=0){
      drawStreamerAccessory(this.x,this.y,this.streamerForm);
    }
    G.restore();
    if(fl){G.save();G.globalAlpha=this.flashT*2;G.fillStyle='#ff4444';G.fillRect(this.x-9,this.y-16,18,30);G.restore()}
    // 캐릭터별 시각 이펙트
    // 준형전자 AS 보증 발동 직후: 파란 회로 글로우 링
    if(this.cd.id==='jh'&&this.repairFx>0){
      const t=1-this.repairFx/1.2;
      G.save();
      G.globalAlpha=(1-t)*0.85;
      G.strokeStyle='#44ccff';G.lineWidth=3;
      G.beginPath();G.arc(this.x,this.y,16+t*30,0,Math.PI*2);G.stroke();
      G.globalAlpha=(1-t)*0.5;
      G.strokeStyle='#aaeeff';G.lineWidth=1.5;
      G.beginPath();G.arc(this.x,this.y,10+t*22,0,Math.PI*2);G.stroke();
      // 🔧 위 표시
      G.globalAlpha=Math.min(1,(1-t)*1.4);
      G.font='14px serif';G.textAlign='center';
      G.fillText('🔧',this.x,this.y-22-t*8);
      G.restore();
    }
    // 최종원 요리 버프 활성 중: 요리 이모지 + 금색 글로우
    if(this.cd.id==='jw'&&this.dishBuff){
      const pulse=0.5+0.5*Math.sin(gameTime*8);
      G.save();
      G.globalAlpha=0.25+pulse*0.25;
      G.fillStyle='#ffcc44';
      G.beginPath();G.arc(this.x,this.y+2,15+pulse*3,0,Math.PI*2);G.fill();
      G.globalAlpha=1;
      G.font='14px serif';G.textAlign='center';
      G.fillText(this.dishBuff.recipe.emoji,this.x,this.y-22);
      // 잔여 시간 바
      G.fillStyle='#332211';G.fillRect(this.x-12,this.y-30,24,3);
      G.fillStyle='#ffcc44';G.fillRect(this.x-12,this.y-30,24*(this.dishBuff.t/BAL.char.jw.dishDur),3);
      G.restore();
    }
    // 최기종 정상 상태 통증 게이지 (머리 위 보라 바)
    if(this.cd.id==='gj'&&this.gjPhase==='normal'&&this.discPain>0){
      G.save();
      const w=22,h=4,bx=this.x-w/2,by=this.y-26;
      G.fillStyle='rgba(20,10,30,0.85)';G.fillRect(bx,by,w,h);
      const col=this.discPain>=0.85?'#ff66cc':'#9966cc';
      G.fillStyle=col;G.fillRect(bx,by,w*this.discPain,h);
      if(this.discPain>=0.85){
        const p=0.5+0.5*Math.sin(gameTime*18);
        G.globalAlpha=p*0.7;
        G.strokeStyle='#ff66cc';G.lineWidth=2;G.strokeRect(bx-1,by-1,w+2,h+2);
      }
      G.restore();
    }
    // 분노 진입 임팩트: 큰 빨간 슬램 링
    if(this.cd.id==='gj'&&this.discFx>0){
      const t=1-this.discFx/0.8;
      G.save();
      G.globalAlpha=(1-t)*0.9;
      G.strokeStyle='#ff3366';G.lineWidth=5-t*3;
      G.beginPath();G.arc(this.x,this.y,40+t*180,0,Math.PI*2);G.stroke();
      G.strokeStyle='#fff';G.lineWidth=2-t;
      G.beginPath();G.arc(this.x,this.y,30+t*160,0,Math.PI*2);G.stroke();
      G.restore();
    }
    // 휠체어 모드: 캐릭터 아래에 휠체어 그림 (완치 질주는 휠체어 없이 달리므로 제외)
    if(this.cd.id==='gj'&&this.gjPhase==='wheelchair'&&!this.curedGj()){
      G.save();
      const cx=this.x,cy=this.y+8;
      // 프레임 (회색)
      G.fillStyle='#555';G.fillRect(cx-9,cy-2,18,3);  // 좌석 가로 프레임
      G.fillStyle='#444';G.fillRect(cx+7,cy-12,2,12); // 등받이 (오른쪽)
      G.fillStyle='#666';G.fillRect(cx-9,cy-12,2,12); // 등받이 (왼쪽)
      // 큰 바퀴 (양쪽)
      G.fillStyle='#1a1a1a';
      G.beginPath();G.arc(cx-7,cy+5,7,0,Math.PI*2);G.fill();
      G.beginPath();G.arc(cx+7,cy+5,7,0,Math.PI*2);G.fill();
      G.fillStyle='#333';
      G.beginPath();G.arc(cx-7,cy+5,4,0,Math.PI*2);G.fill();
      G.beginPath();G.arc(cx+7,cy+5,4,0,Math.PI*2);G.fill();
      // 바퀴 살 (회전 효과)
      const spin=gameTime*4;
      G.strokeStyle='#888';G.lineWidth=1;
      [0,Math.PI/3,2*Math.PI/3].forEach(a=>{
        G.beginPath();G.moveTo(cx-7+Math.cos(a+spin)*5,cy+5+Math.sin(a+spin)*5);
        G.lineTo(cx-7-Math.cos(a+spin)*5,cy+5-Math.sin(a+spin)*5);G.stroke();
        G.beginPath();G.moveTo(cx+7+Math.cos(a-spin)*5,cy+5+Math.sin(a-spin)*5);
        G.lineTo(cx+7-Math.cos(a-spin)*5,cy+5-Math.sin(a-spin)*5);G.stroke();
      });
      // 작은 앞 바퀴
      G.fillStyle='#222';
      G.beginPath();G.arc(cx-5,cy+9,2,0,Math.PI*2);G.fill();
      G.beginPath();G.arc(cx+5,cy+9,2,0,Math.PI*2);G.fill();
      G.restore();
    }
  }
}

// ═══ WEAPON FIRE ═══
function fireWpn(type,p,wlv){
  wlv=wlv||1;
  const dM=wlvAt(WLV.dmgM,wlv),pB=wlvAt(WLV.pierceB,wlv);
  // 기종 모드별 데미지/범위 모디파이어 — BAL.char.gj 참조
  const gjB=BAL.char.gj;
  const gjRageMul=(p.cd.id==='gj'&&p.gjPhase==='rage')?gjB.rageDmgMul:1;
  const gjWheelDmgMul=(p.cd.id==='gj'&&p.gjPhase==='wheelchair')?(p.curedGj()?gjB.curedWheelDmgMul:gjB.wheelDmgMul):1;
  const gjWheelAmMul=(p.cd.id==='gj'&&p.gjPhase==='wheelchair')?gjB.wheelAmMul:1;
  const dmg=18*p.dm*dM*(1+Math.max(0,p.lv-1)*0.04)*gjRageMul*gjWheelDmgMul*streamerBuff(p);
  const am=p.am*gjWheelAmMul,pierce=p.pierce+pB; // 크기는 패시브만 영향, 레벨로는 안 커짐
  const t=p.nearest(),ang=t?Math.atan2(t.y-p.y,t.x-p.x):Math.atan2(p.facing.y,p.facing.x);
  // 부채꼴 발사 헬퍼
  const fan=(n,spread,sp,life,col,sz,extraP,wt,dmgMul)=>{
    SFX.shoot();
    if(n<=1){projs.push(new Proj(p.x,p.y,Math.cos(ang)*sp,Math.sin(ang)*sp,dmg*(dmgMul||1),life,col,sz*am,pierce+(extraP||0),wt));return}
    for(let i=0;i<n;i++){
      const da=-spread/2+spread*(i/(n-1));
      const a=ang+da;
      projs.push(new Proj(p.x,p.y,Math.cos(a)*sp,Math.sin(a)*sp,dmg*(dmgMul||1),life,col,sz*am,pierce+(extraP||0),wt));
    }
  };
  switch(type){
    case 'ram':{
      // RAM 스틱: 영구 1개 유지 (매 발사마다 새로 안 만들고 갯수만 조정)
      // 레벨업은 데미지/속도/크기/타격 빈도 스케일
      if(!p.bouncingRams)p.bouncingRams=[];
      // 죽은 RAM 제거
      p.bouncingRams=p.bouncingRams.filter(r=>!r.dead);
      const wantCount=BAL.wpn.ram.count; // 기본 2개 (jh 버프, BAL 참조)
      const ramDmg=dmg*1.4; // 단발 1개라 데미지 강화 (cd마다 새로 안 만드니 DPS 보상)
      const ramSpd=220+wlv*10; // 레벨 따라 빠름 (Lv1: 230, Lv8: 300)
      const ramSz=(9+wlv*0.3)*am; // 레벨 따라 살짝 큼 (Lv1: 9.3, Lv8: 11.4)
      // 능력치 동기화 (레벨업 시 즉시 반영)
      p.bouncingRams.forEach(r=>{
        r.dmg=ramDmg; r.sz=ramSz; r.col='#44aaff'; r.fancy=false;
        const cur=Math.hypot(r.vx,r.vy)||1;
        // 속도가 수직/수평에 너무 치우쳤거나 0에 가까우면 재랜덤화 (자가 치유)
        if(Math.abs(r.vx)<ramSpd*0.3||Math.abs(r.vy)<ramSpd*0.3){
          const q=Math.floor(Math.random()*4);
          const a=q*Math.PI/2+rnd(Math.PI/7,Math.PI/2-Math.PI/7);
          r.vx=Math.cos(a)*ramSpd; r.vy=Math.sin(a)*ramSpd;
        }else{
          r.vx=r.vx/cur*ramSpd; r.vy=r.vy/cur*ramSpd;
        }
        r.spdBase=ramSpd;
      });
      // 부족하면 새로 추가
      while(p.bouncingRams.length<wantCount){
        const r=spawnBouncingRam(p,{
          dmg:ramDmg, persistent:true, speed:ramSpd,
          col:'#44aaff', sz:ramSz, wt:'ram_bounce'
        });
        p.bouncingRams.push(r);
        SFX.shoot();
      }
      // 초과면 제거 (현재 디자인에선 안 일어남)
      while(p.bouncingRams.length>wantCount){
        const r=p.bouncingRams.pop();
        r.dead=true;
      }
      break;
    }
    case 'fullspec':{
      // 풀스펙 진화: 영구 2개 + 빠르고 강함 + 발광
      if(!p.bouncingRams)p.bouncingRams=[];
      p.bouncingRams=p.bouncingRams.filter(r=>!r.dead);
      const wantCount=BAL.wpn.fullspec.count;
      const ramDmg=dmg*BAL.wpn.fullspec.dmgMul;
      const ramSpd=270+wlv*12;
      const ramSz=(10+wlv*0.3)*am;
      p.bouncingRams.forEach(r=>{
        r.dmg=ramDmg; r.sz=ramSz; r.col='#00eeff'; r.fancy=true;
        const cur=Math.hypot(r.vx,r.vy)||1;
        if(Math.abs(r.vx)<ramSpd*0.3||Math.abs(r.vy)<ramSpd*0.3){
          const q=Math.floor(Math.random()*4);
          const a=q*Math.PI/2+rnd(Math.PI/7,Math.PI/2-Math.PI/7);
          r.vx=Math.cos(a)*ramSpd; r.vy=Math.sin(a)*ramSpd;
        }else{
          r.vx=r.vx/cur*ramSpd; r.vy=r.vy/cur*ramSpd;
        }
        r.spdBase=ramSpd;
      });
      while(p.bouncingRams.length<wantCount){
        const r=spawnBouncingRam(p,{
          dmg:ramDmg, persistent:true, speed:ramSpd,
          col:'#00eeff', sz:ramSz, wt:'fullspec_bounce', fancy:true
        });
        p.bouncingRams.push(r);
        // 진화 직후 임팩트 플래시
        aoeHit(p.x,p.y,55*am,'#ffffff',dmg*0.4,0.2,0,false,'flash',0);
        SFX.shoot();
      }
      while(p.bouncingRams.length>wantCount){
        const r=p.bouncingRams.pop();
        r.dead=true;
      }
      break;
    }
    case 'knife':      fan(wlvAt(WPROJ.knife,wlv),0.6,310,1.5,'#ff8844',7,wlvAt(KNIFE_PIERCE,wlv),'knife',1);break;  // 레벨업마다 관통↑
    case 'fullcourse': fan(wlvAt(WPROJ.fullcourse,wlv),0.85,340,1.5,'#ff5500',9,999,'fullcourse',BAL.wpn.fullcourse.dmgMul);break;  // 진화: 모든 적 관통(사시미)
    case 'coin':case 'bitcoin':{
      // 지워니: 동전이 캐릭터 주위를 빙글빙글 회전(오비탈). 영구 유지 — 레벨업 시 개수/크기/데미지 동기화
      const bc=type==='bitcoin';
      if(!p.orbitCoins)p.orbitCoins=[];
      p.orbitCoins=p.orbitCoins.filter(c=>!c.dead);
      const cnt=Math.min((bc?8:2)+Math.floor(wlv/2),bc?13:7);  // 동전 개수: 동전 2~6, 비트코인 8~13 (진화 buff: 7~11→8~13)
      const orbR=(65+wlv*2.5)*(1+(am-1)*0.3), cDmg=dmg*(bc?2.1:1.1), cSz=(7.5+wlv*0.4)*am*(bc?1.25:1), cSpin=bc?2.9:2.1;  // 비트코인 데미지 1.7→2.1·회전 2.6→2.9(접촉빈도↑). 거리: am 30%만 반영
      p.orbitCoins.forEach(c=>{c.orbR=orbR;c.dmg=cDmg;c.sz=cSz;c.bc=bc;c.spin=cSpin;c.wt=bc?'bitcoin':'coin';});  // 능력치 동기화
      while(p.orbitCoins.length<cnt){
        const c={dead:false,isAoe:true,wt:bc?'bitcoin':'coin',orbR,dmg:cDmg,sz:cSz,bc,spin:cSpin,baseAng:0,x:p.x,y:p.y,hitMap:new WeakMap(),
          update(dt){
            const a=this.baseAng+gameTime*this.spin;
            this.x=player.x+Math.cos(a)*this.orbR; this.y=player.y+Math.sin(a)*this.orbR;
            const all=boss?[...enemies,boss]:enemies;
            all.forEach(e=>{const last=this.hitMap.get(e)||-1; if(gameTime-last<0.4)return;
              const dx=e.x-this.x,dy=e.y-this.y,rr=this.sz+e.sz;
              if(dx*dx+dy*dy<rr*rr){let dd=this.dmg;if(e===boss)dd*=player.bdm;const cr=Math.random()<player.crit;if(cr)dd*=2;e.hurt(dd,cr,this.wt);this.hitMap.set(e,gameTime);}});
          },
          draw(){
            const s=this.sz, bcl=this.bc;
            const spin=gameTime*5+this.baseAng;                 // 동전 자전 (앞면↔옆면)
            const wS=Math.abs(Math.cos(spin))*0.82+0.18;        // 가로폭 0.18~1.0 = 회전감
            G.save();G.translate(this.x,this.y);
            // 바닥 글로우
            G.globalAlpha=0.22;G.fillStyle=bcl?'#f7931a':'#ffcf33';
            G.beginPath();G.arc(0,0,s*1.25,0,Math.PI*2);G.fill();
            G.globalAlpha=1;G.scale(wS,1);                       // 가로 스쿼시 = 3D 회전
            // 동전 두께(테두리)
            G.fillStyle=bcl?'#9c560a':'#b8860b';G.beginPath();G.arc(0,0,s,0,Math.PI*2);G.fill();
            // 앞면
            G.fillStyle=bcl?'#f7931a':'#ffd24a';G.beginPath();G.arc(0,0,s*0.82,0,Math.PI*2);G.fill();
            // 음각 링
            G.strokeStyle=bcl?'#c47012':'#c79a10';G.lineWidth=Math.max(1,s*0.13);
            G.beginPath();G.arc(0,0,s*0.55,0,Math.PI*2);G.stroke();
            // 심볼 (찌그러짐 보정 — 옆면일 땐 생략)
            if(wS>0.45){G.save();G.scale(1/wS,1);
              G.fillStyle=bcl?'#fff':'#8a6510';G.font=`bold ${Math.round(s*1.1)}px Courier New`;G.textAlign='center';G.textBaseline='middle';
              G.fillText(bcl?'฿':'₩',0,s*0.06);G.textBaseline='alphabetic';G.restore();}
            // 하이라이트
            G.globalAlpha=0.7;G.fillStyle='#fff';
            G.beginPath();G.ellipse(-s*0.28,-s*0.32,s*0.2,s*0.3,0,0,Math.PI*2);G.fill();
            G.restore();
          }
        };
        p.orbitCoins.push(c); projs.push(c);
      }
      while(p.orbitCoins.length>cnt){p.orbitCoins.pop().dead=true;}
      const n=p.orbitCoins.length; p.orbitCoins.forEach((c,i)=>c.baseAng=Math.PI*2/n*i);  // 균등 배치
      break;
    }
    case 'light':{
      // 윤소민 변신 효과 적용 (변신 시 변신별 빔)
      const form=(rouletteOn(p)&&p.streamerForm)?p.streamerForm:null;
      if(form){
        applyStreamerLight(p,ang,dmg,am,pierce,wlv,form,'light');
      }else{
        // 기본 손전등 — BAL.wpn.light 참조
        const LB=BAL.wpn.light;
        const lvCnt=wlvAt(WPROJ.light,wlv);
        spawnBeam(p,ang,{
          col:'#ccffee',
          len:LB.lenBase+lvCnt*LB.lenPerLv, halfAng:LB.halfAngBase+lvCnt*LB.halfAngPerLv,
          life:LB.life, tickInt:0.22,
          dmg:dmg*LB.dmgMul, slowDur:LB.slowDur, wt:'beam'
        });
      }
      break;
    }
    case 'nightwatch':{
      const form=(rouletteOn(p)&&p.streamerForm)?p.streamerForm:null;
      if(form){
        applyStreamerLight(p,ang,dmg,am,pierce,wlv,form,'nightwatch');
      }else{
        // 심야경계령 진화: 더 넓고 더 자주 틱하는 초록 빔 + 짧은 광역 펄스
        const lvCnt=wlvAt(WPROJ.nightwatch,wlv);
        spawnBeam(p,ang,{
          col:'#00ff88',
          len:210+lvCnt*8, halfAng:0.55,
          life:0.65, tickInt:0.16,
          dmg:dmg*BAL.wpn.nightwatch.dmgMul, slowDur:1.8, wt:'beam_nw',
          bigClick:true
        });
        // 360° 짧은 펄스 (진화 보너스)
        aoeHit(p.x,p.y,BAL.wpn.nightwatch.pulseR,'#00ff88',dmg*BAL.wpn.nightwatch.pulseDmgMul,0.22,0,true,'flash',0);
      }
      break;
    }
    case 'staff':{
      if(p.cd.id==='gj'&&p.gjPhase==='wheelchair')break;
      const SB=BAL.wpn.staff;
      // 거리감쇠 킬존: 중심 dmg×2.2 → 가장자리 dmg×1.2. 범위(am)↑ 먹으면 최대뎀 구간이 자동으로 멀어짐
      aoeHit(p.x,p.y,SB.r*am,'#cc88ff',dmg,SB.life,pierce,false,'staff',wlvAt(WPROJ.staff,wlv),{max:SB.maxMul,min:SB.minMul});
      break;
    }
    case 'awakegj':{
      // 진화: 쌍지팡이 좌우 번갈아 슬램(왼손/오른손). 각 슬램 = 거리감쇠 킬존 충격파
      if(p.cd.id==='gj'&&p.gjPhase==='wheelchair')break;
      SFX.shoot();
      const AW=BAL.wpn.awakegj;
      p.gjSlamSide=p.gjSlamSide===1?-1:1;  // 좌(-1)/우(+1) 토글
      const off=AW.slamOffset*am;
      const sx=p.x+p.gjSlamSide*off, sy=p.y+6;
      aoeHit(sx,sy,AW.r*am,'#bb66ff',dmg,AW.life,pierce,false,'awakegj',0,{max:AW.maxMul,min:AW.minMul});
      shake(0.045,1.6);  // 슬램 미세 흔들림 (잦으니 약하게 — 멀미 방지)
      break;
    }
    case 'mungchi':{
      // 기본: 뭉치 컴패니언 1마리 (물기/짖기)
      if(!p.companions)p.companions=[];
      p.companions.forEach(c=>c.evolved=false);
      while(p.companions.length<1)p.companions.push(new Companion(p,false));
      while(p.companions.length>1)p.companions.pop();
      break;
    }
    case 'unleash':{
      // 진화: 플레이어가 황금 뭉치로 — 컴패니언 제거, 앞으로 크게 70° 파동 발사(콘 안 전부 타격)
      if(p.companions)p.companions.length=0;
      const t2=p.nearest(), wa=t2?Math.atan2(t2.y-p.y,t2.x-p.x):Math.atan2(p.facing.y,p.facing.x);
      const U=BAL.wpn.unleash, dM2=wlvAt(WLV.dmgM,wlv);
      const wdmg=18*p.dm*dM2*(1+Math.max(0,p.lv-1)*0.04)*U.waveDmgMul;
      const R=(U.waveR+wlv*8), span=U.waveSpan;  // 발톱은 범위(am) 영향 X — 고정 사거리
      // 콘(70°) 안 모든 적 타격
      (boss?[...enemies,boss]:enemies).forEach(e=>{
        const dx=e.x-p.x,dy=e.y-p.y,d=Math.hypot(dx,dy);
        if(d>R+e.sz||d<2)return;
        let da=Math.atan2(dy,dx)-wa; while(da>Math.PI)da-=Math.PI*2; while(da<-Math.PI)da+=Math.PI*2;
        if(Math.abs(da)>span/2+e.sz/Math.max(d,30))return;
        let dd=wdmg; if(e===boss)dd*=p.bdm; const cr=Math.random()<p.crit; if(cr)dd*=2;
        e.hurt(dd,cr,'wave');
      });
      // 큰 할퀴기 비주얼 (붉은 발톱 상처 4줄 — 칼날형, 거친 가장자리)
      projs.push({x:p.x,y:p.y,ang:wa,R,span,life:0.34,ml:0.34,dead:false,isAoe:true,wt:'wave',
        update(dt){this.life-=dt;if(this.life<=0)this.dead=true;},
        draw(){
          const al=clamp(this.life/this.ml,0,1),tt=1-al, sw=Math.min(1,tt*2.0);
          G.save();G.translate(this.x,this.y);G.rotate(this.ang);
          G.lineCap='round';G.lineJoin='round';
          const R=this.R, N=3, S=16;
          // 3줄 평행 발톱 — 조준방향에 '수직'으로 세로로 긋고 앞쪽에 나란히 배치(발사느낌X, 옆구리 할퀸 슬래시)
          for(let i=0;i<N;i++){
            const k=(i-(N-1)/2);                            // -1.5..1.5
            const bx=R*(0.46+sw*0.10)+k*R*0.20;             // 조준방향으로 나란히 간격(평행), 앞쪽에 배치
            const half=R*(0.40+sw*0.10);                    // 세로 반길이
            const tilt=R*0.12;                              // 위→아래 살짝 비스듬(슬래시 느낌)
            const x0=bx-tilt, y0=-half;                     // 위 끝
            const x1=bx+tilt, y1= half;                     // 아래 끝
            const cx=bx+R*0.16, cy=0;                       // 제어점: 바깥(앞)으로 볼록하게 활처럼 휨
            const maxW=Math.max(2,R*0.055)*(1-tt*0.35);     // 최대 두께
            const mid=[],top=[],bot=[];
            for(let s=0;s<=S;s++){
              const u=s/S, iu=1-u;
              const px=iu*iu*x0+2*iu*u*cx+u*u*x1;
              const py=iu*iu*y0+2*iu*u*cy+u*u*y1;
              const tx=2*iu*(cx-x0)+2*u*(x1-cx), ty=2*iu*(cy-y0)+2*u*(y1-cy);
              const tl=Math.hypot(tx,ty)||1, nx=-ty/tl, ny=tx/tl;
              // 폭: 양끝 0, 살짝 앞쪽이 두꺼운 칼날 + 결정적 톱니노이즈
              let hw=maxW*Math.pow(Math.sin(Math.PI*u),0.6);
              hw*=1+0.24*Math.sin(u*27+i*2.3)*Math.sin(u*9+i);
              mid.push([px,py]);
              top.push([px+nx*hw,py+ny*hw]);
              bot.push([px-nx*hw,py-ny*hw]);
            }
            // 채우기(붉은 상처)
            G.beginPath();G.moveTo(top[0][0],top[0][1]);
            for(let s=1;s<=S;s++)G.lineTo(top[s][0],top[s][1]);
            for(let s=S;s>=0;s--)G.lineTo(bot[s][0],bot[s][1]);
            G.closePath();
            const g=G.createLinearGradient(x0,y0,x1,y1);
            g.addColorStop(0,'rgba(110,0,0,0)');
            g.addColorStop(0.18,'rgba(150,5,5,0.9)');
            g.addColorStop(0.5,'rgba(225,25,20,0.96)');
            g.addColorStop(0.82,'rgba(160,5,5,0.9)');
            g.addColorStop(1,'rgba(100,0,0,0)');
            G.globalAlpha=al*(0.55+sw*0.45);G.fillStyle=g;G.fill();
            // 깊은 속살 밝은 선
            G.globalAlpha=al*0.55*(0.4+sw*0.6);
            G.strokeStyle='rgba(255,140,110,0.85)';
            G.lineWidth=Math.max(1,maxW*0.3);
            G.beginPath();G.moveTo(mid[0][0],mid[0][1]);
            for(let s=1;s<=S;s++)G.lineTo(mid[s][0],mid[s][1]);
            G.stroke();
          }
          G.lineCap='butt';G.lineJoin='miter';
          G.restore();
        }
      });
      SFX.shoot();
      break;
    }
    case 'gsword':{
      // 차지 액스 — BAL.wpn.gsword 참조
      const GB=BAL.wpn.gsword;
      if(p.cbMode==='sword'){
        SFX.slash();
        slashHit(p,ang,GB.swordR*am,GB.swordSpan,dmg*GB.swordDmgMul,'#ff66bb',GB.swordLife,false,true);
      }else{
        SFX.bHit();
        slashHit(p,ang,GB.axeR*am,GB.axeSpan,dmg*GB.axeDmgMul,'#ee5588',GB.axeLife,false,false);
        shake(0.12,3);
      }
      break;
    }
    case 'caff':{
      // 초고출력 차지 액스 (진화): 충전 2배, 도끼 모드시 SAED 번개 — BAL.wpn.caff 참조
      const CB=BAL.wpn.caff;
      if(p.cbMode==='sword'){
        SFX.slash();
        slashHit(p,ang,CB.swordR*am,CB.swordSpan,dmg*CB.swordDmgMul,'#ff0088',0.22,true,true);
      }else{
        // SAED: 도끼 강타 + 앞으로 번개 N발 (쾅 쾅 쾅)
        SFX.bHit();
        slashHit(p,ang,CB.axeR*am,CB.axeSpan,dmg*CB.axeDmgMul,'#ff0088',0.35,true,false);
        shake(0.15,4);
        const bdmg=dmg*CB.lightningDmgMul;
        // 번개 N발 (BAL.lightningCount), BAL.lightningDelay초 간격으로 앞으로
        for(let i=0;i<CB.lightningCount;i++){
          const dist_=70+i*55;
          const lx=p.x+Math.cos(ang)*dist_,ly=p.y+Math.sin(ang)*dist_;
          setTimeout(()=>{
            if(!player||player.hp<=0)return;
            spawnLightning(lx,ly,bdmg,true);
            SFX.thunder();
          },i*CB.lightningDelay*1000);
        }
      }
      break;
    }
  }
}
// 윤소민 스텔라이브 변신 빔 공격 (각 변신마다 빔 색/길이/각도/효과 차별화)
function applyStreamerLight(p,ang,dmg,am,pierce,wlv,form,baseType){
  const isEvo=baseType==='nightwatch';
  const lvCnt=wlvAt(WPROJ.light,wlv);
  // 진화 시 모든 변신 빔이 더 강해짐 (길이/틱속도/슬로우)
  const evoLen=isEvo?25:0, evoTick=isEvo?0.85:1.0, evoSlow=isEvo?0.4:0;
  switch(form.id){
    case 'workmode':{
      // 📞 야근 모드: 손전등 2개 풀가동 — 가장 가까운 적 + 두 번째 적 방향으로 강한 빔 2발
      const LB=BAL.wpn.light;
      const len=LB.lenBase+lvCnt*LB.lenPerLv+evoLen+30, ha=(LB.halfAngBase+lvCnt*LB.halfAngPerLv)+0.08;
      let ang2=ang+0.6;
      const list=(boss?[...enemies,boss]:enemies).filter(e=>!e.dead).map(e=>[e,dist(p,e)]).sort((a,b)=>a[1]-b[1]);
      if(list[1])ang2=Math.atan2(list[1][0].y-p.y,list[1][0].x-p.x);
      [[ang,'#ccffee'],[ang2,'#ffee88']].forEach(([aa,col])=>spawnBeam(p,aa,{
        col,len,halfAng:ha,life:LB.life,tickInt:0.18,
        dmg:dmg*1.5,slowDur:LB.slowDur+0.5,wt:'beam',bigClick:true
      }));
      break;
    }
    case 'shibuki':{
      // 여우신의 변덕: 틱마다 데미지 럭 (0.4x/1.6x/4x), 폭딜 시 화면 흔들림
      const wideBeam=isEvo;
      spawnBeam(p,ang,{
        col:form.col, // 주황
        len:(175+lvCnt*10+evoLen), halfAng:wideBeam?0.55:0.42,
        life:0.85, tickInt:0.18*evoTick,
        dmg:dmg*1.4, slowDur:1.2+evoSlow, wt:'beam_sb',
        bigClick:true,
        onHit:(e,wasAlive)=>{
          // 럭 데미지 — 폭딜 트리거 시 추가타
          const r=Math.random();
          if(r<0.15&&wasAlive&&!e.dead){
            // 추가 폭딜
            e.hurt(dmg*1.8,true,'beam_sb');
            spawnParts(e.x,e.y,'#ffaa00',5);
            shake(0.06,1.8);
          }
        }
      });
      break;
    }
    case 'riko':{
      // 이지피야 칼춤: 좁은 빔 3개 다발 (각도 약간 다름) — 빠른 다타 컨셉 재현
      const beams=3;
      const arc=0.28; // 3개 빔의 총 부채꼴 너비
      for(let i=0;i<beams;i++){
        const da=-arc+arc*(i/(beams-1));  // -arc, 0, +arc
        spawnBeam(p,ang+da,{
          col:'#22cc88',
          len:(200+lvCnt*10+evoLen), halfAng:0.22,
          life:0.85,
          dmg:dmg*0.9, slowDur:0.8+evoSlow, wt:'beam_rk'
        });
      }
      break;
    }
    case 'huya':{
      // 어둠 마법: 좁은 보라색 레이저 — BAL.beam.huya 참조
      const HB=BAL.beam.huya;
      spawnBeam(p,ang,{
        col:'#9966cc',
        len:(HB.lenBase+lvCnt*HB.lenPerLv+evoLen), halfAng:HB.halfAng,
        life:0.95, tickInt:0.35*evoTick,
        dmg:dmg*HB.dmgMul, slowDur:HB.slowDur+evoSlow, wt:'beam_hy',
        bigClick:true
      });
      break;
    }
    case 'lize':{
      // 흡혈의 밤: 빨간 빔. 처치시 HP 회복, 슬로우 더 길게
      spawnBeam(p,ang,{
        col:'#cc3344',
        len:(185+lvCnt*10+evoLen), halfAng:0.40,
        life:0.85, tickInt:0.20*evoTick,
        dmg:dmg*1.4, slowDur:2.0+evoSlow, wt:'beam_lz',
        onHit:(e,wasAlive)=>{
          if(wasAlive&&e.dead&&Math.random()<0.6){
            const heal=isEvo?4:3;
            player.hp=Math.min(player.mhp,player.hp+heal);
            showDmg(player.x,player.y-16,heal,'#ff66aa',false);
          }
        }
      });
      break;
    }
    case 'tabi':{
      // 트로트 폭격: 호밍 음표 + 빔. 빔은 트로트 컬러로 비추고, 콘 안에서 음표가 적을 따라감
      const beam=spawnBeam(p,ang,{
        col:'#ffaa22',
        len:(170+lvCnt*10+evoLen), halfAng:0.40,
        life:0.85, tickInt:0.22*evoTick,
        dmg:dmg*1.0, slowDur:1.2+evoSlow, wt:'beam_tb'
      });
      // 호밍 음표 추가 발사 (콘 안에서 적 추적)
      const t=p.nearest();
      const cnt=lvCnt+1+(isEvo?1:0);
      for(let i=0;i<cnt;i++){
        const a=ang+rnd(-0.35,0.35);
        const pr=new Proj(p.x,p.y,Math.cos(a)*340,Math.sin(a)*340,dmg*0.95,2.2,'#ffaa22',12*am,pierce+2,'light_tb');
        pr.hom=true;pr.htgt=t;
        projs.push(pr);
      }
      break;
    }
    case 'sleep':{
      // 졸음 (꽝): 20% 확률로 그냥 안 켜짐 — BAL.beam.sleep 참조
      if(Math.random()<BAL.beam.sleep.failChance){
        // 꽝! 불 안 켜짐
        showDmg(p.x,p.y-16,0,'#888888',false);
        spawnParts(p.x,p.y-8,'#666688',3);
        return;
      }
      spawnBeam(p,ang,{
        col:'#888899',
        len:115+lvCnt*5, halfAng:0.32,
        life:0.55, tickInt:0.30,
        dmg:dmg*0.45, slowDur:0.6, wt:'beam_sleep'
      });
      break;
    }
    case 'hina':{
      // 🌟 절대적 아이돌 (JACKPOT): 5방향 거대 빔 (광역 커버리지 줄여 적당히 강함). 처치 시 HP+1.
      const beams=5;
      const len=235+lvCnt*15+evoLen*1.2;
      for(let i=0;i<beams;i++){
        const a=ang+Math.PI*2/beams*i;
        spawnBeam(p,a,{
          col: i%2===0 ? '#ff66bb' : '#ffdd66', // 핑크/금 번갈아
          len:len, halfAng:0.50,
          life:0.95,
          dmg:dmg*1.1, slowDur:3.0+evoSlow, wt:'beam_hina',
          bigClick:true,
          alpha:0.65,  // 적 가시성 위해 살짝 투명
          onHit:(e,wasAlive)=>{
            if(wasAlive&&e.dead){
              player.hp=Math.min(player.mhp,player.hp+1);
              showDmg(player.x,player.y-16,1,'#ff66bb',false);
            }
          }
        });
      }
      // 잭팟 임팩트: 화면 흔들림 + 별빛 파티클 (살짝 줄임)
      shake(0.18,4);
      spawnParts(p.x,p.y,'#ff66bb',12);
      spawnParts(p.x,p.y,'#ffdd66',12);
      break;
    }
  }
}
// 💎 비트코인 진화: 에네르기파 — 공전하는 비트코인들에서 바깥으로 뻗는 지속 빔(3초), 동전과 같이 회전
function fireBitcoinLaser(p){
  const Z=BAL.char.zw;
  const w=p.wpns.find(w=>w.type==='bitcoin'),wlv=w?(w.lv||1):1;
  const tickDmg=18*p.dm*wlvAt(WLV.dmgM,wlv)*(1+Math.max(0,p.lv-1)*0.04)*Z.btcLaserMul;  // 틱당
  const R=Z.btcLaserLen, HW=Z.btcLaserWidth;
  projs.push({
    x:p.x, y:p.y, isAoe:true, wt:'btclaser', dead:false,
    life:Z.btcLaserDur, ml:Z.btcLaserDur, tickT:0,
    // 현재 비트코인들의 각도·반경 (동전 공전과 동일 → 같이 회전). 동전 없으면 균등 폴백
    emitters(){
      const cs=player.orbitCoins&&player.orbitCoins.filter(c=>!c.dead&&c.bc);
      if(cs&&cs.length)return {orbR:cs[0].orbR, angs:cs.map(c=>c.baseAng+gameTime*c.spin)};
      return {orbR:80, angs:Array.from({length:Z.btcLaserCount},(_,i)=>Math.PI*2/Z.btcLaserCount*i+gameTime*2.9)};
    },
    update(dt){
      this.x=player.x; this.y=player.y;
      this.life-=dt;
      if(this.life<=0){this.dead=true;return;}
      this.tickT-=dt;
      if(this.tickT>0)return;
      this.tickT=Z.btcLaserTick;
      const em=this.emitters(), orbR=em.orbR, angs=em.angs;
      (boss?[...enemies,boss]:enemies).forEach(e=>{
        if(e.dead)return;
        for(let i=0;i<angs.length;i++){
          const ca=angs[i], cx=this.x+Math.cos(ca)*orbR, cy=this.y+Math.sin(ca)*orbR;  // 빔 원점 = 동전 위치
          const dx=e.x-cx, dy=e.y-cy;
          const along=dx*Math.cos(ca)+dy*Math.sin(ca);                                  // 동전에서 바깥 방향 투영
          if(along<-e.sz||along>R+e.sz)continue;
          const perp=Math.abs(-dx*Math.sin(ca)+dy*Math.cos(ca));
          if(perp<HW+e.sz){
            const cr=Math.random()<player.crit; let dd=tickDmg; if(e===boss)dd*=player.bdm; if(cr)dd*=2;
            e.hurt(dd,cr,'btclaser');
            e.flash=Math.min(e.flash,0.04);  // 빔 지속 틱 → 흰 피격플래시 짧게
            break;
          }
        }
      });
    },
    draw(){
      const fadeIn=Math.min(1,(this.ml-this.life)/0.25), fadeOut=Math.min(1,this.life/0.4), al=fadeIn*fadeOut;
      const em=this.emitters(), orbR=em.orbR, angs=em.angs;
      G.save();G.translate(this.x,this.y);  // 가산혼합 안 씀 (몬스터 글로우 방지)
      for(let i=0;i<angs.length;i++){
        const ca=angs[i];
        G.save();G.rotate(ca);G.translate(orbR,0);  // 동전 위치로 → 바깥쪽으로 빔
        const hw=HW*(0.9+0.1*Math.sin(gameTime*10+i*1.7));  // 두께감 유지 (살짝 펄스)
        const grad=G.createLinearGradient(0,0,R,0);
        grad.addColorStop(0,`rgba(247,178,66,${0.42*al})`);   // 따뜻한 주황 (흰빛 X)
        grad.addColorStop(0.5,`rgba(238,140,30,${0.24*al})`);
        grad.addColorStop(1,`rgba(238,140,30,0)`);
        G.fillStyle=grad;
        G.beginPath();G.moveTo(0,-hw*0.5);G.lineTo(R,-hw);G.lineTo(R,hw);G.lineTo(0,hw*0.5);G.closePath();G.fill();
        G.strokeStyle=`rgba(255,196,100,${0.38*al})`;G.lineWidth=2;  // 차분한 주황 코어 선
        G.beginPath();G.moveTo(0,0);G.lineTo(R*0.9,0);G.stroke();
        G.restore();
      }
      G.restore();
    }
  });
  SFX.shoot();shake(0.08,2);spawnParts(p.x,p.y,'#ffcc44',8);
  notify('💎 비트코인 에네르기파!','3초간 사방 관통','#f7931a');
}
function aoeHit(x,y,r,col,dmg,life,pierce,slow=false,wt='',visCnt=0,falloff=null){
  projs.push({x,y,r,col,life,ml:life,dead:false,isAoe:true,wt,visCnt,
    update(dt){this.life-=dt;if(this.life<=0)this.dead=true},
    draw(){
      const al=this.life/this.ml,t=1-al;
      G.save();
      // 외곽 미세 링 (피해 범위 표시)
      G.globalAlpha=al*0.18;G.strokeStyle=this.col;G.lineWidth=1.5;
      G.beginPath();G.arc(this.x,this.y,this.r,0,Math.PI*2);G.stroke();
      G.globalAlpha=al*0.08;G.fillStyle=this.col;
      G.beginPath();G.arc(this.x,this.y,this.r,0,Math.PI*2);G.fill();
      G.globalAlpha=1;
      if(this.wt==='ram'||this.wt==='fullspec'){
        // 램 스틱이 방사형으로 퍼져나감 (레벨에 따라 개수↑)
        const evolved=this.wt==='fullspec';
        const cnt=this.visCnt||(evolved?10:8);
        for(let i=0;i<cnt;i++){
          const ang=Math.PI*2/cnt*i+(evolved?t*1.5:0);
          const rd=this.r*t;
          const rx=this.x+Math.cos(ang)*rd,ry=this.y+Math.sin(ang)*rd;
          const sc=evolved?0.9:0.75;
          G.save();G.globalAlpha=al*(1-t*0.4);
          G.translate(rx,ry);G.rotate(ang+Math.PI/2);
          // PCB 본체
          G.fillStyle=evolved?'#0088cc':'#1a6633';
          G.fillRect(-9*sc,-3.5*sc,18*sc,7*sc);
          G.fillStyle=evolved?'#00bbff':'#228844';
          G.fillRect(-9*sc,-3.5*sc,18*sc,1.5*sc);
          // 메모리 칩
          G.fillStyle='#1a1a1a';
          [-6,-3,0,3].forEach(ox=>G.fillRect(ox*sc,-1.8*sc,2.5*sc,2.5*sc));
          // 금 핀 (아래)
          G.fillStyle=evolved?'#ffcc00':'#ccaa00';
          G.fillRect(-8*sc,3*sc,16*sc,1.5*sc);
          // 노치
          G.fillStyle='#000';G.fillRect(-1.2*sc,3*sc,2.4*sc,1.8*sc);
          // 흰 라벨
          G.fillStyle='#fff';G.fillRect(-3*sc,-0.5*sc,4*sc,1.5*sc);
          // 발광 효과 (fullspec)
          if(evolved){
            G.strokeStyle=`rgba(0,200,255,${al*0.7})`;G.lineWidth=1;
            G.strokeRect(-9.5*sc,-4*sc,19*sc,8*sc);
          }
          G.restore();
        }
        // 중앙 임팩트 (작은 깜빡임)
        if(t<0.3){
          G.globalAlpha=al*(1-t*3)*0.6;G.fillStyle=evolved?'#88eeff':'#aaffcc';
          G.beginPath();G.arc(this.x,this.y,15+t*30,0,Math.PI*2);G.fill();
        }
      }else if(this.wt==='staff'||this.wt==='awakegj'){
        // 캐릭터 중심에서 사방으로 퍼져나가는 충격파 + 방사형 균열
        const evolved=this.wt==='awakegj';
        const baseR=this.r;
        G.translate(this.x,this.y);
        // 중앙 임팩트 플래시 (시작 순간만). 진화는 슬램이 잦으니 흰 플래시 약하게 = 눈 보호
        if(t<0.2){
          G.globalAlpha=al*(1-t*5)*(evolved?0.4:0.85);
          G.fillStyle=evolved?'#e0b8ff':'#fff';
          G.beginPath();G.arc(0,0,8+t*30,0,Math.PI*2);G.fill();
          G.globalAlpha=al*(1-t*5)*0.55;
          G.fillStyle=evolved?'#bb77ee':'#cc88ff';
          G.beginPath();G.arc(0,0,16+t*40,0,Math.PI*2);G.fill();
        }
        // 진화(쌍지팡이): 위에서 지팡이 봉이 내려찍는 연출 — 슬램 직후 짧게
        if(evolved&&t<0.32){
          const drop=Math.min(1,t/0.12), fade=1-Math.max(0,(t-0.12)/0.2);
          const topY=-58*(1-drop)-14;  // 위에서 임팩트로 하강
          G.globalAlpha=al*fade*0.9;
          G.strokeStyle='#9b5fd0';G.lineWidth=5;G.lineCap='round';
          G.beginPath();G.moveTo(0,topY);G.lineTo(0,-4);G.stroke();
          G.fillStyle='#cc88ff';G.beginPath();G.arc(0,topY,5.5,0,Math.PI*2);G.fill();  // 봉 머리(보라 보석)
          G.globalAlpha=al*fade*0.7;G.fillStyle='#fff';G.beginPath();G.arc(-1.6,topY-1.6,2,0,Math.PI*2);G.fill();
          G.lineCap='butt';
        }
        // 동심원 충격파 3겹 — 시간차로 퍼져나감
        for(let i=0;i<3;i++){
          const offset=i*0.18;
          const waveT=t-offset;
          if(waveT<0||waveT>1)continue;
          const r=baseR*waveT;
          // 외곽 굵은 링
          G.globalAlpha=al*(1-waveT)*0.85;
          G.strokeStyle=evolved?'#ff66ff':'#cc88ff';
          G.lineWidth=4*(1-waveT*0.5);
          G.beginPath();G.arc(0,0,r,0,Math.PI*2);G.stroke();
          // 내부 흰 코어 링
          G.globalAlpha=al*(1-waveT)*0.5;
          G.strokeStyle='#ffffff';
          G.lineWidth=1.5;
          G.beginPath();G.arc(0,0,Math.max(0,r-3),0,Math.PI*2);G.stroke();
          // 첫 링은 연한 보라 채움
          if(i===0){
            G.globalAlpha=al*(1-waveT)*0.15;
            G.fillStyle=evolved?'#ff88ff':'#cc88ff';
            G.beginPath();G.arc(0,0,r,0,Math.PI*2);G.fill();
          }
        }
        // 방사형 균열 (사방으로 뻗어나가는 선)
        const crackCount=evolved?10:8;
        const crackT=Math.min(1,t*1.4);
        for(let j=0;j<crackCount;j++){
          const ja=j*Math.PI*2/crackCount+t*0.3;
          const r1=10, r2=10+crackT*(baseR-10);
          const wobble=Math.sin(j*7.3)*0.12;
          const ax=Math.cos(ja+wobble), ay=Math.sin(ja+wobble);
          G.globalAlpha=al*(1-crackT*0.7)*0.85;
          G.strokeStyle=evolved?'#882288':'#553377';
          G.lineWidth=2.5*(1-crackT*0.3);
          G.beginPath();
          G.moveTo(ax*r1, ay*r1);
          G.lineTo(ax*r2, ay*r2);
          G.stroke();
          // 균열 끝 작은 점 (강조)
          if(crackT>0.3){
            G.globalAlpha=al*(1-crackT)*0.75;
            G.fillStyle=evolved?'#ff88ff':'#cc88ff';
            G.beginPath();
            G.arc(ax*r2, ay*r2, 2.5+(1-crackT)*2, 0, Math.PI*2);
            G.fill();
          }
        }
        // 마지막 잔존 글로우 (페이드 아웃)
        if(t>0.6){
          const fadeT=(t-0.6)/0.4;
          G.globalAlpha=al*(1-fadeT)*0.18;
          G.fillStyle=evolved?'#ff88ff':'#cc88ff';
          G.beginPath();G.arc(0,0,baseR,0,Math.PI*2);G.fill();
        }
      }
      G.restore();
    }
  });
  (boss?[...enemies,boss]:enemies).forEach(e=>{
    const ed=dist({x,y},e);
    if(ed<r+e.sz){
      let dd=dmg;
      // 거리감쇠: 중심 max → 가장자리 min (지팡이 '킬존' — 가까울수록 강함)
      if(falloff){const fr=clamp(ed/r,0,1);dd*=falloff.min+(falloff.max-falloff.min)*(1-fr);}
      if(e===boss)dd*=player.bdm;
      const cr=Math.random()<player.crit;if(cr)dd*=2;
      e.hurt(dd,cr,wt);if(slow&&'slow'in e)e.slow=2;
    }
  });
}

// ═══ 차지 액스 - 초승달 슬래시 + 번개 ═══
function slashHit(p,faceAng,r,spanDeg,dmg,col,life,evolved,fillGauge){
  const span=spanDeg*Math.PI/180;
  const slash={x:p.x,y:p.y,faceAng,r,span,life,ml:life,dead:false,col,evolved,isAoe:true,wt:'slash',
    update(dt){this.life-=dt;if(this.life<=0)this.dead=true;
      // 슬래시는 플레이어를 따라다님
      this.x=player.x;this.y=player.y;
    },
    draw(){
      const al=this.life/this.ml,t=1-al;
      G.save();G.translate(this.x,this.y);G.rotate(this.faceAng);
      const outer=this.r*(0.9+t*0.2),inner=outer-12;
      // 외곽 글로우
      G.globalAlpha=al*0.35;G.fillStyle=this.col;
      G.beginPath();
      G.arc(0,0,outer+5,-this.span/2,this.span/2);
      G.arc(0,0,inner-3,this.span/2,-this.span/2,true);
      G.closePath();G.fill();
      // 메인 호
      G.globalAlpha=al*0.95;G.fillStyle=this.col;
      G.beginPath();
      G.arc(0,0,outer,-this.span/2,this.span/2);
      G.arc(0,0,inner,this.span/2,-this.span/2,true);
      G.closePath();G.fill();
      // 흰 코어
      G.globalAlpha=al*0.85;G.fillStyle='#ffffff';
      G.beginPath();
      G.arc(0,0,outer-3,-this.span/2+0.08,this.span/2-0.08);
      G.arc(0,0,inner+3,this.span/2-0.08,-this.span/2+0.08,true);
      G.closePath();G.fill();
      // 끝 스파크
      G.globalAlpha=al;G.fillStyle='#ffffff';
      const tipR=(outer+inner)/2;
      [-this.span/2,this.span/2].forEach(a=>{
        G.beginPath();G.arc(Math.cos(a)*tipR,Math.sin(a)*tipR,3,0,Math.PI*2);G.fill();
      });
      G.restore();
    }
  };
  projs.push(slash);
  // 부채꼴 안에 있는 적 데미지
  const all=boss?[...enemies,boss]:enemies;
  all.forEach(e=>{
    const dx=e.x-p.x,dy=e.y-p.y,d=Math.hypot(dx,dy);
    if(d>r+e.sz||d<2)return;
    const ea=Math.atan2(dy,dx);
    let da=ea-faceAng;
    while(da>Math.PI)da-=Math.PI*2;
    while(da<-Math.PI)da+=Math.PI*2;
    if(Math.abs(da)>span/2)return;
    let dd=dmg;
    if(e===boss)dd*=p.bdm;
    const cr=Math.random()<p.crit;if(cr)dd*=2;
    e.hurt(dd,cr,'slash');
    // 검 모드일 때만 게이지 충전
    if(fillGauge&&p.cbMode==='sword'){
      const wpn=p.wpns.find(w=>w.type==='gsword'||w.type==='caff');
      if(wpn){
        const wlv=wpn.lv||1;
        const fill=(0.015+wlv*0.005)*(evolved?2:1);
        p.cbGauge=Math.min(1,p.cbGauge+fill);
        if(p.cbGauge>=1){
          // 도끼 모드 진입!
          p.cbMode='axe';
          p.cbAxeMax=evolved?6:5;
          p.cbAxeT=p.cbAxeMax;
          notify('🪓 도끼 모드!','풀 차지 완료','#ffaa44');
          SFX.phialReady();
          shake(0.15,3);
        }
      }
    }
  });
}
function spawnLightning(x,y,dmg,evolved){
  const r=evolved?42:36;
  const light={x,y,life:0.45,ml:0.45,dead:false,isAoe:true,wt:'lightning',
    update(dt){this.life-=dt;if(this.life<=0)this.dead=true},
    draw(){
      const al=this.life/this.ml,t=1-al;
      G.save();
      // 위에서 떨어지는 번개 (시각)
      G.globalAlpha=al;
      G.strokeStyle='#ffffaa';G.lineWidth=4;
      G.shadowColor='#ffff66';G.shadowBlur=12;
      G.beginPath();
      let py=this.y-220;
      G.moveTo(this.x,py);
      while(py<this.y-5){
        py+=12+Math.random()*8;
        G.lineTo(this.x+rnd(-9,9),Math.min(py,this.y-5));
      }
      G.lineTo(this.x,this.y);
      G.stroke();
      // 흰 코어
      G.shadowBlur=0;G.strokeStyle='#ffffff';G.lineWidth=1.8;
      G.beginPath();G.moveTo(this.x,this.y-220);G.lineTo(this.x,this.y);G.stroke();
      // 임팩트 폭발
      G.globalAlpha=al*0.7;G.fillStyle='#ffff77';
      G.beginPath();G.arc(this.x,this.y,r*(0.6+t*0.6),0,Math.PI*2);G.fill();
      G.globalAlpha=al*0.9;G.fillStyle='#ffffff';
      G.beginPath();G.arc(this.x,this.y,r*0.3*(1-t*0.5),0,Math.PI*2);G.fill();
      // 바닥 갈라짐 잔상
      G.globalAlpha=al*0.5;G.strokeStyle='#ffdd44';G.lineWidth=2;
      for(let i=0;i<4;i++){
        const a=Math.PI*2/4*i;
        G.beginPath();G.moveTo(this.x,this.y);
        G.lineTo(this.x+Math.cos(a)*r*(0.5+t*0.5),this.y+Math.sin(a)*r*(0.5+t*0.5));
        G.stroke();
      }
      G.restore();
    }
  };
  projs.push(light);
  // 데미지
  (boss?[...enemies,boss]:enemies).forEach(e=>{
    if(dist({x,y},e)<r+e.sz){
      let dd=dmg;
      if(e===boss)dd*=player.bdm;
      const cr=Math.random()<player.crit;if(cr)dd*=2;
      e.hurt(dd,cr,'lightning');
    }
  });
  shake(0.12,3);
}
// ═══ 튕기는 RAM 스틱 (영구 — 매 발사마다 새로 생성하지 않고 1~2개를 계속 유지) ═══
// 화면 가시 영역 안에서 튕기면서 데미지. 적당 0.5초 쿨다운으로 재타격 가능.
// dead로 명시 표시할 때까지 영구. opts.persistent=true면 life 감소 안 함.
function spawnBouncingRam(p,opts){
  const o=opts||{};
  const sp=o.speed||230;
  // 초기 각도: 수직/수평에 너무 가깝지 않게 (vx, vy 모두 일정 크기 보장)
  // 사분면 1개 선택 → 그 안에서 25°~65° 사이 (대각선 영역) → 우연한 회전으로 부호 결정
  const quadrant=Math.floor(Math.random()*4);
  const angInQ=rnd(Math.PI/7, Math.PI/2-Math.PI/7);  // ~25°~65°
  const ang=quadrant*Math.PI/2+angInQ;
  const ram={
    x:p.x,y:p.y,
    vx:Math.cos(ang)*sp, vy:Math.sin(ang)*sp, spdBase:sp,
    dmg:o.dmg||10,
    life:o.life||5, ml:o.life||5, dead:false,
    persistent:!!o.persistent,
    col:o.col||'#44aaff',
    sz:o.sz||10,
    wt:o.wt||'ram_bounce',
    fancy:!!o.fancy,
    trail:[],         // 잔상 추적 (최근 위치들)
    trailT:0,         // 잔상 갱신 타이머
    hitMap:new WeakMap(), // enemy -> last hit gameTime (WeakMap → 적 GC 시 자동 정리, 메모리 누수 방지)
    isAoe:true, // Proj.draw 우회 (custom draw 사용)
    update(dt){
      if(!this.persistent){
        this.life-=dt;
        if(this.life<=0){this.dead=true;return}
      }
      // 잔상 위치 기록 (0.04초마다 — 너무 자주 안 쌓이게)
      this.trailT-=dt;
      if(this.trailT<=0){
        this.trailT=0.04;
        this.trail.push({x:this.x,y:this.y});
        if(this.trail.length>8)this.trail.shift(); // 최대 8개
      }
      // 자체 이동
      this.x+=this.vx*dt;
      this.y+=this.vy*dt;
      // 화면 가시 영역 (카메라가 플레이어 따라가니까 항상 화면 안에 머무름)
      const pad=24;
      const minX=player.x-LW/2+pad, maxX=player.x+LW/2-pad;
      const minY=player.y-LH/2+pad, maxY=player.y+LH/2-pad;
      // 반사 (clamp + 부호 뒤집기)
      if(this.x<minX){this.x=minX;this.vx=Math.abs(this.vx)}
      else if(this.x>maxX){this.x=maxX;this.vx=-Math.abs(this.vx)}
      if(this.y<minY){this.y=minY;this.vy=Math.abs(this.vy)}
      else if(this.y>maxY){this.y=maxY;this.vy=-Math.abs(this.vy)}
      // 적 충돌 체크 (재타격 쿨다운 — BAL.wpn.ram.hitCd 참조)
      const cdT=BAL.wpn.ram.hitCd;
      const all=boss?[...enemies,boss]:enemies;
      all.forEach(e=>{
        const last=this.hitMap.get(e)||-1;
        if(gameTime-last<cdT)return;
        const dx=e.x-this.x,dy=e.y-this.y;
        const rr=this.sz+e.sz;
        if(dx*dx+dy*dy<rr*rr){
          let dd=this.dmg;
          if(e===boss)dd*=player.bdm;
          const cr=Math.random()<player.crit; if(cr)dd*=2;
          e.hurt(dd,cr,this.wt);
          this.hitMap.set(e,gameTime);
        }
      });
    },
    draw(){
      const al=this.persistent?1:clamp(this.life/this.ml,0,1);
      const s=this.sz;
      // 뿌연 흰 트레일 (회전 없이 직사각형으로) — 가시성 안 망치는 정도
      G.save();
      this.trail.forEach((pt,i)=>{
        const f=(i+1)/this.trail.length;  // 새로울수록 진함
        G.globalAlpha=f*0.18;             // 최대 0.18 (희미)
        G.fillStyle='#ffffff';
        G.fillRect(pt.x-s,pt.y-s*0.42,s*2,s*0.84);
      });
      G.restore();
      // RAM 본체 (회전 없음, 직사각형 그대로)
      G.save();
      G.translate(this.x,this.y);
      G.globalAlpha=Math.min(1,al*1.4);
      // 글로우
      if(this.fancy){
        G.fillStyle='rgba(0,200,255,0.25)';
        G.beginPath();G.arc(0,0,s*1.6,0,Math.PI*2);G.fill();
      }
      // PCB 본체
      G.fillStyle=this.fancy?'#0088cc':'#1a6633';
      G.fillRect(-s,-s*0.42,s*2,s*0.84);
      G.fillStyle=this.fancy?'#00bbff':'#228844';
      G.fillRect(-s,-s*0.42,s*2,s*0.16);
      // 메모리 칩들
      G.fillStyle='#1a1a1a';
      for(let i=-2;i<=2;i++){
        G.fillRect(i*s*0.32-s*0.13,-s*0.22,s*0.26,s*0.44);
      }
      // 라벨 스티커
      G.fillStyle='#fff';
      G.fillRect(-s*0.32,-s*0.06,s*0.64,s*0.14);
      G.fillStyle=this.fancy?'#0088cc':'#000';
      G.fillRect(-s*0.26,-s*0.02,s*0.52,s*0.07);
      G.restore();
    }
  };
  projs.push(ram);
  return ram;
}

// ═══ 손전등 빔 (콘 단발 데미지 + 슬로우, 발사 위치에 잔상으로 남음) ═══
// 윤소민이 손전등을 "딸깍" 한 번 켜는 느낌. 빔은 발사 순간 위치/방향 고정 → 단발 데미지+슬로우 → 잔상으로 페이드.
// opts: {col,len,halfAng,life,dmg,slowDur,wt,onHit,bigClick}
function spawnBeam(p,ang,opts){
  const o=opts||{};
  // 발사 순간 위치/방향 캡처 (이후 절대 안 움직임)
  const ox=p.x, oy=p.y;
  const len=o.len||280, halfAng=o.halfAng||0.38;
  // 데미지 + 슬로우는 spawn 순간 1회만 동기 적용
  const dmg=o.dmg||10, slowDur=o.slowDur||1.4;
  const onHit=o.onHit||null;
  const all=boss?[...enemies,boss]:enemies;
  all.forEach(e=>{
    const dx=e.x-ox, dy=e.y-oy, d=Math.hypot(dx,dy);
    if(d>len+e.sz||d<2)return;
    const ea=Math.atan2(dy,dx);
    let dela=ea-ang;
    while(dela>Math.PI)dela-=Math.PI*2;
    while(dela<-Math.PI)dela+=Math.PI*2;
    if(Math.abs(dela)>halfAng)return;
    let dd=dmg;
    if(e===boss)dd*=player.bdm;
    const cr=Math.random()<player.crit; if(cr)dd*=2;
    const wasAlive=!e.dead;
    e.hurt(dd,cr,o.wt||'beam');
    if('slow'in e)e.slow=Math.max(e.slow,slowDur);
    if(onHit)onHit(e,wasAlive);
  });
  // 이후 객체는 순수 시각용 — 발사 위치에 콘 잔상으로 페이드
  const beam={
    x:ox,y:oy,ang:ang,
    col:o.col||'#ccffee',
    len:len, halfAng:halfAng,
    life:o.life||0.85, ml:o.life||0.85, dead:false,
    wt:o.wt||'beam',
    click:o.bigClick?0.18:0.11, clickMax:o.bigClick?0.18:0.11,
    bigClick:!!o.bigClick, isAoe:true,
    visAlpha:o.alpha||1,  // 시각 투명도 배율 (잭팟 hina용)
    update(dt){
      this.life-=dt; if(this.life<=0){this.dead=true;return}
      if(this.click>0)this.click-=dt;
      // 위치/방향 모두 고정 — 어디에도 따라가지 않음
    },
    draw(){
      const al=clamp(this.life/this.ml,0,1);
      const clickAl=this.click>0?this.click/this.clickMax:0;
      const va=this.visAlpha;  // 시각 투명도 배율
      const cr=parseInt(this.col.slice(1,3),16),cg=parseInt(this.col.slice(3,5),16),cb=parseInt(this.col.slice(5,7),16);
      G.save();
      G.globalCompositeOperation='lighter';  // 가산 혼합 — 빔이 적을 덮지 않고 '빛을 더함' (초록빔+초록좀비 가독성 ↑)
      G.translate(this.x,this.y);
      G.rotate(this.ang);
      // 손에서 출발하는 약간의 오프셋
      const ox=4;
      const wStart=4, wEnd=Math.tan(this.halfAng)*this.len*2;
      // 외곽 글로우 콘
      G.globalAlpha=Math.min(1,(al*0.18+clickAl*0.35)*va);
      G.fillStyle=`rgb(${cr},${cg},${cb})`;
      G.beginPath();
      G.moveTo(ox,-wStart/2);
      G.lineTo(ox+this.len,-wEnd/2);
      G.lineTo(ox+this.len,wEnd/2);
      G.lineTo(ox,wStart/2);
      G.closePath();G.fill();
      // 내부 더 밝은 콘
      G.globalAlpha=Math.min(1,(al*0.42+clickAl*0.5)*va);
      G.beginPath();
      G.moveTo(ox,-wStart/4);
      G.lineTo(ox+this.len*0.95,-wEnd*0.32);
      G.lineTo(ox+this.len*0.95,wEnd*0.32);
      G.lineTo(ox,wStart/4);
      G.closePath();G.fill();
      // 중심 흰 줄기
      G.globalAlpha=(al*0.85+clickAl*0.15)*va;
      G.fillStyle='#ffffff';
      G.fillRect(ox,-1.5,this.len*0.9,3);
      // 끝 반짝
      G.globalAlpha=(al*0.7+clickAl*0.3)*va;
      G.beginPath();G.arc(ox+this.len*0.92,0,3.4+clickAl*4,0,Math.PI*2);G.fill();
      // 딸깍 플래시 (켜진 직후 origin에 흰 번쩍)
      if(clickAl>0){
        G.globalAlpha=clickAl*0.85;
        G.fillStyle='#ffffff';
        G.beginPath();G.arc(ox,0,6+clickAl*8,0,Math.PI*2);G.fill();
      }
      G.restore();
    }
  };
  projs.push(beam);
  // 딸깍 SFX + 살짝 진동
  SFX.shoot();
  if(o.bigClick)shake(0.05,1.5);
  return beam;
}

// ═══ PROJECTILE ═══
class Proj{
  constructor(x,y,vx,vy,dmg,life,col,sz,pierce,wt=''){
    this.x=x;this.y=y;this.vx=vx;this.vy=vy;
    this.pdmg=dmg;this.life=life;this.ml=life;
    this.col=col;this.sz=sz||8;this.pierce=pierce||0;
    this.dead=false;this.hs=new Set();
    this.hom=false;this.htgt=null;this.boom=false;this.bT=0;this.bA=0;
    this.wt=wt;
  }
  update(dt){
    if(this.hom&&this.htgt&&!this.htgt.dead){const a=Math.atan2(this.htgt.y-this.y,this.htgt.x-this.x),s=Math.hypot(this.vx,this.vy);this.vx+=(Math.cos(a)*s-this.vx)*dt*4;this.vy+=(Math.sin(a)*s-this.vy)*dt*4}
    if(this.boom){this.bT+=dt;if(this.bT>0.7){const a=this.bA+Math.PI,s=Math.hypot(this.vx,this.vy);this.vx+=(Math.cos(a)*s-this.vx)*dt*5;this.vy+=(Math.sin(a)*s-this.vy)*dt*5}}
    this.x+=this.vx*dt;this.y+=this.vy*dt;this.life-=dt;
    if(this.life<=0){this.dead=true;return}
    (boss?[...enemies,boss]:enemies).forEach(e=>{
      if(this.hs.has(e)||this.dead)return;
      if(dist(this,e)<this.sz+e.sz){
        let dd=this.pdmg;if(e===boss)dd*=player.bdm;
        const cr=Math.random()<player.crit;if(cr)dd*=2;
        const wasAlive=!e.dead;
        e.hurt(dd,cr,this.wt);this.hs.add(e);
        // 리제 (흡혈의 밤) 효과: 처치 시 HP 회복, 적중 시 슬로우
        if(this.wt==='light_lz'){
          if('slow'in e)e.slow=1.5;
          if(wasAlive&&e.dead&&Math.random()<0.5){
            const heal=3;
            player.hp=Math.min(player.mhp,player.hp+heal);
            showDmg(player.x,player.y-16,heal,'#ff66aa',false);
          }
        }
        if(this.pierce<=0)this.dead=true;else this.pierce--;
      }
    });
  }
  draw(){
    G.save();
    const al=clamp(this.life/this.ml,0,1),s=this.sz;
    G.globalAlpha=al;
    const ang=Math.atan2(this.vy,this.vx);
    const spinT=(this.ml-this.life)*10;
    G.translate(this.x,this.y);
    switch(this.wt){
      case 'fullcourse':{
        // 🍣 진화: 일본 사시미(연어회) 슬라이스 — 모든 적 관통. 둥근 회 한 점이 날아감
        G.rotate(ang);
        // 모션 트레일
        G.fillStyle=`rgba(255,150,120,${al*0.32})`;
        G.beginPath();G.ellipse(-s*1.3,0,s*1.7,s*0.55,0,0,Math.PI*2);G.fill();
        // 회 본체 (주황핑크 타원)
        G.fillStyle='#ff8a66';
        G.beginPath();G.ellipse(0,0,s*1.45,s*0.9,0,0,Math.PI*2);G.fill();
        // 진한 가장자리
        G.strokeStyle='#e25a42';G.lineWidth=Math.max(1,s*0.16);
        G.beginPath();G.ellipse(0,0,s*1.45,s*0.9,0,0,Math.PI*2);G.stroke();
        // 흰 마블링 (지방 줄 3개)
        G.strokeStyle=`rgba(255,238,228,${al})`;G.lineWidth=Math.max(1,s*0.15);
        for(let i=-1;i<=1;i++){G.beginPath();G.moveTo(-s*1.15,i*s*0.42);G.quadraticCurveTo(0,i*s*0.42+s*0.18,s*1.15,i*s*0.42);G.stroke();}
        // 하이라이트(윤기)
        G.globalAlpha=al*0.85;G.fillStyle='#ffffff';
        G.beginPath();G.ellipse(-s*0.45,-s*0.38,s*0.4,s*0.2,0.35,0,Math.PI*2);G.fill();
        break;
      }
      case 'knife':{
        G.rotate(ang);  // 진행방향 고정 (회전 X — 어지럼 방지)
        const fancy=false;
        // 칼날 (커다란 삼각형)
        G.fillStyle=fancy?'#ffcc66':'#dddddd';
        G.beginPath();G.moveTo(s*2.1,0);G.lineTo(-s*0.4,-s*0.38);G.lineTo(-s*0.4,s*0.38);G.closePath();G.fill();
        // 칼날 하이라이트 (위쪽 빛)
        G.fillStyle='#ffffff';
        G.beginPath();G.moveTo(s*1.9,0);G.lineTo(-s*0.3,-s*0.14);G.lineTo(-s*0.3,-s*0.02);G.closePath();G.fill();
        // 칼날 그림자 (아래쪽 어두움)
        G.fillStyle=fancy?'#cc5500':'#888888';
        G.beginPath();G.moveTo(s*1.9,0);G.lineTo(-s*0.3,s*0.02);G.lineTo(-s*0.3,s*0.32);G.closePath();G.fill();
        // 십자 가드
        G.fillStyle='#1a1a1a';G.fillRect(-s*0.6,-s*0.55,s*0.25,s*1.1);
        G.fillStyle='#444';G.fillRect(-s*0.6,-s*0.55,s*0.25,s*0.2);
        // 손잡이
        G.fillStyle=fancy?'#aa3300':'#5a3a18';G.fillRect(-s*1.7,-s*0.4,s*1.1,s*0.8);
        G.fillStyle=fancy?'#771100':'#2a1a08';G.fillRect(-s*1.7,s*0.05,s*1.1,s*0.35);
        G.fillStyle=fancy?'#cc5500':'#7a5028';G.fillRect(-s*1.7,-s*0.4,s*1.1,s*0.15);
        // 리벳 2개
        G.fillStyle='#aaa';
        G.fillRect(-s*1.3,-s*0.1,s*0.18,s*0.18);
        G.fillRect(-s*0.85,-s*0.1,s*0.18,s*0.18);
        G.fillStyle='#222';
        G.fillRect(-s*1.27,-s*0.07,s*0.1,s*0.1);
        G.fillRect(-s*0.82,-s*0.07,s*0.1,s*0.1);
        // 폼멜
        G.fillStyle=fancy?'#882200':'#3a2010';
        G.fillRect(-s*1.85,-s*0.32,s*0.18,s*0.64);
        break;
      }
      case 'wifi':{
        // 🐕 황금뭉치 와이파이 음파 — 진행방향으로 펼쳐진 동심 호(📶) + 잔진동
        G.rotate(this.waveAng||ang);
        const s=this.sz, jit=Math.sin(gameTime*40)*s*0.05;
        // 글로우
        G.globalAlpha=al*0.3;G.fillStyle='#ffee88';G.beginPath();G.arc(0,jit,s*1.1,-0.85,0.85);G.fill();
        // 동심 호 3겹 (앞쪽 +x로 펼쳐짐)
        for(let i=1;i<=3;i++){
          G.globalAlpha=al*(0.95-i*0.14);
          G.strokeStyle=i===1?'#ffffff':'#ffdd22';G.lineWidth=Math.max(2,s*0.22);
          G.beginPath();G.arc(0,jit,s*0.34*i,-0.8,0.8);G.stroke();
        }
        // 중심 점 (와이파이 원점)
        G.globalAlpha=al;G.fillStyle='#fff';G.beginPath();G.arc(0,jit,s*0.16,0,Math.PI*2);G.fill();
        break;
      }
      case 'btclaser':{
        // 💎 비트코인 사방 관통레이저 — 가는 금빛 광선
        G.rotate(ang);
        const L=s*5;
        G.globalAlpha=al*0.45;G.fillStyle='#ffcc66';G.fillRect(-L,-s*0.55,L*2,s*1.1);  // 글로우
        G.globalAlpha=al;G.fillStyle='#f7931a';G.fillRect(-L*0.8,-s*0.3,L*1.6,s*0.6);
        G.fillStyle='#fff';G.fillRect(-L*0.6,-s*0.13,L*1.2,s*0.26);  // 흰 코어
        break;
      }
      case 'coin':case 'bitcoin':{
        // 💵 지워니 동전 / 💎 비트코인 — 회전하는 금화
        const bc=this.wt==='bitcoin', sc=s;
        G.rotate(spinT*0.35);  // 느린 회전(눈 보호)
        G.globalAlpha=al*0.3;G.fillStyle=bc?'#f7931a':'#ffd24a';
        G.beginPath();G.arc(0,0,sc*1.5,0,Math.PI*2);G.fill();
        G.globalAlpha=al;G.fillStyle=bc?'#f7931a':'#ffcf33';
        G.beginPath();G.arc(0,0,sc,0,Math.PI*2);G.fill();
        G.strokeStyle=bc?'#a85f0a':'#b8860b';G.lineWidth=Math.max(1,sc*0.18);
        G.beginPath();G.arc(0,0,sc,0,Math.PI*2);G.stroke();
        G.fillStyle=bc?'#fff':'#7a5a00';G.font=`bold ${Math.round(sc*1.4)}px Courier New`;G.textAlign='center';G.textBaseline='middle';
        G.fillText(bc?'₿':'₩',0,sc*0.05);  // ₿ / ₩
        G.textBaseline='alphabetic';
        G.globalAlpha=al*0.8;G.fillStyle='#fff';
        G.beginPath();G.arc(-sc*0.34,-sc*0.34,sc*0.26,0,Math.PI*2);G.fill();
        break;
      }
      case 'light_tb':{
        // 트로트 변신 호밍 음표 (♪) - 빛나는 트레일 + 음표 머리
        const cr=parseInt(this.col.slice(1,3),16),cg=parseInt(this.col.slice(3,5),16),cb=parseInt(this.col.slice(5,7),16);
        // 빛나는 글로우
        G.globalAlpha=al*0.35;
        G.fillStyle=`rgb(${cr},${cg},${cb})`;
        G.beginPath();G.arc(0,0,s*0.95,0,Math.PI*2);G.fill();
        G.globalAlpha=al*0.7;
        G.beginPath();G.arc(0,0,s*0.55,0,Math.PI*2);G.fill();
        // 음표 머리 (검은 타원, 살짝 기울임)
        G.globalAlpha=al;
        G.rotate(-0.35+spinT*0.3);
        G.fillStyle='#1a0a00';
        G.beginPath();G.ellipse(0,0,s*0.4,s*0.28,0,0,Math.PI*2);G.fill();
        // 음표 줄기 (스템)
        G.fillStyle='#1a0a00';
        G.fillRect(s*0.35,-s*0.9,s*0.1,s*0.95);
        // 깃발 (flag)
        G.fillStyle=`rgb(${cr},${cg},${cb})`;
        G.beginPath();
        G.moveTo(s*0.45,-s*0.9);
        G.quadraticCurveTo(s*1.1,-s*0.6,s*0.7,-s*0.15);
        G.quadraticCurveTo(s*0.55,-s*0.5,s*0.45,-s*0.45);
        G.closePath();G.fill();
        // 반짝
        G.globalAlpha=al*0.9;
        G.fillStyle='#ffffff';
        G.beginPath();G.arc(-s*0.18,-s*0.1,s*0.08,0,Math.PI*2);G.fill();
        break;
      }
      case 'gsword_axe':case 'caff_axe':{
        // 슬래시 액스의 도끼 모드 - 회전하는 거대 도끼 머리
        G.rotate(ang+spinT*1.5);
        const fancy=this.wt==='caff_axe';
        // 발광 효과 (개방의 검)
        if(fancy){
          G.fillStyle=`rgba(255,80,180,${al*0.4})`;
          G.beginPath();G.arc(0,0,s*1.4,0,Math.PI*2);G.fill();
          G.fillStyle=`rgba(255,255,255,${al*0.3})`;
          G.beginPath();G.arc(0,0,s*0.9,0,Math.PI*2);G.fill();
        }
        // 손잡이 (가로 막대)
        G.fillStyle='#5a3a18';
        G.fillRect(-s*1.8,-s*0.16,s*3.6,s*0.32);
        G.fillStyle='#7a4a28';G.fillRect(-s*1.8,-s*0.16,s*3.6,s*0.08);
        G.fillStyle='#3a2010';G.fillRect(-s*1.8,s*0.08,s*3.6,s*0.08);
        // 손잡이 줄 감기
        G.fillStyle='#222';
        G.fillRect(-s*1.2,-s*0.16,s*0.06,s*0.32);
        G.fillRect(-s*0.6,-s*0.16,s*0.06,s*0.32);
        G.fillRect(s*0.2,-s*0.16,s*0.06,s*0.32);
        // 도끼 머리 (오른쪽 큰 반달 칼날)
        G.fillStyle=fancy?'#660033':'#444444';
        // 도끼 머리 백킹
        G.beginPath();
        G.moveTo(s*1.5,-s*0.7);G.lineTo(s*2.4,-s*0.4);
        G.lineTo(s*2.5,s*0.0);G.lineTo(s*2.4,s*0.4);
        G.lineTo(s*1.5,s*0.7);G.lineTo(s*1.3,s*0.3);
        G.lineTo(s*1.3,-s*0.3);G.closePath();G.fill();
        // 도끼 칼날 (밝은 가장자리)
        G.fillStyle=fancy?'#ff66bb':'#dddddd';
        G.beginPath();
        G.moveTo(s*1.6,-s*0.65);G.lineTo(s*2.3,-s*0.35);
        G.lineTo(s*2.4,s*0.0);G.lineTo(s*2.3,s*0.35);
        G.lineTo(s*1.6,s*0.65);G.lineTo(s*1.5,s*0.3);
        G.lineTo(s*1.5,-s*0.3);G.closePath();G.fill();
        // 칼날 하이라이트
        G.fillStyle='#ffffff';
        G.beginPath();
        G.moveTo(s*1.6,-s*0.55);G.lineTo(s*2.1,-s*0.3);
        G.lineTo(s*2.0,-s*0.1);G.lineTo(s*1.5,-s*0.2);G.closePath();G.fill();
        // 도끼 머리 가운데 보석/장식
        G.fillStyle=fancy?'#ffaa00':'#aa8833';
        G.beginPath();G.arc(s*1.85,0,s*0.18,0,Math.PI*2);G.fill();
        G.fillStyle=fancy?'#ffee44':'#ddbb55';
        G.beginPath();G.arc(s*1.83,-s*0.04,s*0.09,0,Math.PI*2);G.fill();
        // 폼멜 (왼쪽 끝)
        G.fillStyle=fancy?'#cc0066':'#666666';
        G.beginPath();G.arc(-s*1.95,0,s*0.22,0,Math.PI*2);G.fill();
        G.fillStyle=fancy?'#ff44aa':'#999999';
        G.beginPath();G.arc(-s*1.98,-s*0.05,s*0.1,0,Math.PI*2);G.fill();
        // 트레일 잔상
        G.fillStyle=fancy?'rgba(255,100,200,0.3)':'rgba(200,200,200,0.25)';
        G.beginPath();
        G.arc(0,0,s*2.4,-0.4-spinT*0.2,0.4-spinT*0.2);
        G.lineTo(0,0);G.closePath();G.fill();
        break;
      }
      case 'gsword':case 'caff':{
        G.rotate(ang+spinT);
        const fancy=this.wt==='caff';
        // 전기 효과 (caff)
        if(fancy){
          G.fillStyle=`rgba(255,80,180,${al*0.5})`;
          for(let i=0;i<6;i++){
            const a=Math.random()*Math.PI*2,r=s*1.3+Math.random()*s*0.5;
            G.fillRect(Math.cos(a)*r-1.5,Math.sin(a)*r-1.5,3,3);
          }
        }
        // 칼날 (긴 검신)
        G.fillStyle=fancy?'#ff77cc':'#cccccc';
        G.beginPath();
        G.moveTo(s*1.7,0);G.lineTo(s*1.4,-s*0.3);G.lineTo(-s*0.3,-s*0.3);G.lineTo(-s*0.3,s*0.3);G.lineTo(s*1.4,s*0.3);
        G.closePath();G.fill();
        // 칼날 중앙 풀러 (홈)
        G.fillStyle=fancy?'#aa3388':'#888888';
        G.fillRect(-s*0.2,-s*0.05,s*1.5,s*0.1);
        // 칼날 하이라이트 (위쪽)
        G.fillStyle='#ffffff';
        G.fillRect(-s*0.2,-s*0.25,s*1.6,s*0.08);
        // 칼날 그림자 (아래쪽)
        G.fillStyle=fancy?'#882266':'#777777';
        G.fillRect(-s*0.2,s*0.17,s*1.6,s*0.13);
        // 십자 가드 (crossguard)
        G.fillStyle=fancy?'#ffaa00':'#aa8833';
        G.fillRect(-s*0.55,-s*0.65,s*0.3,s*1.3);
        G.fillStyle=fancy?'#cc6600':'#665522';
        G.fillRect(-s*0.55,s*0.4,s*0.3,s*0.25);
        G.fillStyle=fancy?'#ffdd44':'#ccaa66';
        G.fillRect(-s*0.55,-s*0.65,s*0.3,s*0.18);
        // 손잡이
        G.fillStyle=fancy?'#552255':'#3a2010';
        G.fillRect(-s*1.0,-s*0.2,s*0.55,s*0.4);
        // 손잡이 줄 감기
        G.fillStyle=fancy?'#332233':'#1a0d05';
        G.fillRect(-s*1.0,-s*0.2,s*0.55,s*0.07);
        G.fillRect(-s*1.0,-s*0.05,s*0.55,s*0.07);
        G.fillRect(-s*1.0,s*0.1,s*0.55,s*0.07);
        // 폼멜
        G.fillStyle=fancy?'#ffcc00':'#aa8833';
        G.beginPath();G.arc(-s*1.15,0,s*0.22,0,Math.PI*2);G.fill();
        G.fillStyle=fancy?'#ffee66':'#ccaa55';
        G.beginPath();G.arc(-s*1.2,-s*0.08,s*0.1,0,Math.PI*2);G.fill();
        break;
      }
      case 'mungchi':case 'unleash':{
        G.rotate(ang);
        const fancy=this.wt==='unleash';
        const t=Math.floor(spinT*1.5)%2,bob=t?-0.5:0;  // 달리는 애니메이션
        // 그림자
        G.fillStyle='rgba(0,0,0,0.35)';
        G.beginPath();G.ellipse(0,s*0.5,s*0.55,s*0.15,0,0,Math.PI*2);G.fill();
        // 다리 (앞 + 뒤, 번갈아 움직임)
        const lcol=fancy?'#aa6600':'#7a4a18';
        G.fillStyle=lcol;
        G.fillRect(-s*0.4,s*0.15+(t?0.1:0)*s,s*0.18,s*0.3);
        G.fillRect(-s*0.15,s*0.15+(t?0:0.1)*s,s*0.18,s*0.3);
        G.fillRect(s*0.1,s*0.15+(t?0.1:0)*s,s*0.18,s*0.3);
        G.fillRect(s*0.3,s*0.15+(t?0:0.1)*s,s*0.18,s*0.3);
        // 몸통
        G.fillStyle=fancy?'#ffaa44':'#cc8844';
        G.fillRect(-s*0.55,-s*0.2+bob*s*0.1,s*0.95,s*0.4);
        // 몸통 하이라이트 (위)
        G.fillStyle=fancy?'#ffcc77':'#dd9955';
        G.fillRect(-s*0.55,-s*0.2+bob*s*0.1,s*0.95,s*0.1);
        // 몸통 어두운 (배)
        G.fillStyle=fancy?'#cc7722':'#9a5a20';
        G.fillRect(-s*0.55,s*0.1+bob*s*0.1,s*0.95,s*0.1);
        // 머리 (앞쪽)
        G.fillStyle=fancy?'#ffaa44':'#cc8844';
        G.fillRect(s*0.3,-s*0.3+bob*s*0.1,s*0.45,s*0.4);
        // 머리 하이라이트
        G.fillStyle=fancy?'#ffcc77':'#dd9955';
        G.fillRect(s*0.3,-s*0.3+bob*s*0.1,s*0.45,s*0.1);
        // 귀 (위)
        G.fillStyle=fancy?'#cc7722':'#7a4a18';
        G.fillRect(s*0.3,-s*0.45+bob*s*0.1,s*0.13,s*0.2);
        // 주둥이
        G.fillStyle=fancy?'#ffcc77':'#dd9955';
        G.fillRect(s*0.65,-s*0.05+bob*s*0.1,s*0.15,s*0.15);
        // 꼬리 (뒤)
        G.fillStyle=fancy?'#ffaa44':'#cc8844';
        G.fillRect(-s*0.75,-s*0.1+(t?-0.05:0.05)*s,s*0.25,s*0.1);
        // 눈
        G.fillStyle='#000';G.fillRect(s*0.52,-s*0.2+bob*s*0.1,s*0.09,s*0.09);
        G.fillStyle='#fff';G.fillRect(s*0.54,-s*0.19+bob*s*0.1,s*0.03,s*0.03);
        // 코
        G.fillStyle='#000';G.fillRect(s*0.72,-s*0.0+bob*s*0.1,s*0.1,s*0.1);
        // 입
        G.fillStyle='#660000';G.fillRect(s*0.55,s*0.12+bob*s*0.1,s*0.18,s*0.04);
        // 발광 (unleash 진화형)
        if(fancy){
          G.strokeStyle=`rgba(255,200,0,${al*0.6})`;G.lineWidth=2;
          G.beginPath();G.ellipse(0,0,s*0.9,s*0.5,0,0,Math.PI*2);G.stroke();
          G.fillStyle=`rgba(255,200,0,${al*0.25})`;
          G.beginPath();G.ellipse(0,0,s*0.7,s*0.4,0,0,Math.PI*2);G.fill();
        }
        break;
      }
      case 'awakegj':{
        // 보라 마법 지팡이 (회전)
        G.rotate(spinT);
        // 오라
        G.fillStyle=`rgba(255,180,255,${al*0.35})`;
        G.beginPath();G.arc(0,-s*0.7,s*0.85,0,Math.PI*2);G.fill();
        // 지팡이 샤프트
        G.fillStyle='#5a3a18';G.fillRect(-s*0.15,-s*0.6,s*0.3,s*1.6);
        G.fillStyle='#7a4a28';G.fillRect(-s*0.15,-s*0.6,s*0.1,s*1.6);
        G.fillStyle='#3a2010';G.fillRect(s*0.05,-s*0.6,s*0.1,s*1.6);
        // 갈고리 손잡이 (위)
        G.fillStyle='#5a3a18';
        G.fillRect(-s*0.45,-s*0.75,s*0.6,s*0.15);
        G.fillRect(-s*0.45,-s*0.75,s*0.15,s*0.35);
        // 위 오브 (보라 발광)
        G.fillStyle='#ff88ff';
        G.beginPath();G.arc(0,-s*0.85,s*0.42,0,Math.PI*2);G.fill();
        // 오브 하이라이트
        G.fillStyle='#ffccff';
        G.beginPath();G.arc(-s*0.12,-s*0.95,s*0.17,0,Math.PI*2);G.fill();
        // 오브 코어
        G.fillStyle='#ffffff';
        G.beginPath();G.arc(-s*0.14,-s*0.98,s*0.07,0,Math.PI*2);G.fill();
        // 폼멜 (아래 끝)
        G.fillStyle='#aa8833';
        G.beginPath();G.arc(0,s*1.0,s*0.18,0,Math.PI*2);G.fill();
        break;
      }
      default:{
        // RAM 스틱 (램 기본/풀스펙)
        G.rotate(ang);
        const evolved=this.wt==='fullspec';
        // 풀스펙 글로우
        if(evolved){G.save();G.shadowColor='#00eeff';G.shadowBlur=10}
        // PCB
        G.fillStyle=evolved?'#0a4a7a':'#1a6633';G.fillRect(-s*0.9,-s*0.35,s*1.8,s*0.7);
        // PCB 하이라이트
        G.fillStyle=evolved?'#2288cc':'#228844';G.fillRect(-s*0.9,-s*0.35,s*1.8,s*0.1);
        // PCB 그림자
        G.fillStyle=evolved?'#052238':'#0a3318';G.fillRect(-s*0.9,s*0.22,s*1.8,s*0.13);
        // 메모리 칩 (검은 사각형들)
        G.fillStyle='#1a1a1a';
        [-0.7,-0.4,-0.1,0.2,0.5].forEach(ox=>{G.fillRect(s*ox,-s*0.18,s*0.22,s*0.25)});
        // 칩 핀 다리
        G.fillStyle='#666';
        [-0.7,-0.4,-0.1,0.2,0.5].forEach(ox=>{
          G.fillRect(s*ox,-s*0.22,s*0.22,s*0.04);
          G.fillRect(s*ox,s*0.07,s*0.22,s*0.03);
        });
        // 금 접점 핀 (아래)
        G.fillStyle=evolved?'#ffcc00':'#ddaa00';G.fillRect(-s*0.85,s*0.32,s*1.7,s*0.1);
        // 핀 줄무늬
        G.fillStyle=evolved?'#aa8800':'#8a6a00';
        for(let i=0;i<10;i++)G.fillRect(-s*0.8+i*s*0.17,s*0.32,s*0.05,s*0.1);
        // 노치 (가운데 홈)
        G.fillStyle='#000';G.fillRect(-s*0.12,s*0.3,s*0.24,s*0.14);
        // 라벨/스티커
        G.fillStyle='#fff';G.fillRect(-s*0.3,-s*0.05,s*0.6,s*0.13);
        G.fillStyle=evolved?'#0088cc':'#000';G.fillRect(-s*0.25,-s*0.02,s*0.5,s*0.07);
        if(evolved)G.restore();
      }
    }
    G.restore();
  }
}
