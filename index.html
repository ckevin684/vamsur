// ═══ 추가 적 스프라이트 (VS 참고 — 분열형/자폭형) ═══
function sSplitter(x,y,fr,hit,elite){
  const base=elite?'#aaff44':'#88cc44',col=hit?'#fff':base,dk=hit?'#aaa':'#5a8a22',lt=hit?'#fff':'#bbee66';
  const t=fr%2,bob=t?0:-1;
  shadow(x,y+13,12,3,0.4);
  G.fillStyle=col;G.beginPath();G.arc(x,y+bob,11,0,Math.PI*2);G.fill();
  G.fillStyle=lt;G.beginPath();G.arc(x-3,y-3+bob,4,0,Math.PI*2);G.fill();
  if(!hit){G.strokeStyle=dk;G.lineWidth=1.5;G.beginPath();G.moveTo(x,y-9+bob);G.lineTo(x,y+9+bob);G.stroke();}
  if(!hit){G.fillStyle='#222';G.fillRect(x-5,y-2+bob,3,3);G.fillRect(x+2,y-2+bob,3,3);
    G.fillStyle='#fff';G.fillRect(x-5,y-2+bob,1,1);G.fillRect(x+2,y-2+bob,1,1);}
}
function sSplitling(x,y,fr,hit,elite){
  const base=elite?'#cfff88':'#bbe066',col=hit?'#fff':base;
  const t=fr%2,bob=t?0:-1;
  shadow(x,y+7,6,2,0.35);
  G.fillStyle=col;G.beginPath();G.arc(x,y+bob,6,0,Math.PI*2);G.fill();
  if(!hit){G.fillStyle='#222';G.fillRect(x-3,y-1+bob,2,2);G.fillRect(x+1,y-1+bob,2,2);}
}
function sBomber(x,y,fr,hit,elite,danger){
  const base=elite?'#ff9955':'#ff7733',col=hit?'#fff':base,dk=hit?'#aaa':'#aa3300';
  const t=fr%2,bob=t?0:-1;
  shadow(x,y+12,10,3,0.4);
  if(danger){const p=0.5+0.5*Math.sin(gameTime*20);G.globalAlpha=0.3+p*0.4;G.fillStyle='#ff2200';G.beginPath();G.arc(x,y+bob,13+p*3,0,Math.PI*2);G.fill();G.globalAlpha=1;}
  G.fillStyle=col;G.beginPath();G.arc(x,y+bob,9,0,Math.PI*2);G.fill();
  G.fillStyle=dk;G.beginPath();G.arc(x+3,y+2+bob,4,0,Math.PI*2);G.fill();
  G.strokeStyle='#553311';G.lineWidth=1.5;G.beginPath();G.moveTo(x,y-8+bob);G.lineTo(x+3,y-13+bob);G.stroke();
  const fl=0.5+0.5*Math.sin(gameTime*18);
  G.fillStyle=fl>0.5?'#ffdd33':'#ff6600';G.beginPath();G.arc(x+3,y-14+bob,2.5,0,Math.PI*2);G.fill();
  if(!hit){G.fillStyle='#220';G.fillRect(x-4,y-1+bob,2,2);G.fillRect(x+1,y-1+bob,2,2);}
}
class Enemy{
  constructor(x,y,type,elite=false){
    this.x=x;this.y=y;this.type=type;this.dead=false;
    this.flash=0;this.slow=0;this.ct=0;this.elite=elite;
    this.kvx=0;this.kvy=0;
    const w=Math.floor(gameTime/30),em=elite?2.2:1;
    // 적 HP 배수: 11분(660s)에 무릎 → 이후 기울기 0.013→0.005로 꺾어 후반 스펀지 완화 (물량은 spawnEnemies에서 보상)
    // 적 HP 배수: 10분(600s)까지 상승 후 거의 평탄(상한 9.6) — 후반 폭주 억제. 11분 벽의 주 레버는 스폰/관통, HP는 보조.
    const hs=gameTime<=600?1+gameTime*0.013:Math.min(8.8+(gameTime-600)*0.002,9.6);
    if(type==='zombie'){
      this.hp=this.mhp=(16+w*6)*hs*em;this.spd=(38+w*1.5)*(elite?1.2:1);  // 기본 HP 35+w*8→16+w*6: 시작 무기(최약 칼 18)로 한방킬 가능하게
      this.dmg=(10+w)*em;this.col='#44bb44';this.sz=12*(elite?1.3:1);this.xv=3*(elite?3:1);
    }else if(type==='bat'){
      this.hp=this.mhp=(18+w*4)*hs*em;this.spd=Math.min(88+w*1.5,128);  // 속도 캡(후반 과속 방지)
      this.dmg=(6+w*0.5)*em;this.col='#9955aa';this.sz=8*(elite?1.3:1);this.xv=2*(elite?3:1);
      this.zT=0;this.zD=1;
    }else if(type==='rusher'){
      this.hp=this.mhp=(22+w*5)*hs*em;this.spd=Math.min(98+w*1.3,140)*(elite?1.15:1);  // 러셔=빠른 원형이지만 캡
      this.dmg=(8+w*0.8)*em;this.col='#dd4488';this.sz=9*(elite?1.3:1);this.xv=2*(elite?3:1);
    }else if(type==='tank'){
      this.hp=this.mhp=(100+w*6)*hs*em;this.spd=(28+w*1)*(elite?1.1:1);  // 탱크 HP 180+w*30→100+w*6 (체력차 압축: 8배→~2.4배)
      this.dmg=(22+w*2)*em;this.col='#7a4a8a';this.sz=18*(elite?1.3:1);this.xv=12*(elite?3:1);
    }else if(type==='splitter'){
      this.hp=this.mhp=(44+w*4.5)*hs*em;this.spd=(40+w*1.3)*(elite?1.15:1);  // 분열 HP 48+w*10→44+w*4.5 (체력차 압축)
      this.dmg=(12+w)*em;this.col='#88cc44';this.sz=15*(elite?1.3:1);this.xv=5*(elite?3:1);
    }else if(type==='splitling'){
      this.hp=this.mhp=(12+w*3)*hs*em;this.spd=Math.min(104+w*1.2,130)*(elite?1.15:1);  // 새끼 속도 캡
      this.dmg=(6+w*0.4)*em;this.col='#bbe066';this.sz=7*(elite?1.3:1);this.xv=1*(elite?3:1);
    }else if(type==='bomber'){
      this.hp=this.mhp=(26+w*6)*hs*em;this.spd=(70+w*1.1)*(elite?1.15:1);  // 96+w*2→70+w*1.1 (플레이어보다 느리게 = 회피 가능)
      this.dmg=(8+w*0.6)*em;this.col='#ff7733';this.sz=11*(elite?1.3:1);this.xv=3*(elite?3:1);
      this.bombDmg=(16+w*1.0);this.bombR=62;  // 폭발 20+w*1.5→16+w*1.0, 반경 72→62 (떼거리 즉사 완화)
    }else{ // skeleton
      this.hp=this.mhp=(52+w*5)*hs*em;this.spd=(50+w*2)*(elite?1.1:1);  // 해골 HP 60+w*12→52+w*5 (체력차 압축, 정지포탑이라 속도 무관)
      this.dmg=(15+w*1.5)*em;this.col='#cccccc';this.sz=14*(elite?1.3:1);this.xv=6*(elite?3:1);
      this.sT=rnd(BAL.enemy.skel.fireMin,BAL.enemy.skel.fireMax);
      this.planted=false;  // 사정거리 도달 시 true → 그 자리에 고정
    }
    if(elite)SFX.elite();
  }
  update(dt){
    if(this.flash>0)this.flash-=dt;
    if(this.slow>0)this.slow-=dt;
    if(this.ct>0)this.ct-=dt;
    const sm=this.slow>0?0.4:1;
    let dx=player.x-this.x,dy=player.y-this.y;
    const d=Math.hypot(dx,dy)||1;
    if(this.type==='bat'){
      this.zT-=dt;if(this.zT<=0){this.zD*=-1;this.zT=rnd(0.3,0.7)}
      const px=-dy/d,py=dx/d;dx+=px*this.zD*60;dy+=py*this.zD*60;
    }
    // 해골 — 플레이어가 사정거리에 들어오면 그 자리에 고정 (이후 안 움직이고 사격만)
    let mvSpd=this.spd;
    if(this.type==='skeleton'){
      if(this.planted||d<=BAL.enemy.skel.range)this.planted=true;  // 한번 박히면 계속 고정
      if(this.planted)mvSpd=0;
    }
    if(mvSpd>0){const len=Math.hypot(dx,dy)||1;this.x+=dx/len*mvSpd*sm*dt;this.y+=dy/len*mvSpd*sm*dt;}
    // 넉백 적용 (박힌 해골은 넉백 무시 — 그 자리에 고정)
    if(this.planted){this.kvx=0;this.kvy=0;}
    else if(this.kvx||this.kvy){this.x+=this.kvx*dt;this.y+=this.kvy*dt;this.kvx*=0.82;this.kvy*=0.82;if(Math.abs(this.kvx)<2)this.kvx=0;if(Math.abs(this.kvy)<2)this.kvy=0}
    if(this.type==='skeleton'&&this.sT!==undefined){
      this.sT-=dt;
      const SB=BAL.enemy.skel;
      if(this.sT<=0&&d<SB.shootR){
        const a=Math.atan2(player.y-this.y,player.x-this.x);
        const pb={x:this.x,y:this.y,vx:Math.cos(a)*SB.projSpd,vy:Math.sin(a)*SB.projSpd,pdmg:this.dmg*1.2,life:2.5,sz:SB.projSz,dead:false,
          update(dt2){this.x+=this.vx*dt2;this.y+=this.vy*dt2;this.life-=dt2;if(this.life<=0){this.dead=true;return}if(dist(this,player)<this.sz+12){player.takeDmg(this.pdmg);this.dead=true}},
          draw(){
            G.save();G.translate(this.x,this.y);
            const ph=0.6+0.4*Math.sin(this.life*18);
            // 외곽 글로우 (펄스)
            G.globalAlpha=0.45*ph;G.fillStyle='#7aa0ff';
            G.beginPath();G.arc(0,0,this.sz*1.7,0,Math.PI*2);G.fill();
            G.globalAlpha=1;G.rotate(Math.atan2(this.vy,this.vx));
            // 모션 스트릭 (뒤로 늘어진 잔상)
            G.globalAlpha=0.4;G.fillStyle='#aaccff';
            G.fillRect(-this.sz*1.6,-this.sz*0.18,this.sz*1.6,this.sz*0.36);
            // 어두운 외곽 + 흰 코어 (마름모)
            G.globalAlpha=1;G.rotate(Math.PI/4);const s=this.sz;
            G.fillStyle='#1a2240';G.fillRect(-s/2-1.5,-s/2-1.5,s+3,s+3);
            G.fillStyle='#dfe8ff';G.fillRect(-s/2,-s/2,s,s);
            G.fillStyle='#ffffff';G.fillRect(-s/2,-s/2,s*0.5,s*0.5);
            G.restore();
          }
        };
        projs.push(pb);this.sT=rnd(SB.fireMin,SB.fireMax);
      }
    }
    if(d<this.sz+13&&this.ct<=0){player.takeDmg(this.dmg);this.ct=0.8}
  }
  hurt(v,crit,src){
    const dmg=v*(this.elite?0.7:1);
    const eff=Math.min(dmg,Math.max(this.hp,0));  // 오버킬 제외 (휠체어 즉사 e.hp+9999 등)
    this.hp-=dmg;this.flash=0.12;
    totalDmg+=eff;if(eff>dmgPeak)dmgPeak=eff;  // 누적 데미지 집계
    dmgByWpn[src||'etc']=(dmgByWpn[src||'etc']||0)+eff;  // 무기(wt)별 데미지
    spawnParts(this.x,this.y,this.col,this.elite?5:3);SFX.hit();
    const col=crit?'#ffee44':(this.elite?'#aaff66':'#ffeecc');
    showDmg(this.x,this.y-this.sz,dmg,col,this.elite||crit,crit);
    spark(this.x,this.y,crit?'#ffdd44':this.col,crit?6:(this.elite?5:3));
    // 넉백 (플레이어 반대방향, 탱커는 약하게) · 받아치기 패시브 배율
    const kbStr=(this.type==='tank'?40:(crit?160:90))*((player&&player.knockback)||1);
    const ang=Math.atan2(this.y-player.y,this.x-player.x);
    this.kvx+=Math.cos(ang)*kbStr;this.kvy+=Math.sin(ang)*kbStr;
    if(this.hp<=0)this.die();
  }
  die(){
    this.dead=true;killCount++;bumpCombo();
    // 지워니 현금 적립 (탱크3·엘리트6·일반1·새끼0)
    if(player.cd.id==='zw'){const Z=BAL.char.zw;player.addCash(this.elite?Z.cashPerKill*6:(this.type==='tank'?Z.cashPerKill*3:(this.type==='splitling'?0:Z.cashPerKill)));}
    // 🍳 종원 재료 드랍 (쿨다운 pity: 드랍 후 dropCd초 안 떨어짐 → 킬속도 무관 판당 ~25개)
    if(player.cd.id==='jw'&&this.type!=='splitling'){
      const J=BAL.char.jw;
      if(player.dropCdT<=0&&Math.random()<J.dropChance){
        ingreds.push(new Ingred(this.x,this.y,ING_KEYS[Math.floor(Math.random()*ING_KEYS.length)]));
        player.dropCdT=J.dropCd;
      }
      if(Math.random()<J.caviarChance)ingreds.push(new Ingred(this.x,this.y,'caviar'));  // 캐비아 독립 극악롤
    }
    // 골드 코인 드랍 (기존 골드량 그대로 — 자석으로 흡수해야 적립). 지워니 패시브 골드 ×1.5. 새끼는 안 떨굼
    let gv=this.elite?0.45:(this.type==='tank'?0.25:(this.type==='splitling'?0:0.08));
    if(player.cd.id==='zw')gv*=BAL.char.zw.goldMul;
    if(gv>0)coins.push(new Coin(this.x,this.y,gv));
    gems.push(new Gem(this.x,this.y,this.xv));
    spawnParts(this.x,this.y,this.col,this.elite?14:7);
    // 분열형: 죽으면 작은 새끼 2마리로 쪼개짐 (새끼는 안 쪼개짐)
    if(this.type==='splitter'){
      for(let i=0;i<2;i++){const a=Math.random()*Math.PI*2;const e=new Enemy(this.x+Math.cos(a)*10,this.y+Math.sin(a)*10,'splitling',false);e.kvx=Math.cos(a)*130;e.kvy=Math.sin(a)*130;enemies.push(e);}
    }
    // 자폭형: 죽으면 광역 폭발 — 반경 안 플레이어 피해 + 블라스트 링 (근접 처치 위험)
    if(this.type==='bomber'){
      if(dist(this,player)<this.bombR)player.takeDmg(this.bombDmg);
      projs.push({x:this.x,y:this.y,life:0.4,ml:0.4,r:this.bombR,dead:false,isAoe:true,
        update(dt){this.life-=dt;if(this.life<=0)this.dead=true},
        draw(){const t=1-this.life/this.ml;G.save();G.globalAlpha=(1-t)*0.85;G.strokeStyle='#ff6622';G.lineWidth=4*(1-t);G.beginPath();G.arc(this.x,this.y,this.r*t,0,Math.PI*2);G.stroke();G.globalAlpha=(1-t)*0.28;G.fillStyle='#ff8844';G.beginPath();G.arc(this.x,this.y,this.r*t,0,Math.PI*2);G.fill();G.restore()}});
      spawnParts(this.x,this.y,'#ff8844',18);spawnParts(this.x,this.y,'#ffcc44',10);shake(0.22,5);
    }
    // 잔해/핏자국 데칼 제거 — 가시성 확보 (파티클만 잠깐 보이고 사라짐)
    if(this.elite){shake(0.15,3);if(Math.random()<0.15)spawnPickup(this.x,this.y);}
  }
  draw(){
    const h=this.flash>0;
    G.save();G.translate(this.x,this.y);G.scale(0.72,0.72);G.translate(-this.x,-this.y);
    if(this.type==='zombie')sZombie(this.x,this.y,afr,h,this.elite);
    else if(this.type==='bat')sBat(this.x,this.y,afr,h,this.elite);
    else if(this.type==='rusher')sRusher(this.x,this.y,afr,h,this.elite);
    else if(this.type==='tank')sTank(this.x,this.y,afr,h,this.elite);
    else if(this.type==='splitter')sSplitter(this.x,this.y,afr,h,this.elite);
    else if(this.type==='splitling')sSplitling(this.x,this.y,afr,h,this.elite);
    else if(this.type==='bomber')sBomber(this.x,this.y,afr,h,this.elite,dist(this,player)<120);
    else sSkel(this.x,this.y,afr,h,this.elite);
    G.restore();
    if(this.hp<this.mhp){
      const s=this.sz;
      G.fillStyle='#500';G.fillRect(this.x-s/2,this.y-s/2-12,s,3);
      G.fillStyle=this.elite?'#aaff44':'#00ff44';G.fillRect(this.x-s/2,this.y-s/2-12,s*(this.hp/this.mhp),3);
    }
  }
}

// ═══ BOSS ═══
const BDEFS=[
  {t:180,bt:'sabi',name:'🐕 싸비',bHp:1800,bS:95,bD:30,col:'#888888',sz:36,bXp:60},
  {t:360,bt:'truck',name:'🖥️ 납품트럭',bHp:2500,bS:55,bD:30,col:'#4488cc',sz:44,bXp:120},
  {t:600,bt:'uncomfy',name:'😤 불편러',bHp:5000,bS:70,bD:35,col:'#ff8888',sz:36,bXp:200},
  {t:900,bt:'lol',name:'😡 협곡의 망령',bHp:8000,bS:95,bD:48,col:'#ff3333',sz:36,bXp:300},
];
class Boss{
  constructor(def){
    this.name=def.name;this.bt=def.bt;this.col=def.col;this.sz=def.sz;
    this.hp=def.bHp;this.mhp=def.bHp;this.spd=def.bS;this.cdmg=def.bD;this.bxp=def.bXp;
    const a=Math.random()*Math.PI*2;this.x=player.x+Math.cos(a)*520;this.y=player.y+Math.sin(a)*520;
    this.phase=1;this.dead=false;this.flash=0;this.at=0;
    this.bp=[];this.slow=0;this.pf=0;this.ann=3;this.ct=0;this.pat=0;
    this.tele=[];  // 텔레그래프 경고
    // 시그니처 메카닉 상태 (보스별 고유 특수기)
    this.sigEvery=this.bt==='sabi'?3.2:(this.bt==='truck'?4.5:(this.bt==='uncomfy'?6:5));
    this.sigT=this.sigEvery*0.6;  // 첫 발동 살짝 빠르게
    this.chargeWind=0;this.chargeT=0;this.chargeDur=0;this.chargeSpd=0;this.chargeDir={x:1,y:0};this.fogT=0;
    SFX.boss();
  }
  addTele(x,y,r,life){this.tele.push({x,y,r,life,ml:life,dead:false})}
  bp_add(a,spd,dmg,col,sz){this.bp.push({x:this.x,y:this.y,vx:Math.cos(a)*spd,vy:Math.sin(a)*spd,pdmg:dmg,life:3.5,sz:sz||10,col:col||this.col,dead:false})}
  update(dt){
    if(this.flash>0)this.flash-=dt;if(this.ann>0)this.ann-=dt;if(this.pf>0)this.pf-=dt;if(this.ct>0)this.ct-=dt;if(this.slow>0)this.slow-=dt;
    if(this.hp<this.mhp*0.5&&this.phase===1){this.phase=2;this.spd*=1.6;this.cdmg*=1.4;this.pf=2;hitStop=Math.max(hitStop,0.12);shake(0.3,7)}
    const sm=this.slow>0?0.4:1,dx=player.x-this.x,dy=player.y-this.y,d=Math.hypot(dx,dy)||1;
    // 시그니처 메카닉 트리거
    if(this.sigT>0)this.sigT-=dt; else { this.signature(); this.sigT=this.sigEvery; }
    if(this.fogT>0)this.fogT-=dt;
    // 이동 — 돌진 윈드업 중 정지 → 락온 대시 → 평소 추적
    if(this.chargeWind>0){
      this.chargeWind-=dt;
      if(this.chargeWind<=0){ this.chargeT=this.chargeDur; SFX.bHit(); shake(0.2,5); }
    }else if(this.chargeT>0){
      this.chargeT-=dt;
      this.x+=this.chargeDir.x*this.chargeSpd*sm*dt;this.y+=this.chargeDir.y*this.chargeSpd*sm*dt;
      if(d<this.sz+16&&this.ct<=0){player.takeDmg(this.cdmg*1.6);this.ct=0.5}  // 돌진 강타
    }else{
      this.x+=dx/d*this.spd*sm*dt;this.y+=dy/d*this.spd*sm*dt;
      if(d<this.sz+13&&this.ct<=0){player.takeDmg(this.cdmg);this.ct=0.6}
    }
    this.at-=dt;
    if(this.at<=0){this.attack();this.at=this.phase===2?(this.bt==='sabi'?0.8:1.0):(this.bt==='sabi'?1.6:2.2);this.pat=(this.pat+1)%3}
    this.bp=this.bp.filter(p=>!p.dead);
    this.bp.forEach(p=>{p.x+=p.vx*dt;p.y+=p.vy*dt;p.life-=dt;if(p.life<=0){p.dead=true;return}if(dist(p,player)<p.sz+12){player.takeDmg(p.pdmg);p.dead=true}});
    // 텔레그래프 시간 감소
    this.tele.forEach(t=>{t.life-=dt;if(t.life<=0)t.dead=true});
    this.tele=this.tele.filter(t=>!t.dead);
  }
  attack(){
    const cnt=this.phase===2?8:4,a=Math.atan2(player.y-this.y,player.x-this.x);
    if(this.bt==='sabi'){
      // pat0: 360° 링 (페이즈2 시 8발), pat1: 5방향 부채꼴 강력 탄, pat2: 텔레그래프 후 플레이어 위치 폭발
      const ring=this.phase===2?8:6;
      const spread=this.phase===2?7:5;
      if(this.pat===0){
        for(let i=0;i<ring;i++)this.bp_add(Math.PI*2/ring*i+gameTime,170,this.cdmg*0.55,'#888888',12);
      }else if(this.pat===1){
        for(let i=0;i<spread;i++){
          const da=-0.5+1.0*(i/(spread-1));
          this.bp_add(a+da,220,this.cdmg*0.75,'#cccccc',10);
        }
      }else{
        // 물어뜯기: 플레이어 위치 텔레그래프 후 8방향 폭발 탄
        const tx=player.x,ty=player.y;
        this.addTele(tx,ty,50,0.6);
        const self=this;
        setTimeout(()=>{
          if(!self.dead&&boss){
            for(let i=0;i<8;i++){
              const ba=Math.PI*2/8*i;
              self.bp.push({
                x:tx,y:ty,
                vx:Math.cos(ba)*200,vy:Math.sin(ba)*200,
                pdmg:self.cdmg*0.85,life:1.0,sz:12,
                col:'#aaaaaa',dead:false
              });
            }
            SFX.bHit();
          }
        },600);
      }
    }else if(this.bt==='truck'){
      if(this.pat===0)for(let i=0;i<cnt;i++)this.bp_add(Math.PI*2/cnt*i,130,this.cdmg*0.5,'#4488cc',16);
      else if(this.pat===1)for(let i=-2;i<=2;i++)this.bp_add(a+i*0.25,200,this.cdmg*0.5,'#88ccff',12);
      else{
        // 텔레그래프 후 슬램
        const positions=[];
        for(let i=0;i<4;i++){const ra=Math.random()*Math.PI*2;positions.push({x:player.x+Math.cos(ra)*90,y:player.y+Math.sin(ra)*90})}
        positions.forEach(pos=>this.addTele(pos.x,pos.y,30,0.5));
        const self=this;
        setTimeout(()=>{if(!self.dead)positions.forEach(pos=>self.bp.push({x:pos.x,y:pos.y,vx:0,vy:0,pdmg:self.cdmg*0.9,life:0.8,sz:20,col:'#4488cc',dead:false}))},500);
      }
    }else if(this.bt==='uncomfy'){
      if(this.pat===0)for(let i=0;i<cnt;i++)this.bp_add(Math.PI*2/cnt*i+gameTime*0.5,120,this.cdmg*0.4,'#ff8888',14);
      else if(this.pat===1)for(let i=0;i<5;i++)setTimeout(()=>{if(boss)this.bp_add(a+rnd(-0.3,0.3),185,this.cdmg*0.7,'#ff5555',12)},i*120);
      else for(let i=0;i<12;i++)this.bp_add(Math.PI*2/12*i+gameTime,100,this.cdmg*0.35,'#ff8888',10);
    }else{
      if(this.pat===0)for(let i=0;i<cnt;i++)this.bp_add(Math.PI*2/cnt*i+gameTime,170,this.cdmg*0.5,'#ff3333',12);
      else if(this.pat===1)for(let i=0;i<(this.phase===2?6:3);i++)this.bp_add(a+rnd(-0.5,0.5),200+rnd(-30,30),this.cdmg*0.6,'#ff5500',14);
      else{
        // 텔레그래프 후 체인 발사
        const self=this;
        [0,0.3,-0.3].forEach(da=>{
          const tx=self.x+Math.cos(a+da)*200,ty=self.y+Math.sin(a+da)*200;
          self.addTele(tx,ty,40,0.4);
        });
        [0,220,440].forEach(delay=>setTimeout(()=>{if(boss&&!self.dead)[0,0.3,-0.3].forEach(da=>self.bp_add(a+da,220,self.cdmg*0.8,'#ff3333',16))},delay+400));
      }
    }
  }
  // 보스별 시그니처 특수기
  signature(){
    const a=Math.atan2(player.y-this.y,player.x-this.x);
    if(this.bt==='truck'||this.bt==='sabi'){
      // 돌진: 플레이어 방향 락온 + 윈드업 텔레그래프 → 고속 대시
      this.chargeDir={x:Math.cos(a),y:Math.sin(a)};
      this.chargeWind=this.bt==='sabi'?0.45:0.7;
      this.chargeDur=this.bt==='sabi'?0.9:0.6;   // 싸비: 짧은 돌진(0.35) → 끝까지 풀차지(0.9)로 예측 가능하게
      this.chargeSpd=this.bt==='sabi'?560:580;   // 거리 ≈ 504 (텔레그래프 레인 길이와 일치)
      notify(this.bt==='sabi'?'🐕 싸비 돌진!':'🚚 트럭 돌진!','경로 피하기','#ffaa44');
    }else if(this.bt==='uncomfy'){
      // 시야 차단: "불편한 안개"로 화면 어두워짐
      this.fogT=4; notify('😤 불편한 안개','시야 차단됨','#ff8888');
    }else{

// ═══ GEM & PARTICLES ═══
class Gem{
  constructor(x,y,v){this.x=x;this.y=y;this.v=v;this.dead=false;this.t=Math.random()*Math.PI*2;
    // 색상 등급
    if(v<=3){this.col='#00ccff';this.col2='rgba(0,180,255,0.25)';this.sz=4}
    else if(v<=7){this.col='#ffdd44';this.col2='rgba(255,200,0,0.3)';this.sz=5}
    else if(v<=15){this.col='#ff66ff';this.col2='rgba(220,80,220,0.35)';this.sz=6}
    else{this.col='#ff4444';this.col2='rgba(255,40,40,0.4)';this.sz=7}
  }
  update(dt){
    this.t+=dt*4;const d=dist(this,player);
    const magR=player.magrBoost>0?99999:player.magr;
    if(d<magR){const a=Math.atan2(player.y-this.y,player.x-this.x),s=Math.max(player.magrBoost>0?500:200,(magR-d)*5);let step=s*dt;if(step>d)step=d;/*오버슈트 방지: 플레이어 지나치지 않게*/this.x+=Math.cos(a)*step;this.y+=Math.sin(a)*step}
    if(dist(this,player)<14){player.gainXp(this.v);this.dead=true;SFX.gem()}
  }
  draw(){
    const s=this.sz+Math.sin(this.t)*1.2;
    G.save();
    // 외광
    G.fillStyle=this.col2;G.fillRect(this.x-s,this.y-s,s*2,s*2);
    // 본체 (다이아몬드)
    G.fillStyle=this.col;G.beginPath();
    G.moveTo(this.x,this.y-s);G.lineTo(this.x+s*0.7,this.y);G.lineTo(this.x,this.y+s);G.lineTo(this.x-s*0.7,this.y);
    G.closePath();G.fill();
    // 하이라이트
    G.fillStyle='rgba(255,255,255,0.7)';G.beginPath();
    G.moveTo(this.x,this.y-s*0.5);G.lineTo(this.x+s*0.25,this.y-s*0.1);G.lineTo(this.x-s*0.15,this.y-s*0.1);
    G.closePath();G.fill();
    G.restore();
  }
}
function spawnParts(x,y,col,n){for(let i=0;i<n;i++){const a=Math.random()*Math.PI*2,s=rnd(30,130);parts.push({x,y,vx:Math.cos(a)*s,vy:Math.sin(a)*s,life:rnd(0.3,0.7),ml:0.7,col,dead:false})}}

class Coin{

// ═══ 🍳 종원 재료 픽업 (Coin 패턴 — 튕김+자석) ═══
class Ingred{
  constructor(x,y,k){this.x=x;this.y=y;this.k=k;this.dead=false;this.t=Math.random()*6.28;
    const a=Math.random()*6.28,s=rnd(25,75);this.vx=Math.cos(a)*s;this.vy=Math.sin(a)*s;
  }
  update(dt){
    this.t+=dt*4;
    this.x+=this.vx*dt;this.y+=this.vy*dt;this.vx*=0.88;this.vy*=0.88;
    const d=dist(this,player),magR=player.magrBoost>0?99999:player.magr*1.15;
    if(d<magR){const a=Math.atan2(player.y-this.y,player.x-this.x),s=Math.max(player.magrBoost>0?520:220,(magR-d)*5);let step=s*dt;if(step>d)step=d;this.x+=Math.cos(a)*step;this.y+=Math.sin(a)*step}
    if(dist(this,player)<16){
      const cap=BAL.char.jw.pantryCap;
      if((player.pantry[this.k]||0)<cap){player.pantry[this.k]++;SFX.gem();}
      this.dead=true;
    }
  }
  draw(){
    const ing=INGS[this.k],cav=this.k==='caviar';
    const bob=Math.sin(this.t)*2.5, pulse=0.5+0.5*Math.sin(this.t*2.2);
    const y=this.y+bob, sz=cav?16:14;  // 박스 반크기 (적 ~25px 대비 큼 = 잘 보임)
    G.save();

    const beamH=cav?54:42, bg=G.createLinearGradient(this.x,y-beamH,this.x,y);
    bg.addColorStop(0,'rgba(0,0,0,0)');bg.addColorStop(1,cav?`rgba(255,210,90,${0.35+pulse*0.25})`:`rgba(${hex2rgb(ing.col)},${0.22+pulse*0.18})`);
    G.fillStyle=bg;G.beginPath();G.moveTo(this.x-6,y);G.lineTo(this.x-2,y-beamH);G.lineTo(this.x+2,y-beamH);G.lineTo(this.x+6,y);G.closePath();G.fill();
    // 바닥 그림자
    G.globalAlpha=0.4;G.fillStyle='#000';G.beginPath();G.ellipse(this.x,this.y+12,10,3.5,0,0,6.28);G.fill();G.globalAlpha=1;
    // 외곽 펄스 글로우

    // 박스 (둥근 사각 — VS 아이템 박스)
    const r=5,bx=this.x-sz,by=y-sz,bs=sz*2;
    G.beginPath();G.moveTo(bx+r,by);G.arcTo(bx+bs,by,bx+bs,by+bs,r);G.arcTo(bx+bs,by+bs,bx,by+bs,r);G.arcTo(bx,by+bs,bx,by,r);G.arcTo(bx,by,bx+bs,by,r);G.closePath();
    G.fillStyle='rgba(18,14,8,0.94)';G.fill();
    // 밝은 테두리 (재료 색, 굵게) + 안쪽 화이트 하이라이트
    G.lineWidth=cav?3.5:3;G.strokeStyle=ing.col;G.stroke();
    G.lineWidth=1;G.strokeStyle='rgba(255,255,255,0.55)';G.stroke();
    // 이모지 (크게)
    G.font=`${cav?24:21}px serif`;G.textAlign='center';G.textBaseline='middle';
    G.fillText(ing.emoji,this.x,y+1);
    // 캐비아: 반짝임 + 회전 별
    if(cav){G.globalAlpha=0.5+0.5*Math.sin(this.t*5);G.font='11px serif';G.fillText('✨',this.x+sz-1,y-sz+3);G.globalAlpha=1;}
    G.textBaseline='alphabetic';G.restore();
  }
}

// ═══ COMPANION (뭉치 - 흰 코카 스파니엘) ═══
class Companion{
  constructor(p,evolved){
    this.x=p.x+rnd(-30,30);this.y=p.y+rnd(-30,30);
    this.target=null;this.biteT=0;this.fr=0;this.evolved=!!evolved;
    this.facing={x:1,y:0};
    this.lookT=0;
    this.barkT=rnd(4,6);    // 짖기 쿨다운 (Lv3+에서 활성화, 진화 시 Lv2+)
    this.scratchCount=0;     // 할퀴기 연속 카운터
    this.scratchT=0;
    this.barkAnimT=0;        // 짖기 시각 효과 타이머
    this.scratchAnimT=0;     // 할퀴기 시각 효과 타이머
    this.returnT=rnd(8,10);  // 플레이어 복귀 타이머 (8~10초마다 강제 복귀, 사냥 끊김 적게)
    this.returning=false;    // 현재 복귀 중인지
  }
  getWpnLv(){
    const w=player.wpns.find(w=>w.type==='mungchi'||w.type==='unleash');
    return w?(w.lv||1):1;
  }
  baseDmg(){
    const lv=this.getWpnLv();
    const dM=wlvAt(WLV.dmgM,lv);
    return BAL.wpn.mungchi.dmgBase*player.dm*dM*(1+Math.max(0,player.lv-1)*0.04)*(this.evolved?BAL.wpn.mungchi.evoMul:1);  // 진화배율 BAL.wpn.mungchi.evoMul 참조
  }
  doBark(){
    const lv=this.getWpnLv();
    const r=(90+lv*8+(this.evolved?30:0))*(player.am||1);  // 범위 패시브(뭉치간식 등) 반영
    const dmg=this.baseDmg()*(this.evolved?2.4:1.4);  // 진화는 짖기만 하므로 데미지↑(물기 상실 보상)
    let hits=0;
    (boss?[...enemies,boss]:enemies).forEach(e=>{
      if(dist(this,e)<r+e.sz){
        let dd=dmg;if(e===boss)dd*=player.bdm;
        const cr=Math.random()<player.crit;if(cr)dd*=2;
        e.hurt(dd,cr,'dog');
        // 약한 넉백
        const a=Math.atan2(e.y-this.y,e.x-this.x);
        e.kvx+=Math.cos(a)*70;e.kvy+=Math.sin(a)*70;
        hits++;
      }
    });
    this.barkAnimT=0.7;  // 더 오래 보이게
    this.barkR=r;
    this.barkX=this.x;this.barkY=this.y;  // 짖은 위치 고정(손전등처럼) — 피격 영역 명확
    playBark();  // 실제 뭉치 짖음 (영상에서 추출)
  }
  doScratch(){
    const lv=this.getWpnLv();
    if(lv<2||!this.target||this.target.dead)return false;
    const scratchChance=this.evolved?0.85:(0.25+lv*0.08);
    if(Math.random()>scratchChance)return false;
    this.scratchCount=this.evolved?4:3;
    this.scratchT=0.12;
    this.scratchAnimT=0.45;  // 더 오래 보이게
    SFX.slash();
    return true;
  }
  update(dt){
    this.fr+=dt*7;
    if(this.biteT>0)this.biteT-=dt;
    if(this.barkAnimT>0)this.barkAnimT-=dt;
    if(this.scratchAnimT>0)this.scratchAnimT-=dt;
    this.lookT-=dt;
    this.returnT-=dt;
    const lv=this.getWpnLv();
    // 진화(언리쉬드): 플레이어 옆에 딱 붙어 계속 짖기만 — 안 물고 짖음(강아지 고증)
    if(this.evolved){
      const tx=player.x-16, ty=player.y+8;
      const dx=tx-this.x,dy=ty-this.y,d=Math.hypot(dx,dy);
      if(d>1){const s=Math.min(d,400*dt);this.x+=dx/d*s;this.y+=dy/d*s;}
      this.facing={x:1,y:0};
      this.barkT-=dt;
      if(this.barkT<=0){this.doBark();this.barkT=0.85;}  // 계속 짖기
      return;
    }
    // 짖기 (Lv 3+) - 복귀 중에도 발동, 진화 시 Lv 2+로 더 일찍
    const barkMinLv=this.evolved?2:3;
    if(lv>=barkMinLv){
      this.barkT-=dt;
      if(this.barkT<=0){
        this.doBark();
        this.barkT=Math.max(1.5,5.5-lv*0.5)-(this.evolved?1:0);
      }
    }
    // 5~6초마다 플레이어 복귀 강제
    if(this.returnT<=0&&!this.returning){
      this.returning=true;
      this.target=null;
    }
    if(this.returning){
      const pd=dist(this,player);
      if(pd<60){
        // 복귀 완료, 다시 사냥
        this.returning=false;
        this.returnT=rnd(8,10);
      }else{
        // 플레이어한테 직진 (적 무시)
        const dx=player.x-this.x,dy=player.y-this.y,d=Math.hypot(dx,dy)||1;
        this.facing={x:dx/d,y:dy/d};
        const spd=this.evolved?320:280;  // 복귀 속도는 빠르게
        this.x+=dx/d*spd*dt;this.y+=dy/d*spd*dt;
        return;  // 사냥 로직 스킵
      }
    }
    // 타겟 탐색
    if(!this.target||this.target.dead||this.lookT<=0){
      this.lookT=0.4;
      let best=null,bestD=380;
      const all=boss?[...enemies,boss]:enemies;
      all.forEach(e=>{const d=dist(this,e);if(d<bestD){bestD=d;best=e}});
      this.target=best;
    }
    let mvSpd=170;
    if(this.target&&!this.target.dead){
      const dx=this.target.x-this.x,dy=this.target.y-this.y;
      const d=Math.hypot(dx,dy)||1;
      this.facing={x:dx/d,y:dy/d};
      if(d<this.target.sz+13){
        if(this.biteT<=0){
          let dmg=this.baseDmg();
          if(this.target===boss)dmg*=player.bdm;
          const cr=Math.random()<player.crit;if(cr)dmg*=2;
          this.target.hurt(dmg,cr,'dog');
          this.doScratch();
          this.biteT=Math.max(0.3,0.55-lv*0.025);
          this.x-=dx/d*5;this.y-=dy/d*5;
        }else if(this.scratchCount>0){
          this.scratchT-=dt;
          if(this.scratchT<=0&&!this.target.dead){
            let dmg=this.baseDmg()*0.5;
            if(this.target===boss)dmg*=player.bdm;
            const cr=Math.random()<player.crit;if(cr)dmg*=2;
            this.target.hurt(dmg,cr,'dog');
            this.scratchCount--;
            this.scratchT=0.12;
            this.scratchAnimT=0.35;  // 추가타 잔상
          }
        }
      }else{
        mvSpd=this.evolved?260:220;
        this.x+=dx/d*mvSpd*dt;this.y+=dy/d*mvSpd*dt;
      }
    }else{
      const pd=dist(this,player);
      if(pd>80){
        const dx=player.x-this.x,dy=player.y-this.y,d=Math.hypot(dx,dy);
        this.facing={x:dx/d,y:dy/d};
        this.x+=dx/d*180*dt;this.y+=dy/d*180*dt;
      }else if(pd<40){
        const a=Math.atan2(this.y-player.y,this.x-player.x);
        this.x+=Math.cos(a)*60*dt;this.y+=Math.sin(a)*60*dt;
      }
    }
    if(dist(this,player)>500){this.x=player.x+rnd(-60,60);this.y=player.y+rnd(-60,60);this.target=null}
  }
  draw(){
    // 짖기 시각 효과 (확장하는 노란 링 + "멍!" 큰 글씨)
    if(this.barkAnimT>0){
      const t=1-this.barkAnimT/0.7;  // 0.7s 지속
      const R=this.barkR||80;
      const bx=this.barkX!==undefined?this.barkX:this.x, by=this.barkY!==undefined?this.barkY:this.y;  // 짖은 위치 고정
      G.save();
      // 고정 피격 영역 채움 (어디까지 맞았는지 명확)
      G.globalAlpha=(1-t)*0.18;G.fillStyle='#ffee88';
      G.beginPath();G.arc(bx,by,R,0,Math.PI*2);G.fill();
      // 고정 외곽 링 = 정확한 피격 경계 (사거리)
      G.shadowColor='#ffdd44';G.shadowBlur=12;
      G.globalAlpha=(1-t)*0.85;G.strokeStyle='#ffdd44';G.lineWidth=3;
      G.beginPath();G.arc(bx,by,R,0,Math.PI*2);G.stroke();
      // 확장 충격파 링 (연출)
      G.shadowBlur=14;G.globalAlpha=(1-t)*0.7;G.strokeStyle='#ffffff';G.lineWidth=4;
      G.beginPath();G.arc(bx,by,R*t,0,Math.PI*2);G.stroke();
      // "멍!" 큰 글씨 (바크 위치 고정)
      if(t<0.6){
        const fade=1-t/0.6;
        G.shadowBlur=0;G.globalAlpha=fade;
        const sz=20+t*14, ty=by-R*0.45-t*16;
        G.font=`bold ${sz}px Courier New`;G.textAlign='center';
        G.strokeStyle='#000';G.lineWidth=3;G.strokeText('멍!',bx,ty);
        G.fillStyle='#ffdd44';G.fillText('멍!',bx,ty);
      }
      G.restore();
    }
    drawCocker(this.x,this.y,this.fr,this.evolved,this.facing.x<0);
    // 할퀴기 시각 효과 (5개 굵은 발톱 자국)
    if(this.scratchAnimT>0&&this.target&&!this.target.dead){
      const ml=0.45,t=1-this.scratchAnimT/ml;
      G.save();
      const tx=this.target.x,ty=this.target.y,off=this.target.sz+3;
      const baseAng=Math.atan2(ty-this.y,tx-this.x);
      const slashCol=this.evolved?'#ffdd44':'#ff5566';
      // 외곽 글로우
      G.shadowColor=slashCol;G.shadowBlur=12;
      G.globalAlpha=(1-t)*0.9;
      G.strokeStyle=slashCol;G.lineWidth=5;
      [-0.55,-0.25,0,0.25,0.55].forEach(da=>{
        const a=baseAng+da;
        const startR=off-6+t*4;
        const endR=off+16-t*2;
        G.beginPath();
        G.moveTo(tx-Math.cos(a)*startR,ty-Math.sin(a)*startR);
        G.lineTo(tx+Math.cos(a)*endR,ty+Math.sin(a)*endR);
        G.stroke();
      });
      // 흰 코어 (날카로움)
      G.shadowBlur=0;
      G.globalAlpha=(1-t)*1.0;
      G.strokeStyle='#ffffff';G.lineWidth=1.8;
      [-0.55,-0.25,0,0.25,0.55].forEach(da=>{
        const a=baseAng+da;
        G.beginPath();
        G.moveTo(tx-Math.cos(a)*(off-4),ty-Math.sin(a)*(off-4));
        G.lineTo(tx+Math.cos(a)*(off+14),ty+Math.sin(a)*(off+14));
        G.stroke();
      });
      // "할퀴!" 텍스트
      if(t<0.5){
        const fade=1-t/0.5;
        G.globalAlpha=fade*0.95;
        G.font='bold 12px Courier New';G.textAlign='center';
        G.strokeStyle='#000';G.lineWidth=2.5;
        G.strokeText('할퀴!',tx,ty-this.target.sz-8-t*8);
        G.fillStyle=slashCol;G.fillText('할퀴!',tx,ty-this.target.sz-8-t*8);
      }
      G.restore();
    }
    // 복귀 중일 때 머리 위 작은 인디케이터
    if(this.returning){
      G.save();
      G.globalAlpha=Math.sin(gameTime*8)*0.4+0.6;
      G.font='10px Courier New';G.textAlign='center';
      G.fillStyle='#000';G.fillText('🏃',this.x,this.y-22);
      G.restore();
    }
  }
}

  const c1=2.2,c3=c1+1, eob=x=>x>=1?1:1+c3*Math.pow(x-1,3)+c1*Math.pow(x-1,2);  // ease-out-back(오버슈트)
  const reveal=eob(p2);

  }else animEnd=r.buyPrice+delta*reveal;
  const vals=hist.slice(0,n-1).concat([r.buyPrice,animEnd,r.endPrice,r.buyPrice+delta*1.1]);
  let mn=Math.min(...vals),mx=Math.max(...vals); if(mx-mn<1){mn-=1;mx+=1;}
  const yOf=v=>gy+gh-(v-mn)/(mx-mn)*gh;
  G.strokeStyle='rgba(255,255,255,0.35)';G.setLineDash([5,4]);G.lineWidth=1;

  G.fillStyle='#999';G.font='10px Courier New';G.textAlign='left';G.fillText('매수가 '+Math.round(r.buyPrice)+'원',gx+4,yOf(r.buyPrice)-5);
  G.strokeStyle=r.col;G.lineWidth=3;G.beginPath();
  for(let i=0;i<n;i++){const v=(i===n-1)?animEnd:hist[i];const px=gx+gw*(i/(n-1)),py=yOf(v);i?G.lineTo(px,py):G.moveTo(px,py);}
  G.stroke();
  const epx=gx+gw,epy=yOf(animEnd);
  G.globalAlpha=0.4;G.fillStyle=up?'#22ee88':'#ff4455';G.beginPath();G.arc(epx,epy,11,0,Math.PI*2);G.fill();G.globalAlpha=1;
  G.fillStyle=up?'#33ff99':'#ff5566';G.beginPath();G.arc(epx,epy,6,0,Math.PI*2);G.fill();

// 신경주사 화살표 (휠체어 모드, 신경주사가 화면 밖에 있으면 화면 가장자리에 방향 표시)
function drawNerveInjectionArrow(){
  if(!player||player.cd.id!=='gj'||player.gjPhase!=='wheelchair')return;
  const inj=player.gjInjectionRef;
  if(!inj||inj.dead)return;
  // 플레이어 기준 상대 위치
  const dx=inj.x-player.x, dy=inj.y-player.y;
  const d=Math.hypot(dx,dy);
  const visW=LW/2-30, visH=LH/2-30;
  // 화면 안에 있으면 화살표 표시 안 함 (그냥 픽업 보임)
  if(Math.abs(dx)<visW&&Math.abs(dy)<visH)return;
  // 화면 가장자리 위치 계산
  const a=Math.atan2(dy,dx);
  const cosA=Math.cos(a),sinA=Math.sin(a);
  // 직사각형 가장자리 클리핑
  const tX=visW/Math.abs(cosA),tY=visH/Math.abs(sinA);
  const t=Math.min(tX,tY);
  const ex=cosA*t, ey=sinA*t;
  const sx=LW/2+ex, sy=LH/2+ey;
  G.save();
  G.translate(sx,sy);
  G.rotate(a);
  // 화살표 (펄스)
  const pulse=0.5+0.5*Math.sin(gameTime*5);
  G.globalAlpha=0.7+pulse*0.3;
  G.fillStyle='#88ffaa';
  G.beginPath();G.moveTo(15,0);G.lineTo(-6,-9);G.lineTo(-3,0);G.lineTo(-6,9);G.closePath();G.fill();
  G.strokeStyle='#aaffcc';G.lineWidth=1.5;G.stroke();
  G.restore();
  // 거리 텍스트
  G.save();
  G.fillStyle='#88ffaa';G.font='bold 11px Courier New';G.textAlign='center';
  G.textBaseline='middle';
  // 화살표 안쪽으로 라벨 배치
  const lx=sx-cosA*22, ly=sy-sinA*22;
  G.fillText(`💉 ${Math.round(d)}`,lx,ly);
  G.textBaseline='alphabetic';
  G.restore();
}

  // ease-out: 1 - (1-prog)^4 → 초반 빠르고 끝에서 거의 안 움직임
  const eased=1-Math.pow(1-prog,4);
  const scrollY=totalDist*eased;
  // 폼들 표시 (위/중간/아래) — textBaseline='middle' 사용해서 정확한 시각 중앙 정렬
  const slotCenter=slotY+slotH/2;
  G.save();
  G.beginPath();G.rect(bx+20,slotY,bw-40,slotH);G.clip();
  G.textBaseline='middle';
  for(let i=-1;i<=3;i++){
    const idx=((Math.floor(scrollY/36)+i)%STREAMER_FORMS.length+STREAMER_FORMS.length)%STREAMER_FORMS.length;
    const form=STREAMER_FORMS[idx];
    const fy=slotCenter-(scrollY%36)+i*36;
    const distFromCenter=Math.abs(fy-slotCenter);
    const isCenter=distFromCenter<18;
    G.globalAlpha=isCenter?1:Math.max(0.25,0.7-distFromCenter*0.015);
    G.fillStyle=form.col;G.font=`bold ${isCenter?22:15}px Courier New`;
    G.textAlign='center';
    G.fillText(form.emoji+' '+form.name,LW/2,fy);
  }
  G.textBaseline='alphabetic';
  G.restore();
  // 선택 인디케이터 (중앙) — 슬롯 정중앙에 박스, 끝나갈수록 노란빛 강해짐
  const glow=prog>0.7?(prog-0.7)/0.3:0;
  const boxH=32, boxY=slotCenter-boxH/2;
  G.strokeStyle=`rgba(255,${255-glow*60},${102-glow*102},${1})`;
  G.lineWidth=2+glow*2;
  G.strokeRect(bx+20,boxY,bw-40,boxH);
  G.fillStyle=`rgba(255,${255-glow*60},${102-glow*102},${1})`;
  G.fillRect(bx+18,boxY+boxH/2-8,4,16);G.fillRect(bx+bw-22,boxY+boxH/2-8,4,16);
  // 진행도 바 (하단)
  G.fillStyle='#332211';G.fillRect(bx+12,by+bh-12,bw-24,4);
  G.fillStyle='#ffaa44';G.fillRect(bx+12,by+bh-12,(bw-24)*prog,4);
  G.restore();
}
function drawCocker(x,y,fr,evolved,flip){
  // 뭉치 — 흰 솜털 포메. 실제 뭉치 사진 기반 (흰 솜뭉치, 작은 검은 눈, 검은 단추 코, 살짝 어두운 입가, 작은 뾰족 귀)

  // 몸통 솜털 톡톡 (작은 돌출들)

  G.fillRect(x-9,y+1,1,2);G.fillRect(x+7,y+1,1,2);

  G.fillRect(x-11,y-5+(t?-1:1),2,3);
  G.fillRect(x-12,y-6+(t?0:2),2,2);

  G.fillStyle=cm;
  G.fillRect(x-13,y-5+(t?-1:1),1,2);
  // 머리 — 둥근 흰 머리 (조금 더 크게, 솜뭉치처럼)
  G.fillStyle=wh;G.fillRect(x+4,y-6,10,8);
  G.fillRect(x+5,y-7,8,1);  // 정수리 살짝
  G.fillRect(x+3,y-3,1,4);  // 왼쪽 솜털
  G.fillRect(x+14,y-3,1,4); // 오른쪽 솜털
  // 머리 옆 솜털 (얼굴 주변 둥근 라인)
  G.fillStyle=cm;
  G.fillRect(x+3,y-5,1,2);G.fillRect(x+14,y-5,1,2);
  G.fillRect(x+4,y+2,2,1);G.fillRect(x+12,y+2,2,1);
  // 작은 뾰족 귀 (포메 핵심 — 늘어지지 않고 위로 뾰족)
  G.fillStyle=wh;
  // 왼쪽 귀 (작은 삼각형)
  G.beginPath();
  G.moveTo(x+5,y-7);G.lineTo(x+4,y-10);G.lineTo(x+7,y-7);G.closePath();G.fill();
  // 오른쪽 귀
  G.beginPath();
  G.moveTo(x+11,y-7);G.lineTo(x+13,y-10);G.lineTo(x+12,y-7);G.closePath();G.fill();
  // 귀 안쪽 (살구색 살짝)
  G.fillStyle='#c89488';
  G.fillRect(x+5,y-8,1,1);G.fillRect(x+12,y-8,1,1);
  // 주둥이 — 작고 살짝 어두운 (사진에서 입가가 진함)
  G.fillStyle=muz;G.fillRect(x+10,y-1,5,3);
  G.fillStyle='#6a4838';G.fillRect(x+11,y+1,4,1); // 입 주변 음영
  // 작은 검은 눈 (단추처럼)
  G.fillStyle=blk;G.fillRect(x+6,y-4,2,2);G.fillRect(x+11,y-4,2,2);
  // 눈 반짝
  G.fillStyle='#fff';G.fillRect(x+7,y-4,1,1);G.fillRect(x+12,y-4,1,1);
  // 코 — 작은 검은 단추 (사진 기반, 가운데 살짝 위)
  G.fillStyle=blk;G.fillRect(x+13,y-1,2,2);
  // 입 (살짝 벌린 표정 — 사진처럼 잠잠한 느낌)
  G.fillStyle='#3a1a1a';G.fillRect(x+12,y+1,2,1);
  // 작은 혀 (가끔)
  if(t===0){G.fillStyle='#ff8899';G.fillRect(x+13,y+2,1,1)}
  // 진화형 (unleash) — 황금 글로우
  if(evolved){
    G.save();
    G.shadowColor='#ffaa00';G.shadowBlur=8;
    G.strokeStyle='rgba(255,200,0,0.55)';G.lineWidth=1;
    G.strokeRect(x-9,y-8,18,18);
    G.restore();
    // 황금 목걸이
    G.fillStyle='#ffcc00';G.fillRect(x+4,y,9,1);
    G.fillStyle='#ffee88';G.fillRect(x+8,y,2,1);
  }
  G.restore();
}

function triggerLvUp(){
  state='levelup';SFX.lvUp();

// 레벨업 카드 풀 생성 + 3장 선택 (새로고침이 재호출)
function rollLvUpCards(){
  const evoPool=[],wpnPool=[],itmPool=[];

  // ✨ 진화: 무기 maxLv + 페어 아이템 maxLv
  player.wpns.forEach(w=>{
    if(WDEFS[w.type].evolved)return; // 이미 진화
    const ev=EVOS[w.type];if(!ev)return;
    if((w.lv||1)<W_MAX_LV)return; // 무기 미완성
    if(player.pLv(ev.need)<P_MAX_LV)return; // 페어 아이템 미완성
    evoPool.push({
      tag:'✨진화',
      name:`✨ ${WDEFS[ev.res].name}`,
      desc:`${WDEFS[w.type].name} → ${WDEFS[ev.res].name}`,
      fn:()=>{w.type=ev.res;w.lv=1;SFX.evolve();notify('✨ 진화 완료!',WDEFS[ev.res].name,'#ffdd44');
        if(ev.res==='unleash'){if(player.companions)player.companions.length=0;shake(0.35,8);spawnParts(player.x,player.y,'#ffdd33',46);hitStop=Math.max(hitStop,0.3);notify('🐕✨ 각성!','초사이언 뭉치 — 와이파이 음파!','#ffdd22');}}
    });
  });

  // 무기 업그레이드 (현재 보유, max 미만)
  player.wpns.forEach(w=>{
    if((w.lv||1)>=W_MAX_LV)return;
    if(WDEFS[w.type].evolved)return; // 진화무기는 더 안 오름
    const wd=WDEFS[w.type],next=(w.lv||1)+1;
    const curM=WLV.dmgM[(w.lv||1)-1],nextM=WLV.dmgM[next-1];  // 누적 데미지 배율
    const pc=WPROJ[w.type], projTxt=(pc&&pc[next-1]>pc[(w.lv||1)-1])?` · 발사 ${pc[(w.lv||1)-1]}→${pc[next-1]}`:'';
    wpnPool.push({
      tag:'무기 ⬆',
      name:`${wd.name}`,
      desc:`데미지 ×${curM.toFixed(2)}→×${nextM.toFixed(2)}${projTxt}${next===W_MAX_LV?' (MAX)':''}`,
      lvBadge:`Lv.${next}`,
      fn:()=>{w.lv=next;if(next===W_MAX_LV)notify('⚔ 무기 MAX',wd.name+' 진화 준비','#ff8844')}
    });
  });

  // 새 무기 (슬롯 여유)
  if(player.wpns.length<W_SLOTS){
    const owned=player.wpns.map(w=>w.type);
    // 진화된 무기 보유 시 그 베이스 무기도 제외 (다시 못 먹게)
    const evolvedOwned=new Set();
    Object.entries(EVOS).forEach(([base,def])=>{
      if(owned.includes(def.res))evolvedOwned.add(base);
    });
    // co도 다른 캐릭처럼 추가 무기 주울 수 있게 (뭉치만 고정 제한 제거 — 무기 카드 마름 방지)
    BASE_WPNS.filter(t=>{
      if(owned.includes(t))return false;
      if(evolvedOwned.has(t))return false;
      return true;
    }).forEach(wt=>{
      wpnPool.push({
        tag:'무기 NEW',
        name:`${WDEFS[wt].name}`,
        desc:'새 무기 슬롯',
        lvBadge:'NEW',
        fn:()=>player.wpns.push({type:wt,t:0,lv:1})
      });
    });
  }

  // 아이템 업그레이드 (보유 중, max 미만)
  Object.keys(player.passives).forEach(id=>{
    const lv=player.passives[id];if(lv>=P_MAX_LV)return;
    const ps=PASSIVES.find(x=>x.id===id);if(!ps)return;
    const next=lv+1;
    itmPool.push({
      tag:'아이템 ⬆', __pid:id,
      name:ps.name,
      desc:`${ps.desc}${EVO_ITEM[id]?' · ✨'+WDEFS[EVO_ITEM[id]].name.split(' ')[0]+'진화':''} (Lv.${lv}→${next}${next===P_MAX_LV?' MAX':''})`,
      lvBadge:`Lv.${next}`,
      fn:()=>{player.passives[id]=next;ps.fn(player);if(next===P_MAX_LV)notify('🎁 아이템 MAX',ps.name,'#88ccff')}
    });
  });

  // 새 아이템 (슬롯 여유) — 지워니 전설템 '추가 거래소'로 늘어난 칸 반영
  if(player.pCnt()<P_SLOTS+(player.extraSlots||0)){
    PASSIVES.filter(p=>!player.hasP(p.id)).forEach(p=>{
      itmPool.push({
        tag:'아이템 NEW', __pid:p.id,
        name:p.name,
        desc:`${p.desc}${EVO_ITEM[p.id]?' · ✨'+WDEFS[EVO_ITEM[p.id]].name.split(' ')[0]+'진화':''}`,
        lvBadge:'NEW',
        fn:()=>{player.passives[p.id]=1;p.fn(player)}
      });
    });
  }

  // ✨ 진화 재료 우선 노출: 보유 무기(Lv4+)의 페어 아이템을 매 레벨업 한 장 '보장 제공'.
  // (이전엔 페어 아이템이 13종 중에 묻혀 거의 안 떠서, 잡템으로 6칸이 차면 진화가 영영 봉인됐음)
  let evoMatCard=null;
  {
    const cands=[];
    player.wpns.forEach(w=>{
      if(WDEFS[w.type].evolved)return;
      const ev=EVOS[w.type];if(!ev)return;
      if((w.lv||1)<4)return;                    // 무기를 어느정도 키운 뒤부터 권유
      if(player.pLv(ev.need)>=P_MAX_LV)return;  // 페어 아이템 이미 만렙(=진화 준비 완료)
      cands.push({need:ev.need,wlv:(w.lv||1)});
    });
    cands.sort((a,b)=>b.wlv-a.wlv);             // 가장 많이 키운 무기의 페어부터
    for(const cd of cands){
      const idx=itmPool.findIndex(c=>c.__pid===cd.need);  // 슬롯 여유 있을 때만 itmPool에 존재
      if(idx>=0){evoMatCard=itmPool.splice(idx,1)[0];break;}
    }
  }
  // 3개 선택: 진화 1개 우선, 진화재료 1개 보장, 나머지는 무기/아이템 섞어서
  upgradeChoices=[];
  if(evoPool.length)upgradeChoices.push(evoPool[0]);
  if(evoMatCard&&upgradeChoices.length<3)upgradeChoices.push(evoMatCard);
  // 무기/아이템 풀에서 랜덤 픽 (없으면 다른 풀에서)
  const pickFrom=arr=>{if(!arr.length)return null;const i=Math.floor(Math.random()*arr.length);return arr.splice(i,1)[0]};
  while(upgradeChoices.length<3){
    // 균형: 무기와 아이템 번갈아
    const wantWpn=upgradeChoices.filter(c=>c.tag.startsWith('무기')).length<=upgradeChoices.filter(c=>c.tag.startsWith('아이템')).length;
    let next=wantWpn?pickFrom(wpnPool)||pickFrom(itmPool):pickFrom(itmPool)||pickFrom(wpnPool);
    if(!next)break;
    upgradeChoices.push(next);
  }
  // 풀이 완전히 비면 회복으로 폴백
  if(!upgradeChoices.length){
    upgradeChoices.push({tag:'보너스',name:'💚 회복',desc:'HP 50% 회복',lvBadge:'',fn:()=>{player.hp=Math.min(player.mhp,player.hp+player.mhp*0.5)}});
  }
}
// 레벨업 새로고침 — 남은 횟수 소모하고 카드 다시 뽑기
function rerollLvUp(){
  if(!player||(player.rerolls||0)<=0)return;
  player.rerolls--;
  rollLvUpCards();
  SFX.shoot();
}

function drawWorld(){
  // 바닥 그라데이션 base
  G.fillStyle='#0a120a';G.fillRect(-4000,-4000,8000,8000);

  });
  // 경계선 (피로 그려진 마법진)
  G.strokeStyle='#7a0000';G.lineWidth=3;G.setLineDash([14,10]);
  G.strokeRect(-1900,-1900,3800,3800);G.setLineDash([]);
  G.strokeStyle='rgba(170,0,0,0.3)';G.lineWidth=8;
  G.strokeRect(-1900,-1900,3800,3800);
  // 안개 패치
  FOGS.forEach(f=>{
    if(Math.abs(f.x-player.x)>LW/2+f.r||Math.abs(f.y-player.y)>LH/2+f.r)return;
    const ox=Math.sin(gameTime*0.3+f.ph)*f.sp,oy=Math.cos(gameTime*0.2+f.ph)*f.sp;
    const grd=G.createRadialGradient(f.x+ox,f.y+oy,0,f.x+ox,f.y+oy,f.r);
    grd.addColorStop(0,'rgba(120,140,140,0.13)');grd.addColorStop(1,'rgba(120,140,140,0)');
    G.fillStyle=grd;G.beginPath();G.arc(f.x+ox,f.y+oy,f.r,0,Math.PI*2);G.fill();
  });
  // 타일/오브젝트
  TILES.forEach(t=>{
    if(Math.abs(t.x-player.x)>LW/2+30||Math.abs(t.y-player.y)>LH/2+30)return;
    const tx=t.x,ty=t.y;

      // 줄기

      G.fillStyle='#5a3018';G.fillRect(tx-4,ty-2,2,11);
      G.fillStyle='#1a1008';G.fillRect(tx+2,ty-2,2,11);
      // 잎 (어두운 죽은 나무)
      G.fillStyle='#1a3318';G.fillRect(tx-12,ty-20,24,16);
      G.fillRect(tx-10,ty-24,20,5);
      G.fillStyle='#244a24';G.fillRect(tx-12,ty-20,24,3);G.fillRect(tx-12,ty-20,3,16);
      G.fillStyle='#0e1f0e';G.fillRect(tx-12,ty-7,24,3);G.fillRect(tx+9,ty-20,3,16);
      // 잎 텍스처
      G.fillStyle='#152815';G.fillRect(tx-6,ty-15,3,3);G.fillRect(tx+3,ty-12,3,3);
    }else if(t.t==='grave'){
      shadow(tx,ty+10,10,3,0.5);
      // 무덤 흙
      G.fillStyle='#3a2510';G.fillRect(tx-9,ty-1,18,10);
      G.fillStyle='#5a3a18';G.fillRect(tx-9,ty-1,18,2);
      // 비석
      G.fillStyle='#3a3a3a';G.fillRect(tx-8,ty-12,16,12);
      G.fillStyle='#555';G.fillRect(tx-7,ty-15,14,4);
      G.fillStyle='#222';G.fillRect(tx-8,ty-2,16,2);G.fillRect(tx+6,ty-15,2,15);
      G.fillStyle='#6a6a6a';G.fillRect(tx-8,ty-15,3,15);G.fillRect(tx-8,ty-15,16,1);
      // R.I.P 글자
      G.fillStyle='#222';G.fillRect(tx-5,ty-10,2,3);G.fillRect(tx-1,ty-10,2,3);G.fillRect(tx+3,ty-10,2,3);
      // 십자가 표시
      G.fillStyle='#222';G.fillRect(tx-1,ty-7,2,5);G.fillRect(tx-3,ty-5,6,2);
    }else if(t.t==='crucifix'){
      shadow(tx,ty+8,5,2,0.5);
      G.fillStyle='#3a2510';G.fillRect(tx-2,ty-12,4,20);
      G.fillStyle='#5a3a18';G.fillRect(tx-2,ty-12,1,20);
      G.fillStyle='#3a2510';G.fillRect(tx-7,ty-8,14,4);
      G.fillStyle='#5a3a18';G.fillRect(tx-7,ty-8,14,1);
      G.fillStyle='#1a1008';G.fillRect(tx-7,ty-5,14,1);
    }else if(t.t==='rock'){
      shadow(tx,ty+5,9,2.5,0.4);
      G.fillStyle='#3a3a3a';G.fillRect(tx-8,ty-2,16,8);
      G.fillStyle='#555';G.fillRect(tx-7,ty-4,14,3);G.fillRect(tx-8,ty-2,16,1);
      G.fillStyle='#222';G.fillRect(tx-8,ty+5,16,1);G.fillRect(tx+6,ty-2,2,8);
      G.fillStyle='#6a6a6a';G.fillRect(tx-6,ty-3,3,1);
    }else if(t.t==='bush'){
      shadow(tx,ty+5,7,2,0.4);
      G.fillStyle='#1a2a1a';G.fillRect(tx-7,ty-4,14,9);
      G.fillStyle='#244a24';G.fillRect(tx-7,ty-4,14,2);G.fillRect(tx-7,ty-4,2,9);
      G.fillStyle='#0e1f0e';G.fillRect(tx+5,ty-4,2,9);G.fillRect(tx-7,ty+3,14,2);

      if(t.seed<0.3){G.fillStyle='#aa1133';G.fillRect(tx-2,ty-1,2,2);G.fillRect(tx+2,ty+1,2,2)}
    }else if(t.t==='bone'){
      G.fillStyle='rgba(0,0,0,0.3)';G.fillRect(tx-7,ty+1,14,2);
      G.fillStyle='#cccccc';G.fillRect(tx-7,ty-1,14,2);

      G.fillStyle='#cccccc';G.fillRect(tx-8,ty-2,3,4);G.fillRect(tx+5,ty-2,3,4);
      G.fillStyle='#999';G.fillRect(tx-8,ty+1,3,1);G.fillRect(tx+5,ty+1,3,1);
    }
  });
}

function drawBar(x,y,w,h,pct,bgC1,bgC2,c1,c2,c3,label,labCol){
  // 배경 (입체감)
  G.fillStyle=bgC1;G.fillRect(x,y,w,h);
  G.fillStyle=bgC2;G.fillRect(x,y+h-2,w,2);
  // 채워진 부분 (그라데이션)
  const fw=Math.max(0,w*pct);
  const gr=G.createLinearGradient(x,y,x,y+h);
  gr.addColorStop(0,c1);gr.addColorStop(0.5,c2);gr.addColorStop(1,c3);
  G.fillStyle=gr;G.fillRect(x,y,fw,h);
  // 하이라이트
  G.fillStyle='rgba(255,255,255,0.3)';G.fillRect(x,y+1,fw,1);
  // 테두리
  G.strokeStyle='rgba(0,0,0,0.8)';G.lineWidth=1;G.strokeRect(x+0.5,y+0.5,w,h);
  G.strokeStyle='rgba(255,255,255,0.15)';G.strokeRect(x-0.5,y-0.5,w+1,h+1);
  if(label){
    G.font='bold 10px Courier New';G.textAlign='center';
    G.fillStyle='#000';G.fillText(label,x+w/2+1,y+h-3+1);
    G.fillStyle=labCol||'#fff';G.fillText(label,x+w/2,y+h-3);
  }
}

    if(p.dishBuff){
      G.fillStyle='#ffcc44';G.fillRect(mX,mY-9,mW*(p.dishBuff.t/BAL.char.jw.dishDur),10);
      G.fillStyle='#000';G.font='bold 8px Courier New';G.textAlign='center';
      G.fillText(`${p.dishBuff.recipe.emoji} ${p.dishBuff.t.toFixed(1)}s`,mX+mW/2,mY-1);
    }else{
      G.fillStyle='#3a2a18';G.fillRect(mX,mY-9,mW,10);
      G.fillStyle='#ffaa66';G.font='bold 8px Courier New';G.textAlign='center';
      G.fillText('🏨 호텔',mX+mW/2,mY-1);
    }
  }else if(p.cd.id==='gj'){
    // 기종 phase별 표시
    G.fillStyle='rgba(0,0,0,0.6)';G.fillRect(mX,mY-9,mW,10);
    if(p.gjPhase==='rage'){

      G.fillStyle='#fff';G.font='bold 8px Courier New';G.textAlign='center';
      G.fillText(`🔥 ${p.gjPhaseT.toFixed(1)}s`,mX+mW/2,mY-1);
    }else if(p.gjPhase==='wheelchair'){
      // 휠체어 모드 — 신경주사 찾기 안내
      const bl=Math.sin(gameTime*4)*0.5+0.5;
      G.fillStyle=`rgba(136,170,255,${0.6+bl*0.4})`;G.fillRect(mX,mY-9,mW,10);
      G.fillStyle='#001';G.font='bold 8px Courier New';G.textAlign='center';
      G.fillText('🦽 💉 찾기',mX+mW/2,mY-1);
    }else{
      // 정상 — 누적 게이지
      const c=p.discPain>=0.85?'#ff66cc':'#9966cc';

    const sIX=260,sIY=10,sIW=140,sIH=30;  // 높이 24→30 (한글 위 잘림 방지)

    const form=p.streamerForm,col=form?form.col:'#888';
    G.strokeStyle=col;G.lineWidth=1.5;G.strokeRect(sIX,sIY,sIW,sIH);

    if(form){
      G.fillText(form.emoji+' '+form.name,sIX+6,sIY+18);
    }else{
      G.fillStyle='#888';
      G.fillText('🎤 윤소민 (평소)',sIX+6,sIY+18);
    }
    // 다음 룰렛까지 카운트다운 바
    G.fillStyle='#222';G.fillRect(sIX,sIY+sIH,sIW,3);
    const t=(p.rouletteT>0||p.awaitingClick)?1:(p.streamerT/30);
    const barCol=p.awaitingClick?'#ffff66':(p.rouletteT>0?'#ffaa44':col);
    G.fillStyle=barCol;G.fillRect(sIX,sIY+sIH,sIW*t,3);
    // 시간 텍스트 (서브)
    G.fillStyle='#aaa';G.font='8px Courier New';G.textAlign='right';
    if(p.awaitingClick)G.fillText('👆 클릭하여 변신',sIX+sIW-4,sIY+27);
    else if(p.rouletteT>0)G.fillText('🎰 룰렛 돌아가는 중',sIX+sIW-4,sIY+27);
    else G.fillText(`다음 변신 ${Math.ceil(p.streamerT)}s`,sIX+sIW-4,sIY+27);
  }
  G.restore();
  // 중앙 - 시계
  G.save();
  const mm=String(Math.floor(gameTime/60)).padStart(2,'0'),ss=String(Math.floor(gameTime%60)).padStart(2,'0');
  G.fillStyle='rgba(0,0,0,0.7)';G.fillRect(LW/2-46,8,92,42);
  G.strokeStyle='#555';G.lineWidth=1;G.strokeRect(LW/2-46,8,92,42);
  G.fillStyle='#222';G.fillRect(LW/2-44,10,88,2);

  G.fillStyle='#888';G.font='bold 9px Courier New';G.fillText(`💀 ${killCount}`,LW/2,45);
  G.restore();
  // 우측 - 무기 슬롯 (4칸 고정 그리드, 한글 잘림 방지 위해 패널 확장)

  const wsX=LW-148,wsY=8,wsH=22+W_SLOTS*16;

    const wd=WDEFS[w.type];if(!wd)continue;
    G.fillStyle=wd.col+'33';G.fillRect(wsX+4,wy-10,132,15);
    // 쿨다운 진행도
    const maxCd=wd.cd*wlvAt(WLV.cdM,w.lv)/p.as,cdP=Math.max(0,Math.min(1,1-w.t/maxCd));
    G.fillStyle=wd.col;G.fillRect(wsX+4,wy+4,132*cdP,2);
    // 이름
    const maxed=wd.evolved||w.lv>=W_MAX_LV;

  // 아이템 슬롯 (지워니 전설템으로 늘어날 수 있음)
  const pSlots=P_SLOTS+(p.extraSlots||0);

  for(let i=0;i<pSlots;i++){

    const maxed=lv>=P_MAX_LV;
    G.fillStyle=(maxed?'#88ccff33':'#88ccff15');G.fillRect(isX+4,iy-10,132,15);

  }
  G.restore();
  // 보스 체력바
  if(boss){
    const bw=400,bx=LW/2-bw/2,by=LH-46;
    // 배경 패널
    G.save();
    G.fillStyle='rgba(0,0,0,0.85)';G.fillRect(bx-8,by-28,bw+16,52);

      boss.phase===2?'#880000':'#661111',
      `${Math.ceil(boss.hp)} / ${boss.mhp}`,'#fff');

}

function shopBuy(res){

function drawVolSlider(x,y,w,val,col,id){

  const fw=w*val;

  gr.addColorStop(0,col);gr.addColorStop(1,shade(col,-40));
  G.fillStyle=gr;G.fillRect(x,y,fw,8);

  const kx=x+fw,ky=y+4;

}

// ═══ SPAWN ═══
function spawnEnemies(dt){
  spawnT-=dt;if(spawnT>0)return;
  const wave=Math.floor(gameTime/30);
  // 후반 물량은 '벽'이 되므로 늘리지 않음(이전 +33% 롤백). 동시 스폰 상한 15 고정.
  const cnt=Math.min(3+wave*2,13);  // 동시 스폰 상한 15→13 (후반 물량 벽 소폭 완화, 패시브 너프 보상)
  // 플레이어 진행(이동) 방향 ±35° 콘은 스폰 절반으로 줄여 '도망 통로' 형성
  const fang=Math.atan2(player.facing.y,player.facing.x);
  for(let i=0;i<cnt;i++){
    let a;
    for(let tries=0;tries<4;tries++){
      a=Math.random()*Math.PI*2;
      let da=a-fang;while(da>Math.PI)da-=Math.PI*2;while(da<-Math.PI)da+=Math.PI*2;
      if(Math.abs(da)>0.61||Math.random()>0.5)break;  // 콘(0.61rad≈35°) 밖이면 채택, 안이면 50%만 채택(나머지 리롤)
    }
    const r=310+Math.random()*110;
    const ex=player.x+Math.cos(a)*r,ey=player.y+Math.sin(a)*r;
    const rv=Math.random();
    let type='zombie';
    if(gameTime>=60)type=rv<0.55?'zombie':'bat';
    if(gameTime>=120)type=rv<0.4?'zombie':rv<0.6?'bat':rv<0.85?'rusher':'zombie';
    if(gameTime>=200)type=rv<0.32?'zombie':rv<0.52?'bat':rv<0.74?'rusher':rv<0.8?'skeleton':rv<0.92?'splitter':'zombie';  // 해골 10%→6% (총알 강화 보상)
    if(gameTime>=300){
      // 후반: 탱커/분열형/자폭형 추가 (VS 참고)
      if(rv<0.2)type='zombie';
      else if(rv<0.36)type='bat';
      else if(rv<0.52)type='rusher';
      else if(rv<0.58)type='skeleton';   // 9%→6% (총알 강화 보상)
      else if(rv<0.71)type='tank';
      else if(rv<0.86)type='splitter';   // 12%→15%
      else if(rv<0.92)type='bomber';     // 10%→6% (떼거리 완화)
      else type='zombie';
    }
    const elite=Math.random()<0.08;
    enemies.push(new Enemy(ex,ey,type,elite));
  }
  // 10분부터 스폰 간격을 늘려 화면 밀도↓ (스폰율 30→ 11분 27 → 15분 19/s). 처치율과 균형 맞춰 '벽' 완화
  const lateFloor=0.55+Math.min(0.4,Math.max(0,(gameTime-600)/60)*0.06);  // 하한 0.5→0.55 (스폰 간격↑ = 밀도↓, 6~11분 벽 완화)
  spawnT=Math.max(lateFloor,2.2-wave*0.15);
}

// ═══ MAIN ═══

  gameTime=0;spawnT=0;bossIdx=0;bossActive=false;killCount=0;afr=0;afrT=0;totalDmg=0;dmgPeak=0;dmgByWpn={};
  investT=BAL.char.zw.investInterval;investOpen=false;lastInvestResult=null;investToastT=0;hovInvest=-1;investResultOpen=false;
  shopT=BAL.char.zw.shopInterval;shopEnt=null;shopOpen=false;shopOffers=[];hovShop=-1;
  hotelT=BAL.char.jw.hotelInterval;hotelEnt=null;hotelOpen=false;hovHotel=-1;cookOpen=false;cookStage='';cookDish=null;ingreds=[];  // 🍳 종원 요리
  dmgTexts=[];hitSparks=[];notifs=[];pickups=[];decals=[];lvUpBursts=[];

function reset(){

  hotelEnt=null;hotelOpen=false;cookOpen=false;cookStage='';cookDish=null;ingreds=[];  // 🍳 종원 요리 정리

function getMouse(e){
  // CSS 픽셀 좌표를 논리 좌표(LW×LH)로 변환
  const r=c.getBoundingClientRect();
  return {x:(e.clientX-r.left)*(LW/r.width),y:(e.clientY-r.top)*(LH/r.height)};
}
// 우클릭으로 컨텍스트 메뉴가 열리면 keyup 이벤트가 묻혀서 이동 키가 잠긴 채 유지되는 버그가 있음.
// 컨텍스트 메뉴를 막아서 keyup이 정상적으로 도착하게 함.
c.addEventListener('contextmenu',e=>{e.preventDefault();return false});
// 추가 안전장치: 윈도우/캔버스 포커스 잃을 때 눌린 키 전부 초기화
window.addEventListener('blur',()=>{for(const k in keys)keys[k]=false});
c.addEventListener('mouseleave',()=>{for(const k in keys)keys[k]=false});

c.addEventListener('mouseup',()=>{dragSlider=null});
c.addEventListener('click',e=>{
  iac();
  const m=getMouse(e);
  // 설정 창이 열려 있으면 우선 처리
  if(settingsOpen){
    const sb=getSettingsCloseAt(m.x,m.y);
    if(sb===0){settingsOpen=false;hovSetBtn=-1}

  }
  // 📊 지워니 투자 결과 애니 → 클릭하면 다음(현금 있으면 투자창)
  if(investResultOpen&&player){
    if(performance.now()-investResultStart>1000){  // 스냅(떡상/떡락) 본 뒤 클릭 허용
      investResultOpen=false;
      if(player.seedMoney>0){investOpen=true;hovInvest=-1;}
    }
    return;
  }
  // 📈 지워니 투자창 클릭 (4종목 올인 / 패스)
  if(investOpen&&player){
    const i=getInvestClick(m.x,m.y);
    if(i===99){investOpen=false;}                 // 패스: 현금 보유
    else if(i>=0){player.doInvest(i);investOpen=false;}  // 올인 투자
    return;
  }
  // 🛒 지워니 상점 클릭 (구매 / 나가기)
  if(shopOpen&&player){
    const i=getShopClick2(m.x,m.y);
    if(i>=0)shopBuy2(i);
    return;
  }
  // 🔪 종원 칼질 미니게임 — 클릭 = 컷 (intro/result 중엔 무시)
  if(cookOpen){
    if(cookStage==='cut1'||cookStage==='cut2')doCut();
    return;
  }
  // 🏨 종원 호텔 요리 선택 (요리 가능한 것만 / 나가기)
  if(hotelOpen&&player){
    const i=getHotelClick(m.x,m.y);
    if(i===99)closeHotel();
    else if(i>=0){ const r=DISHES[i]; if(cookableRecipes().includes(r))startCook(r); }
    return;
  }
  // 📞 야근 전화 컷신 진행 (사장 대사 → 소민 대사 → 야근모드 발동)
  if(state==='playing'&&player&&player.workCut>0&&rouletteOn(player)){ advanceWorkCut(); return; }
  // 윤소민 룰렛 결과 카드 클릭 → 변신 적용 + 게임 재개
  if(state==='playing'&&player&&player.awaitingClick&&rouletteOn(player)){ advanceRoulette(); return; }
  if(state==='title'){
    const i=getTitleBtnAt(m.x,m.y);
    if(i>=0){const a=TITLE_BTNS[i].action; doTitleAction(a); }
    else playBgm('title');  // 빈 곳 클릭 - BGM 트리거
    return;
  }
  if(state==='shop'){ shopBuy(getShopClick(m.x,m.y)); return; }
  if(state==='select'&&hovChar>=0)startGame(CHARS[hovChar]);
  if(state==='levelup'){
    // 🔄 새로고침 버튼
    const rb=rerollBtnRect();
    if(m.x>=rb.x&&m.x<=rb.x+rb.w&&m.y>=rb.y&&m.y<=rb.y+rb.h){ rerollLvUp(); return; }
    const i=getUpgradeAt(m.x,m.y);if(i>=0)pickUpgrade(i);
  }
  if(state==='dead'||state==='win')reset();
});
// 메뉴 액션 공용 함수 (클릭·키보드 공용)
function advanceWorkCut(){
  if(!(player&&player.workCut>0))return;
  player.workCut++;
  if(player.workCut>2){
    player.workCut=0; player.streamerForm=WORK_FORM; player.streamerT=30; player.lastWasSleep=false;
    paused=false; for(const k in keys)keys[k]=false;
    SFX.phialReady(); notify('📞 야근 윤소민!','손전등 2개 풀가동 — 30초','#ffcc22');
  }else SFX.shoot();
}
function advanceRoulette(){
  if(!(player&&player.awaitingClick))return;
  if(player.rouletteResult&&player.rouletteResult.id==='sleep'&&player.lastWasSleep&&player.cd.id==='sm'){
    player.awaitingClick=false; player.workCut=1; SFX.over(); return;
  }
  player.streamerForm=player.rouletteResult; player.streamerT=30; player.awaitingClick=false;
  player.lastWasSleep=(player.rouletteResult&&player.rouletteResult.id==='sleep');
  paused=false; for(const k in keys)keys[k]=false;
  SFX.lvUp(); if(player.streamerForm.id==='sleep')SFX.over();
}
function doTitleAction(a){
  if(a==='start'){state='select';playBgm('title')}
  else if(a==='shop'){state='shop';selMeta=0;playBgm('title')}
  else if(a==='settings'){settingsOpen=true}
}
function pickUpgrade(i){
  const choice=upgradeChoices[i]; if(!choice)return;
  choice.fn(player);
  if(choice.tag==='무기 NEW')notify('⚔ 새 무기',choice.name,'#ff8844');
  else if(choice.tag==='아이템 NEW')notify('🎁 새 아이템',choice.name,'#88ccff');
  if(pendingLvUps>0){pendingLvUps--;triggerLvUp()}
  else state='playing';
}

function update(dt){
  if(state!=='playing'){
    // 알림은 일시정지/레벨업 중에도 자연스럽게 사라지도록
    if(state==='levelup'){notifs.forEach(n=>{n.life-=dt;n.dead=n.life<=0});notifs=notifs.filter(n=>!n.dead)}
    return;
  }
  if(paused)return;
  // 히트스톱 — 큰 타격 순간 잠깐 정지 (render는 계속 → 프리즈 프레임)
  if(hitStop>0){hitStop-=dt;return;}
  // 룰렛 돌아갈 때 모든 게임 멈춤 (룰렛 진행만)
  if(player&&player.rouletteT>0&&rouletteOn(player)){
    player.rouletteT-=dt;
    if(player.rouletteT<=0){
      // 룰렛 끝 — 변신 적용은 클릭 후로 미룸
      player.rouletteT=0;
      player.awaitingClick=true;
      SFX.phialReady();
    }
    return;
  }
  // 룰렛 결과 카드 클릭 대기 / 야근 전화 컷신 중에도 게임 정지
  if(player&&player.awaitingClick&&rouletteOn(player))return;
  if(player&&player.workCut>0&&rouletteOn(player))return;
  // 📈 지워니 주식: 투자창 주기 (창 닫혀있을 때만 타이머 진행)
  if(player&&player.cd.id==='zw'&&!investOpen&&!shopOpen&&!investResultOpen){
    const Z=BAL.char.zw;
    investT-=dt;
    if(investT<=0){
      investT=Z.investInterval;
      player.stepStocks();
      const res=player.resolveInvest();
      if(res){
        lastInvestResult=res; investToastT=2.6;
        investResultOpen=true; investResultStart=performance.now();  // 정산 결과 애니 창
        if(Math.abs(res.pct)>=30){shake(0.12,4);spawnParts(player.x,player.y,res.profit>=0?'#33ee99':'#ff4455',12);}
      } else if(player.seedMoney>0){ investOpen=true; hovInvest=-1; }  // 투자 안 했었으면 바로 선택창
    }
    if(investToastT>0)investToastT-=dt;
    // 🛒 상점 스폰 (주기) + 진입
    shopT-=dt;
    if(shopT<=0&&!shopEnt){ shopT=Z.shopInterval; const a=Math.random()*Math.PI*2,r=rnd(260,400); shopEnt={x:player.x+Math.cos(a)*r,y:player.y+Math.sin(a)*r,fr:0}; notify('🛒 증권상점 등장!','맵 표시 — 찾아가서 스탯 구매','#ffd24a'); }
    if(shopEnt){ shopEnt.fr+=dt; if(dist(player,shopEnt)<44)openShop(); }
    // 💸 돈 0원 → 맵에 지원금 (중복 방지, 25초 후부터)
    if(player.seedMoney<=0&&!player.invest&&gameTime>25&&!pickups.some(pk=>pk.t==='subsidy'&&!pk.dead)){
      const a=Math.random()*Math.PI*2,r=rnd(150,250);
      spawnPickup(player.x+Math.cos(a)*r,player.y+Math.sin(a)*r,'subsidy');
    }
  }
  // 🍳 종원 호텔 스폰/진입 (창 닫혀있을 때만 타이머 진행) + 미니게임 진행
  if(player&&player.cd.id==='jw'&&!hotelOpen&&!cookOpen){
    const J=BAL.char.jw;
    hotelT-=dt;
    if(hotelT<=0&&!hotelEnt){ hotelT=J.hotelInterval; const a=Math.random()*Math.PI*2,r=rnd(260,400); hotelEnt={x:player.x+Math.cos(a)*r,y:player.y+Math.sin(a)*r,fr:0}; notify('🏨 2시즌스 호텔 등장!','맵 표시 — 찾아가서 요리','#ffcc44'); }
    if(hotelEnt){ hotelEnt.fr+=dt; if(dist(player,hotelEnt)<J.hotelEnterR)openHotel(); }
  }
  if(cookOpen){ stepCook(dt); return; }  // 칼질 미니게임 = 게임 정지(미니게임만 진행)
  if(hotelOpen)return;                    // 요리 선택 화면 = 게임 정지
  if(investOpen||shopOpen||investResultOpen)return;  // 투자창/상점/결과창 → 게임 정지
  gameTime+=dt;
  afrT+=dt;if(afrT>0.18){afr++;afrT=0}
  player.update(dt);spawnEnemies(dt);
  if(!bossActive&&bossIdx<BDEFS.length&&gameTime>=BDEFS[bossIdx].t){boss=new Boss(BDEFS[bossIdx]);bossActive=true;bossIdx++;shake(0.4,6)}
  enemies.forEach(e=>e.update(dt));enemies=enemies.filter(e=>!e.dead);
  if(enemies.length>380)enemies=enemies.slice(enemies.length-380);
  if(boss){boss.update(dt);if(boss&&boss.dead)boss=null}
  // 컴패니언 (뭉치) 업데이트
  if(player.companions)player.companions.forEach(c=>c.update(dt));
  projs.forEach(p=>p.update(dt));projs=projs.filter(p=>!p.dead);
  if(projs.length>250)projs=projs.slice(projs.length-250);
  gems.forEach(g=>g.update(dt));gems=gems.filter(g=>!g.dead);
  coins.forEach(c=>c.update(dt));coins=coins.filter(c=>!c.dead);
  ingreds.forEach(g=>g.update(dt));ingreds=ingreds.filter(g=>!g.dead);  // 🍳 종원 재료 픽업
  if(ingreds.length>200)ingreds=ingreds.slice(ingreds.length-200);
  parts.forEach(p=>{p.x+=p.vx*dt;p.y+=p.vy*dt;p.life-=dt;p.dead=p.life<=0});
  parts=parts.filter(p=>!p.dead);
  dmgTexts.forEach(d=>{d.y+=d.vy*dt;d.vy+=80*dt;d.life-=dt;d.dead=d.life<=0});
  dmgTexts=dmgTexts.filter(d=>!d.dead);
  if(dmgTexts.length>50)dmgTexts=dmgTexts.slice(-50);
  hitSparks.forEach(s=>{s.x+=s.vx*dt;s.y+=s.vy*dt;s.vx*=0.85;s.vy*=0.85;s.life-=dt;s.dead=s.life<=0});
  hitSparks=hitSparks.filter(s=>!s.dead);
  if(shakeT>0){shakeT-=dt;if(shakeT<=0)shakeM=0}
  // 픽업
  pickups.forEach(pk=>{
    pk.life-=dt;pk.fr+=dt*3;
    if(pk.life<=0){pk.dead=true;return}
    if(pk.t==='injection')return;  // 신경주사는 자석 흡수/자동 픽업 안 됨 (직접 가서 받아야)
    if(dist(pk,player)<player.magr*0.5){const a=Math.atan2(player.y-pk.y,player.x-pk.x);pk.x+=Math.cos(a)*180*dt;pk.y+=Math.sin(a)*180*dt}
    if(dist(pk,player)<16)applyPickup(pk);
  });
  pickups=pickups.filter(pk=>!pk.dead);
  // 알림
  notifs.forEach(n=>{n.life-=dt;n.dead=n.life<=0});
  notifs=notifs.filter(n=>!n.dead);
  if(notifs.length>4)notifs=notifs.slice(-4);
  // 데칼
  decals.forEach(d=>{d.life-=dt;if(d.life<=0)d.dead=true});
  decals=decals.filter(d=>!d.dead);
  // 레벨업 버스트
  lvUpBursts.forEach(b=>{b.life-=dt;if(b.life<=0)b.dead=true});
  lvUpBursts=lvUpBursts.filter(b=>!b.dead);
  // 카메라 시선 선행 (이동 방향으로 살짝 앞 보기)
  const targX=player.facing.x*40,targY=player.facing.y*30;
  camOX+=(targX-camOX)*Math.min(1,dt*2.5);
  camOY+=(targY-camOY)*Math.min(1,dt*2.5);
  // 날씨
  updateWeather(dt);
}

function render(){
  // 매 프레임 변환 초기화 (논리 좌표계 유지)
  G.setTransform(G._scale||1,0,0,G._scale||1,0,0);
  G.fillStyle='#080808';G.fillRect(0,0,LW,LH);
  if(state==='title'){renderTitle();if(settingsOpen)renderSettings();return}
  if(state==='shop'){renderShop();return}
  if(state==='select'){renderSelect();if(settingsOpen)renderSettings();return}
  // 화면 흔들림 + 카메라 선행
  const sx=shakeT>0?rnd(-shakeM,shakeM):0,sy=shakeT>0?rnd(-shakeM,shakeM):0;
  const camX=LW/2-player.x-camOX+sx,camY=LH/2-player.y-camOY+sy;
  G.save();G.translate(camX,camY);
  drawWorld();
  // 데칼 (월드 배경 위, 모든 엔티티 아래)
  drawDecals();
  // 🛒 지워니 증권상점 (맵 건물)
  if(shopEnt){
    const sx=shopEnt.x,sy=shopEnt.y,bob=Math.sin(shopEnt.fr*2)*2;
    G.save();shadow(sx,sy+14,20,5,0.4);
    // 건물
    G.fillStyle='#1a2e44';G.fillRect(sx-20,sy-18+bob,40,30);
    G.fillStyle='#22405e';G.fillRect(sx-20,sy-18+bob,40,8);
    G.fillStyle='#ffd24a';G.fillRect(sx-20,sy-10+bob,40,2);
    // 차트 간판 (📈)
    G.strokeStyle='#33ee99';G.lineWidth=2;G.beginPath();G.moveTo(sx-12,sy+6+bob);G.lineTo(sx-4,sy-2+bob);G.lineTo(sx+2,sy+2+bob);G.lineTo(sx+12,sy-8+bob);G.stroke();
    G.fillStyle='#33ee99';G.beginPath();G.moveTo(sx+12,sy-8+bob);G.lineTo(sx+7,sy-7+bob);G.lineTo(sx+11,sy-3+bob);G.closePath();G.fill();
    // 라벨 + 화살표
    const gl=Math.sin(shopEnt.fr*4)*0.4+0.6;
    G.globalAlpha=gl;G.fillStyle='#ffd24a';G.font='bold 11px Courier New';G.textAlign='center';
    G.fillText('🛒 증권상점',sx,sy-24+bob);G.globalAlpha=1;
    G.restore();
  }
  // 🏨 종원 2시즌스 호텔 (맵 건물)
  if(hotelEnt){

    G.fillStyle='#3a2c1e';G.fillRect(hx-22,hy-20+bob,44,32);     // 건물
    G.fillStyle='#5a4428';G.fillRect(hx-22,hy-20+bob,44,9);      // 차양(금색 호텔)

    G.fillStyle='#221a10';G.fillRect(hx-6,hy-2+bob,12,14);       // 입구
    // 반쪽 나무 로고 (4시즌스 패러디 — 오른쪽 가지 잘림)
    G.strokeStyle='#7ac04a';G.lineWidth=2;G.beginPath();G.moveTo(hx,hy-4+bob);G.lineTo(hx,hy-14+bob);G.moveTo(hx,hy-10+bob);G.lineTo(hx-5,hy-15+bob);G.stroke();

  pickups.forEach(pk=>drawPickup(pk));

  gems.forEach(g=>g.draw());
  coins.forEach(c=>c.draw());
  parts.forEach(p=>{G.save();G.globalAlpha=p.life/p.ml*0.9;G.fillStyle=p.col;G.fillRect(p.x-3,p.y-3,6,6);G.restore()});
  enemies.forEach(e=>e.draw());
  if(boss)boss.draw();

    G.globalAlpha=al*0.5;G.fillRect(s.x-3,s.y-3,6,6);G.restore();

  // 데미지 숫자
  dmgTexts.forEach(d=>{
    const al=Math.min(1,d.life/d.ml*2);
    const pop=1+Math.max(0,(d.life/d.ml-0.82))*3.4;  // 생성 직후 펀치 인 → 빠르게 1배

      G.fillStyle='#ffcc00';G.fillText('CRIT!',d.x,d.y-d.sz);
      G.shadowBlur=0;
    }
    G.fillStyle='#000';G.fillText(d.t,d.x+1,d.y+1);
    G.fillStyle=d.c;G.fillText(d.t,d.x,d.y);
    G.restore();
  });
  // 레벨업 버스트
  drawLvUpBursts();
  G.restore();
  // 번개 플래시 (전체화면)
  if(flashT>0){G.fillStyle=`rgba(180,200,255,${flashT*0.7})`;G.fillRect(0,0,LW,LH)}
  // 비네팅
  const vg=G.createRadialGradient(LW/2,LH/2,LH*0.3,LW/2,LH/2,LH*0.75);
  vg.addColorStop(0,'rgba(0,0,0,0)');vg.addColorStop(1,'rgba(0,0,0,0.55)');
  G.fillStyle=vg;G.fillRect(0,0,LW,LH);
  // HP 위험 시 가장자리 펄스
  if(player&&player.hp/player.mhp<0.25&&player.hp>0){
    const p=Math.sin(gameTime*7)*0.5+0.5;
    const dg=G.createRadialGradient(LW/2,LH/2,LH*0.3,LW/2,LH/2,LH*0.7);
    dg.addColorStop(0,'rgba(255,0,0,0)');dg.addColorStop(1,`rgba(255,0,0,${0.25+p*0.25})`);
    G.fillStyle=dg;G.fillRect(0,0,LW,LH);
  }
  // 피격 빨간 오버레이
  if(player&&player.flashT>0){G.fillStyle=`rgba(200,0,0,${player.flashT*0.45})`;G.fillRect(0,0,LW,LH)}
  // 기종 분노/휠체어 화면 비네팅
  if(player&&player.cd.id==='gj'){
    if(player.gjPhase==='rage'){
      const p=0.5+0.5*Math.sin(gameTime*10);

    }else if(player.gjPhase==='wheelchair'){

      G.fillStyle=vg;G.fillRect(0,0,LW,LH);

  if(boss&&boss.fogT>0){
    const fa=Math.min(1,boss.fogT)*(0.5+0.08*Math.sin(gameTime*4));
    const vg=G.createRadialGradient(LW/2,LH/2,LH*0.1,LW/2,LH/2,LH*0.5);
    vg.addColorStop(0,'rgba(40,10,30,0)');vg.addColorStop(0.6,`rgba(35,8,25,${fa*0.6})`);vg.addColorStop(1,`rgba(25,4,18,${fa})`);
    G.fillStyle=vg;G.fillRect(0,0,LW,LH);
  }
  drawHUD();
  drawPhialGauge();  // 차지 액스 페이얼 게이지 (좌하단 HUD)
  drawStockHUD();  // 지워니 주식 HUD
  drawCookHUD();   // 🍳 종원 요리 HUD (팬트리/버프)
  drawNerveInjectionArrow();  // 신경주사 화살표 (휠체어 모드)
  drawMinimap();
  drawNotifs();
  if(boss)boss.drawAnn();
  // 골드 카운터 (우상단 무기패널 위, 메타 진행)
  {
    G.save();
    G.fillStyle='rgba(0,0,0,0.55)';G.fillRect(LW-150,8,86,18);
    G.fillStyle='#ffdd55';G.font='bold 12px Courier New';G.textAlign='right';G.textBaseline='middle';
    G.fillText('🪙 '+Math.floor(runGold),LW-70,18);
    G.textBaseline='alphabetic';G.restore();
  }
  // 디버그 무적 배지 (켜져 있는 동안 항상 표시)
  if(godMode){
    const gp=0.6+0.4*Math.sin(gameTime*6);
    G.save();G.globalAlpha=gp;G.fillStyle='#ffdd44';
    G.font='bold 13px Courier New';G.textAlign='center';G.textBaseline='top';
    G.fillText('🛡️ GOD MODE (` 토글)',LW/2,30);
    G.textBaseline='alphabetic';G.restore();
  }
  // 윤소민 룰렛 + 결과 카드 + 야근 컷신
  drawRouletteAnim();
  drawResultCard();
  drawWorkCutscene();
  renderInvestResult();  // 지워니 투자 정산 결과 애니
  renderInvest();  // 지워니 투자창
  renderShop2();   // 지워니 상점
  renderHotel();   // 🏨 종원 요리 선택
  renderCook();    // 🔪 종원 칼질 미니게임
  if(paused)drawPauseOverlay();
  if(state==='levelup')renderLevelUp();
  if(state==='dead')renderResult(false);
  if(state==='win')renderResult(true);
}

// 픽업 그리기 (월드 좌표계)
function drawPickup(pk){
  const bob=Math.sin(pk.fr)*2;
  G.save();
  shadow(pk.x,pk.y+8,7,2,0.4);
  // 본체
  if(pk.t==='subsidy'){
    // 💸 긴급 지원금 — 금색 돈다발
    const gl=Math.sin(pk.fr*2)*0.3+0.7;
    G.globalAlpha=gl*0.4;G.fillStyle='#ffd24a';G.beginPath();G.arc(pk.x,pk.y+bob,13,0,Math.PI*2);G.fill();G.globalAlpha=1;
    G.fillStyle='#1f7a3a';G.fillRect(pk.x-9,pk.y-6+bob,18,12);
    G.fillStyle='#2faa55';G.fillRect(pk.x-9,pk.y-6+bob,18,3);
    G.fillStyle='#ffd24a';G.fillRect(pk.x-9,pk.y-1+bob,18,2);  // 띠
    G.fillStyle='#fff';G.font='bold 9px Courier New';G.textAlign='center';G.fillText('₩',pk.x,pk.y+3+bob);
  }else if(pk.t==='heal'){
    G.fillStyle='#55cc55';G.fillRect(pk.x-7,pk.y-7+bob,14,14);
    G.fillStyle='#88ee88';G.fillRect(pk.x-7,pk.y-7+bob,14,2);G.fillRect(pk.x-7,pk.y-7+bob,2,14);
    G.fillStyle='#338833';G.fillRect(pk.x+5,pk.y-7+bob,2,14);G.fillRect(pk.x-7,pk.y+5+bob,14,2);
    G.fillStyle='#fff';G.fillRect(pk.x-1,pk.y-4+bob,2,8);G.fillRect(pk.x-4,pk.y-1+bob,8,2);
  }else if(pk.t==='magnet'){
    G.fillStyle='#bb3333';G.fillRect(pk.x-7,pk.y-6+bob,4,9);G.fillRect(pk.x+3,pk.y-6+bob,4,9);
    G.fillStyle='#666';G.fillRect(pk.x-7,pk.y-6+bob,14,3);
    G.fillStyle='#999';G.fillRect(pk.x-7,pk.y-6+bob,14,1);
    G.fillStyle='#fff';G.fillRect(pk.x-6,pk.y-5+bob,2,1);G.fillRect(pk.x+4,pk.y-5+bob,2,1);
    G.fillStyle='#444';G.fillRect(pk.x-7,pk.y+1+bob,4,2);G.fillRect(pk.x+3,pk.y+1+bob,4,2);
  }else if(pk.t==='bomb'){
    G.fillStyle='#1a1a1a';G.beginPath();G.arc(pk.x,pk.y+1+bob,7,0,Math.PI*2);G.fill();
    G.fillStyle='#333';G.beginPath();G.arc(pk.x-2,pk.y-1+bob,3,0,Math.PI*2);G.fill();
    G.fillStyle='#444';G.fillRect(pk.x-1,pk.y-9+bob,2,3);
    const fl=Math.sin(pk.fr*4)*0.5+0.5;
    G.fillStyle=fl>0.5?'#ffaa00':'#ff5500';G.fillRect(pk.x-1,pk.y-12+bob,2,3);
    G.fillStyle='#fff';G.fillRect(pk.x,pk.y-11+bob,1,1);
  }else if(pk.t==='injection'){
    // 💉 신경주사 — 펄스하는 흰빛 + 주사기 형태
    const pulse=0.5+0.5*Math.sin(pk.fr*2);
    G.globalAlpha=0.6+pulse*0.4;
    G.fillStyle='#88ffaa';
    G.beginPath();G.arc(pk.x,pk.y+bob,14+pulse*4,0,Math.PI*2);G.fill();
    G.globalAlpha=0.9;
    G.fillStyle='#aaffcc';
    G.beginPath();G.arc(pk.x,pk.y+bob,8,0,Math.PI*2);G.fill();
    G.globalAlpha=1;
    // 주사기 몸체 (수직)
    G.fillStyle='#fff';G.fillRect(pk.x-2,pk.y-6+bob,4,10);
    G.fillStyle='#88ccff';G.fillRect(pk.x-1,pk.y-5+bob,2,8);  // 액체
    // 플런저
    G.fillStyle='#cccccc';G.fillRect(pk.x-3,pk.y-8+bob,6,2);
    G.fillStyle='#888';G.fillRect(pk.x-2,pk.y-9+bob,4,1);
    // 바늘
    G.fillStyle='#ddd';G.fillRect(pk.x-0.5,pk.y+4+bob,1,4);
    // 십자가 (의료)
    G.fillStyle='#ff4444';G.fillRect(pk.x-3,pk.y-2+bob,6,1);G.fillRect(pk.x-0.5,pk.y-4+bob,1,5);
  }
  // 깜빡이는 곧 사라짐 표시
  if(pk.life<4&&Math.floor(pk.life*5)%2===0){G.globalAlpha=0.4;G.fillStyle='#fff';G.fillRect(pk.x-8,pk.y-9+bob,16,16);}
  G.restore();
}

// 미니맵 (우하단) — 플레이어 중심 + 줌인. 플레이어가 항상 정중앙(눈에 띄게), 주변 적/픽업은 상대좌표.
function drawMinimap(){
  const mw=120,mh=120,mx=LW-mw-10,my=LH-mh-10,scale=mw/1500;  // ±750 유닛 줌인 (이전 ±1900 → 너무 멀어서 플레이어 안 보임)
  const cx=mx+mw/2,cy=my+mh/2;
  G.save();
  G.fillStyle='rgba(0,0,0,0.72)';G.fillRect(mx,my,mw,mh);
  G.strokeStyle='#444';G.lineWidth=1;G.strokeRect(mx,my,mw,mh);
  // 클리핑 (맵 영역 밖 그리기 방지)
  G.save();G.beginPath();G.rect(mx,my,mw,mh);G.clip();
  const rel=(wx,wy)=>({x:cx+(wx-player.x)*scale,y:cy+(wy-player.y)*scale});  // 플레이어 기준 상대좌표
  const inMap=p=>p.x>mx&&p.x<mx+mw&&p.y>my&&p.y<my+mh;
  // 적
  G.fillStyle='#ff5555';
  enemies.forEach(e=>{const p=rel(e.x,e.y);if(inMap(p))G.fillRect(p.x-1.2,p.y-1.2,2.6,2.6)});
  // 코인
  G.fillStyle='#ffcc22';
  coins.forEach(c=>{const p=rel(c.x,c.y);if(inMap(p))G.fillRect(p.x-1,p.y-1,2,2)});
  // 픽업
  G.fillStyle='#88ff88';
  pickups.forEach(pk=>{const p=rel(pk.x,pk.y);if(inMap(p))G.fillRect(p.x-2,p.y-2,4,4)});
  // 🛒 상점 (지워니) — 맵 밖이면 가장자리 화살표
  if(shopEnt){
    const p=rel(shopEnt.x,shopEnt.y),bl=Math.sin(gameTime*4)*0.5+0.5;
    if(inMap(p)){G.fillStyle='#ffd24a';G.fillRect(p.x-3,p.y-3,6,6);G.fillStyle='#000';G.font='6px Courier New';G.textAlign='center';G.fillText('$',p.x,p.y+2);}
    else{const a=Math.atan2(shopEnt.y-player.y,shopEnt.x-player.x);const ax=cx+Math.cos(a)*(mw/2-8),ay=cy+Math.sin(a)*(mh/2-8);
      G.save();G.globalAlpha=0.6+bl*0.4;G.translate(ax,ay);G.rotate(a);G.fillStyle='#ffd24a';G.beginPath();G.moveTo(6,0);G.lineTo(-4,-4);G.lineTo(-4,4);G.closePath();G.fill();G.restore();}
  }
  // 🏨 종원 호텔 마커
  if(hotelEnt){
    const p=rel(hotelEnt.x,hotelEnt.y),bl=Math.sin(gameTime*4)*0.5+0.5;
    if(inMap(p)){G.fillStyle='#ffcc44';G.fillRect(p.x-3,p.y-3,6,6);G.fillStyle='#000';G.font='6px Courier New';G.textAlign='center';G.fillText('H',p.x,p.y+2);}
    else{const a=Math.atan2(hotelEnt.y-player.y,hotelEnt.x-player.x);const ax=cx+Math.cos(a)*(mw/2-8),ay=cy+Math.sin(a)*(mh/2-8);
      G.save();G.globalAlpha=0.6+bl*0.4;G.translate(ax,ay);G.rotate(a);G.fillStyle='#ffcc44';G.beginPath();G.moveTo(6,0);G.lineTo(-4,-4);G.lineTo(-4,4);G.closePath();G.fill();G.restore();}
  }
  // 보스
  if(boss){
    const p=rel(boss.x,boss.y),bl=Math.sin(gameTime*5)*0.5+0.5;
    if(inMap(p)){G.fillStyle=`rgba(255,${30+bl*50},${30+bl*50},1)`;G.fillRect(p.x-3,p.y-3,7,7)}
    else{ // 맵 밖이면 가장자리 화살표
      const a=Math.atan2(boss.y-player.y,boss.x-player.x);
      const ax=cx+Math.cos(a)*(mw/2-8),ay=cy+Math.sin(a)*(mh/2-8);
      G.save();G.translate(ax,ay);G.rotate(a);
      G.fillStyle='#ff2222';G.beginPath();G.moveTo(6,0);G.lineTo(-4,-4);G.lineTo(-4,4);G.closePath();G.fill();
      G.restore();
    }
  }
  G.restore();  // clip 해제
  // 플레이어 (정중앙, 크고 명확 — 흰 링 + 캐릭색 + 진행방향 화살표)
  G.save();G.translate(cx,cy);
  const pulse=0.6+0.4*Math.sin(gameTime*4);
  G.globalAlpha=pulse;G.strokeStyle='#fff';G.lineWidth=2;G.beginPath();G.arc(0,0,6,0,Math.PI*2);G.stroke();
  G.globalAlpha=1;G.fillStyle=player.cd.color;G.beginPath();G.arc(0,0,4,0,Math.PI*2);G.fill();
  G.fillStyle='#fff';G.beginPath();G.arc(0,0,1.5,0,Math.PI*2);G.fill();
  // 진행방향 화살표
  G.rotate(Math.atan2(player.facing.y,player.facing.x));
  G.fillStyle='#ffffff';G.beginPath();G.moveTo(10,0);G.lineTo(5,-3.5);G.lineTo(5,3.5);G.closePath();G.fill();
  G.restore();
  // 라벨
  G.fillStyle='#888';G.font='8px Courier New';G.textAlign='left';G.fillText('MAP',mx+4,my+10);
  G.restore();
}

// 알림 (우상단, 무기 패널 아래)
function drawNotifs(){
  G.save();
  const baseY=LH-150;
  notifs.forEach((n,i)=>{
    const fade=n.life<0.5?n.life*2:Math.min(1,(n.ml-n.life)*4);
    const slide=Math.min(1,(n.ml-n.life)*5);
    const x=LW-10-(1-slide)*40,y=baseY+i*40;  // 36→40 더 여유
    G.globalAlpha=fade*0.95;
    // 배경 (높이 32→36 — 한글 위 잘림 방지)
    G.fillStyle='rgba(0,0,0,0.85)';G.fillRect(x-180,y-22,180,36);
    G.fillStyle=n.col;G.fillRect(x-180,y-22,3,36);
    G.fillStyle=n.col+'33';G.fillRect(x-177,y-22,177,36);
    // 텍스트 (제목과 부제 y 조정)
    G.fillStyle=n.col;G.font='bold 11px Courier New';G.textAlign='left';
    G.fillText(n.title,x-170,y-6);
    G.fillStyle='#ccc';G.font='9px Courier New';
    G.fillText(n.sub,x-170,y+8);
  });
  G.restore();
}

function drawPauseOverlay(){

  G.fillStyle='rgba(0,0,0,0.82)';G.fillRect(0,0,LW,LH);
  G.fillStyle='#ffdd66';G.font='bold 38px Courier New';G.textAlign='center';
  G.fillStyle='#000';G.fillText('⏸ PAUSED',LW/2+2,58);
  G.fillStyle='#ffdd66';G.fillText('⏸ PAUSED',LW/2,56);
  G.fillStyle='#aaa';G.font='11px Courier New';
  G.fillText('P / ESC 재개  ·  슬라이더로 볼륨 조절',LW/2,76);
  // 두 컬럼 빌드 표시 (압축)
  const colW=300,leftX=LW/2-colW-10,rightX=LW/2+10;
  const colH=240,colY=90;
  // 무기 컬럼
  G.fillStyle='rgba(20,20,30,0.85)';G.fillRect(leftX,colY,colW,colH);
  G.strokeStyle='#ff8866';G.lineWidth=1.5;G.strokeRect(leftX,colY,colW,colH);
  G.fillStyle='#ff8866';G.font='bold 12px Courier New';G.textAlign='left';
  G.fillText(`⚔ 무기 (${player.wpns.length}/${W_SLOTS})`,leftX+14,colY+18);
  for(let i=0;i<W_SLOTS;i++){
    const w=player.wpns[i],wy=colY+30+i*28;
    G.fillStyle='rgba(0,0,0,0.4)';G.fillRect(leftX+10,wy-2,colW-20,24);
    if(!w){G.fillStyle='#333';G.font='11px Courier New';G.fillText('(빈 슬롯)',leftX+18,wy+14);continue}
    const wd=WDEFS[w.type];if(!wd)continue;
    const maxed=wd.evolved||w.lv>=W_MAX_LV;
    G.fillStyle=wd.evolved?'#ffdd44':(maxed?'#ffaa44':'#fff');G.font='bold 11px Courier New';G.fillText(wd.name,leftX+18,wy+11);
    if(!wd.evolved){
      G.fillStyle='#222';G.fillRect(leftX+18,wy+15,170,4);
      G.fillStyle=maxed?'#ffdd44':'#ff8866';G.fillRect(leftX+18,wy+15,170*(w.lv/W_MAX_LV),4);
    }
    G.fillStyle=maxed?'#ffdd44':'#aaa';G.font='bold 10px Courier New';G.textAlign='right';
    G.fillText(wd.evolved?'★EVO':(maxed?'MAX':`L${w.lv}/${W_MAX_LV}`),leftX+colW-14,wy+15);
    G.textAlign='left';
  }
  // 아이템 컬럼
  G.fillStyle='rgba(20,20,30,0.85)';G.fillRect(rightX,colY,colW,colH);
  G.strokeStyle='#88ccff';G.lineWidth=1.5;G.strokeRect(rightX,colY,colW,colH);
  G.fillStyle='#88ccff';G.font='bold 12px Courier New';G.textAlign='left';
  G.fillText(`🎁 아이템 (${player.pCnt()}/${P_SLOTS})`,rightX+14,colY+18);
  const pIds=Object.keys(player.passives);
  for(let i=0;i<P_SLOTS;i++){
    const id=pIds[i],iy=colY+30+i*28;
    G.fillStyle='rgba(0,0,0,0.4)';G.fillRect(rightX+10,iy-2,colW-20,24);
    if(!id){G.fillStyle='#333';G.font='11px Courier New';G.fillText('(빈 슬롯)',rightX+18,iy+14);continue}
    const ps=PASSIVES.find(x=>x.id===id),lv=player.passives[id];
    if(!ps)continue;
    const maxed=lv>=P_MAX_LV;
    G.fillStyle=maxed?'#88ddff':'#fff';G.font='bold 11px Courier New';G.fillText(ps.name,rightX+18,iy+11);
    G.fillStyle='#222';G.fillRect(rightX+18,iy+15,170,4);
    G.fillStyle=maxed?'#88ddff':'#44aaff';G.fillRect(rightX+18,iy+15,170*(lv/P_MAX_LV),4);
    G.fillStyle=maxed?'#88ddff':'#aaa';G.font='bold 10px Courier New';G.textAlign='right';
    G.fillText(maxed?'MAX':`L${lv}/${P_MAX_LV}`,rightX+colW-14,iy+15);
    G.textAlign='left';
  }
  // ━━━ 진화 조합법 ━━━
  const rY=colY+colH+18;
  G.fillStyle='#ffaa66';G.font='bold 12px Courier New';G.textAlign='center';
  G.fillText('━━━ ✨ 진화 조합법 ━━━',LW/2,rY);
  G.fillStyle='#666';G.font='9px Courier New';
  G.fillText('무기 MAX + 페어 아이템 MAX → 레벨업 카드에서 진화 선택',LW/2,rY+12);
  RECIPES.forEach((r,i)=>{
    const col=i%2,row=Math.floor(i/2);
    const x=col*LW/2+20,y=rY+30+row*18;
    // 진행도 체크
    const w=player.wpns.find(ww=>ww.type===r[3]);
    const wLv=w?w.lv||0:0;
    const pLv=player.passives[r[4]]||0;
    const wMaxed=w&&wLv>=W_MAX_LV;
    const pMaxed=pLv>=P_MAX_LV;
    const evolvedRes=EVOS[r[3]]?.res;
    const done=player.wpns.some(ww=>ww.type===evolvedRes);
    let col1,col2,icon;
    if(done){col1='#88ff88';col2='#aaffaa';icon='✓'}
    else if(wMaxed&&pMaxed){col1='#ffdd44';col2='#ffeeaa';icon='★'}
    else if(w||pLv>0){col1='#aabbcc';col2='#ccddee';icon='▸'}
    else{col1='#555';col2='#777';icon='○'}
    G.fillStyle=col1;G.font='10px Courier New';G.textAlign='left';
    G.fillText(`${icon} `,x,y);
    G.fillStyle=w?col2:col1;G.fillText(r[0]+(w?` L${wLv}`:''),x+14,y);
    G.fillStyle=col1;G.fillText('+',x+95,y);
    G.fillStyle=pLv>0?col2:col1;G.fillText(r[1]+(pLv>0?` L${pLv}`:''),x+108,y);
    G.fillStyle=col1;G.fillText('→',x+200,y);
    G.fillStyle=col2;G.fillText(r[2],x+218,y);
  });
  // ━━━ 볼륨 슬라이더 ━━━ (ESC로 일시정지 후 조절 가능)
  const sliderY1=448, sliderY2=478, sliderSx=LW/2-140, sliderSw=280;
  // 섹션 라벨
  G.fillStyle='#aaa';G.font='9px Courier New';G.textAlign='center';
  G.fillText('━━━ 🔉 볼륨 조절 ━━━',LW/2,sliderY1-12);
  // BGM 슬라이더
  G.fillStyle='#fff';G.font='bold 10px Courier New';G.textAlign='left';
  G.fillText('🎵 BGM',sliderSx,sliderY1-2);
  G.fillStyle='#aaa';G.textAlign='right';G.fillText(`${Math.round(bgmVol*100)}%`,sliderSx+sliderSw,sliderY1-2);
  drawVolSlider(sliderSx,sliderY1+4,sliderSw,bgmVol,'#ff8844','bgm');
  // SFX 슬라이더
  G.fillStyle='#fff';G.font='bold 10px Courier New';G.textAlign='left';
  G.fillText('🔊 효과음',sliderSx,sliderY2-2);
  G.fillStyle='#aaa';G.textAlign='right';G.fillText(`${Math.round(sfxVol*100)}%`,sliderSx+sliderSw,sliderY2-2);
  drawVolSlider(sliderSx,sliderY2+4,sliderSw,sfxVol,'#44aaff','sfx');
  // 하단 통계
  G.fillStyle='#888';G.font='10px Courier New';G.textAlign='center';
  G.fillText(`Lv.${player.lv} · ${killCount} 처치 · 생존 ${String(Math.floor(gameTime/60)).padStart(2,'0')}:${String(Math.floor(gameTime%60)).padStart(2,'0')}`,LW/2,LH-12);
  G.restore();
}
// 일시정지 화면 볼륨 슬라이더 클릭 감지
function getPauseSliderAt(mx,my){
  if(!paused||state!=='playing')return null;
  const sx=LW/2-140, sw=280;
  if(mx>=sx-10&&mx<=sx+sw+10){
    if(my>=448&&my<=460)return {id:'bgm',x:sx,w:sw};
    if(my>=478&&my<=490)return {id:'sfx',x:sx,w:sw};
  }
  return null;
}

function loop(ts){const dt=Math.min((ts-lastTs)/1000,0.05);lastTs=ts;update(dt);render();requestAnimationFrame(loop)}
requestAnimationFrame(ts=>{lastTs=ts;requestAnimationFrame(loop)});
</script></body></html>
